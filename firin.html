<!doctype html>
<html lang="tr">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Ayder Sofra | Fırın</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>


<body>


<script type="module">

import {
  shell,
  listenOrders,
  setStatus,
  esc,
  toast
} from "./app.js";


/* ==================================================
   SAYFA
================================================== */

const content =
  shell(
    "Fırın",
    "Fırın siparişlerini takip edin."
  );


/* ==================================================
   FIRIN ARAYÜZÜ
================================================== */

content.innerHTML = `

  <main class="oven-page">


    <!-- ==========================================
         HERO
    =========================================== -->

    <section class="oven-hero">

      <div class="oven-hero-overlay"></div>


      <div class="oven-hero-content">


        <div class="oven-brand">
          AYDER SOFRA 🍽️
        </div>


        <div class="oven-title-row">

          <div>

            <div class="oven-label">
              🔥 FIRIN
            </div>

            <h1>
              Fırın Siparişleri
            </h1>

            <p>
              Fırından çıkan lezzetleri
              zamanında hazırlayın ve yönetin.
            </p>

          </div>


          <div class="oven-system-status">

            <span class="oven-status-dot"></span>

            Sistem Aktif

          </div>

        </div>


      </div>

    </section>



    <!-- ==========================================
         İSTATİSTİKLER
    =========================================== -->

    <section class="oven-stats">


      <div class="oven-stat-card">

        <div class="oven-stat-icon">
          📋
        </div>

        <div class="oven-stat-content">

          <span>
            AKTİF SİPARİŞ
          </span>

          <strong id="activeCount">
            0
          </strong>

          <small>
            Toplam aktif sipariş
          </small>

        </div>

      </div>



      <div class="oven-stat-card">

        <div class="oven-stat-icon preparing">
          🔥
        </div>

        <div class="oven-stat-content">

          <span>
            HAZIRLANIYOR
          </span>

          <strong id="preparingCount">
            0
          </strong>

          <small>
            Hazırlanmakta olan
          </small>

        </div>

      </div>



      <div class="oven-stat-card">

        <div class="oven-stat-icon ready">
          ✓
        </div>

        <div class="oven-stat-content">

          <span>
            HAZIR
          </span>

          <strong id="readyCount">
            0
          </strong>

          <small>
            Servise hazır
          </small>

        </div>

      </div>


    </section>



    <!-- ==========================================
         SİPARİŞ BÖLÜMÜ
    =========================================== -->

    <section class="oven-orders-section">


      <div class="oven-section-header">


        <div class="oven-section-title">


          <div class="oven-mini-icon">
            🔥
          </div>


          <div>

            <h2>
              FIRIN SİPARİŞLERİ
            </h2>

            <p>
              Fırına gönderilen aktif siparişler
            </p>

          </div>


        </div>


        <div class="oven-order-info">
          Canlı Siparişler
        </div>


      </div>



      <!-- ========================================
           SİPARİŞLER
      ========================================= -->

      <div
        id="orders"
        class="oven-orders-grid"
      ></div>


    </section>



    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer class="oven-footer">

      <div class="oven-footer-food">
        🥙
        🍕
        🫓
        🥙
      </div>

      <div class="oven-footer-text">
        Lezzet, ustalıkla pişer.
      </div>

    </footer>


  </main>

`;



/* ==================================================
   ELEMENTLER
================================================== */

const ordersEl =
  content.querySelector(
    "#orders"
  );


const activeCount =
  content.querySelector(
    "#activeCount"
  );


const preparingCount =
  content.querySelector(
    "#preparingCount"
  );


const readyCount =
  content.querySelector(
    "#readyCount"
  );



/* ==================================================
   STATUS
================================================== */

function getStatusInfo(status) {


  if (
    status === "preparing"
  ) {

    return {

      text:
        "HAZIRLANIYOR",

      icon:
        "🔥",

      className:
        "preparing"

    };

  }


  if (
    status === "ready"
  ) {

    return {

      text:
        "HAZIR",

      icon:
        "✓",

      className:
        "ready"

    };

  }


  return {

    text:
      "YENİ SİPARİŞ",

    icon:
      "●",

    className:
      "pending"

  };

}



/* ==================================================
   RENDER
================================================== */

function render(
  orders
) {


  /* ================================================
     AKTİF SİPARİŞLER
  ================================================ */

  const activeOrders =

    orders.filter(
      order =>

        [
          "pending",
          "preparing",
          "ready"
        ].includes(
          order.status
        )
    );



  /* ================================================
     SADECE FIRIN ÜRÜNLERİ OLAN SİPARİŞLER
  ================================================ */

  const ovenOrders =

    activeOrders.filter(
      order => {

        const items =
          order.items || [];


        return items.some(
          item =>
            item.department ===
            "firin"
        );

      }
    );



  /* ================================================
     İSTATİSTİKLER
  ================================================ */

  activeCount.textContent =
    ovenOrders.length;


  preparingCount.textContent =

    ovenOrders.filter(
      order =>
        order.status ===
        "preparing"
    ).length;


  readyCount.textContent =

    ovenOrders.filter(
      order =>
        order.status ===
        "ready"
    ).length;



  /* ================================================
     BOŞ
  ================================================ */

  if (
    !ovenOrders.length
  ) {

    ordersEl.innerHTML = `

      <div class="oven-empty">

        <div class="oven-empty-icon">
          🔥
        </div>

        <h3>
          Şu anda sipariş yok
        </h3>

        <p>
          Fırın için yeni sipariş geldiğinde
          burada görünecek.
        </p>

      </div>

    `;

    return;

  }



  /* ================================================
     SİPARİŞLER
  ================================================ */

  ordersEl.innerHTML =

    ovenOrders.map(
      order => {


        /* ==========================================
           FIRIN ÜRÜNLERİ
        =========================================== */

        const items =

          (
            order.items || []
          ).filter(
            item =>
              item.department ===
              "firin"
          );


        if (
          !items.length
        ) {

          return "";

        }



        /* ==========================================
           STATUS
        =========================================== */

        const status =
          getStatusInfo(
            order.status
          );



        /* ==========================================
           ITEMS
        =========================================== */

        const itemsHtml =

          items.map(
            item => `

              <div class="oven-product">

                <div class="oven-product-qty">

                  ${Number(
                    item.qty || 0
                  )}

                </div>


                <div class="oven-product-info">

                  <strong>
                    ${esc(
                      item.name
                    )}
                  </strong>

                </div>

              </div>

            `
          ).join("");



        /* ==========================================
           ACTION
        =========================================== */

        let actionHtml =
          "";


        if (
          order.status ===
          "pending"
        ) {

          actionHtml = `

            <button

              type="button"

              class="
                oven-action
                oven-action-start
              "

              data-id="${esc(
                order.id
              )}"

              data-status="preparing"

            >

              🔥
              HAZIRLAMAYA AL

            </button>

          `;

        }


        else if (
          order.status ===
          "preparing"
        ) {

          actionHtml = `

            <button

              type="button"

              class="
                oven-action
                oven-action-ready
              "

              data-id="${esc(
                order.id
              )}"

              data-status="ready"

            >

              ✓
              HAZIR

            </button>

          `;

        }


        else if (
          order.status ===
          "ready"
        ) {

          actionHtml = `

            <button

              type="button"

              class="
                oven-action
                oven-action-served
              "

              data-id="${esc(
                order.id
              )}"

              data-status="served"

            >

              🍽️
              SERVİS EDİLDİ

            </button>

          `;

        }



        /* ==========================================
           CARD
        =========================================== */

        return `

          <article
            class="
              oven-order-card
              ${status.className}
            "
          >


            <!-- CARD HEADER -->

            <div class="oven-card-header">


              <div>

                <span class="oven-table-label">
                  MASA
                </span>

                <h3 class="oven-table-number">

                  ${esc(
                    order.table
                  )}

                </h3>

              </div>


              <div
                class="
                  oven-order-status
                  ${status.className}
                "
              >

                ${status.icon}

                ${status.text}

              </div>


            </div>



            <!-- ITEMS -->

            <div class="oven-products">

              ${itemsHtml}

            </div>



            <!-- DIVIDER -->

            <div class="oven-divider"></div>



            <!-- ACTION -->

            <div class="oven-card-action">

              ${actionHtml}

            </div>


          </article>

        `;

      }
    ).join("");


}



/* ==================================================
   FIREBASE LISTENER
================================================== */

listenOrders(
  render
);



/* ==================================================
   BUTTON ACTIONS
================================================== */

ordersEl.addEventListener(

  "click",

  async event => {


    const button =

      event.target.closest(
        "[data-status]"
      );


    if (
      !button
    ) {

      return;

    }


    const id =
      button.dataset.id;


    const status =
      button.dataset.status;


    /* ==============================================
       BUTTON DISABLE
    ============================================== */

    button.disabled =
      true;


    try {


      await setStatus(
        id,
        status
      );


      toast(
        "Sipariş güncellendi."
      );


    }

    catch (
      error
    ) {


      console.error(
        "Fırın sipariş hatası:",
        error
      );


      toast(
        "Sipariş güncellenemedi.",
        "error"
      );


      button.disabled =
        false;

    }

  }

);

</script>

</body>

</html>
