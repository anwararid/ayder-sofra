<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayder Sofra - Mutfak</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #222;
  color: white;
  text-align: center;
  padding: 22px 10px;
}

header h1 {
  margin: 0;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.order {
  background: white;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.order.new {
  border-left: 6px solid #e53935;
}

.order h2 {
  margin-top: 0;
}

.order ul {
  padding-left: 25px;
}

.status {
  font-weight: bold;
  margin: 15px 0;
}

.ready {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #16803c;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.delivered {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #555;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.empty {
  background: white;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
}

.time {
  color: #777;
  font-size: 13px;
  margin-top: 5px;
}
</style>
</head>

<body>

<header>
  <h1>👨‍🍳 AYDER SOFRA</h1>
  <p>Mutfak Siparişleri</p>
</header>

<main id="orders">

  <div class="empty">
    Siparişler yükleniyor...
  </div>

</main>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyDhvLb2QMMe7dy-vQ_3bwKtZK5XXy8lbWM",
  authDomain: "ayder-sofra.firebaseapp.com",
  projectId: "ayder-sofra",
  storageBucket: "ayder-sofra.firebasestorage.app",
  messagingSenderId: "459245770853",
  appId: "1:459245770853:web:8d32163fef443a2b7c8e8c"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const ordersDiv =
  document.getElementById("orders");


// متابعة الطلبات لحظيًا
onSnapshot(
  collection(db, "orders"),
  (snapshot) => {

    ordersDiv.innerHTML = "";


    // نأخذ الطلبات الجديدة فقط
    const orders = [];

    snapshot.forEach((orderDoc) => {

      const data = orderDoc.data();

      if (data.status === "new") {

        orders.push({
          id: orderDoc.id,
          data: data
        });

      }

    });


    // الأحدث أولًا
    orders.reverse();


    if (orders.length === 0) {

      ordersDiv.innerHTML = `
        <div class="empty">
          ✅ لا توجد طلبات جديدة
        </div>
      `;

      return;
    }


    // عرض الطلبات
    orders.forEach((orderItem) => {

      const orderDocId =
        orderItem.id;

      const data =
        orderItem.data;


      const orderDiv =
        document.createElement("div");

      orderDiv.className =
        "order new";


      // رقم الطاولة
      const title =
        document.createElement("h2");

      title.textContent =
        "🔴 Masa " + data.table;


      // وقت الطلب
      const time =
        document.createElement("div");

      time.className = "time";

      if (data.createdAt) {

        const date =
          data.createdAt.toDate();

        time.textContent =
          "Sipariş zamanı: " +
          date.toLocaleTimeString(
            "tr-TR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );

      }


      // قائمة الطعام
      const list =
        document.createElement("ul");


      (data.items || []).forEach(
        (item) => {

          const li =
            document.createElement("li");

          li.textContent = item;

          list.appendChild(li);

        }
      );


      // الحالة
      const status =
        document.createElement("div");

      status.className =
        "status";

      status.textContent =
        "🔴 Yeni Sipariş";


      // زر جاهز
      const readyButton =
        document.createElement("button");

      readyButton.className =
        "ready";

      readyButton.textContent =
        "✅ Hazır";


      readyButton.onclick =
        async function() {

          readyButton.disabled = true;

          readyButton.textContent =
            "⏳ Hazırlanıyor...";


          try {

            await updateDoc(
              doc(
                db,
                "orders",
                orderDocId
              ),
              {
                status: "ready"
              }
            );

          } catch (error) {

            console.error(error);

            readyButton.disabled = false;

            readyButton.textContent =
              "✅ Hazır";

            alert(
              "Hata oluştu. Tekrar deneyin."
            );

          }

        };


      // زر تسليم
      const deliveredButton =
        document.createElement("button");

      deliveredButton.className =
        "delivered";

      deliveredButton.textContent =
        "📦 Teslim Edildi";


      deliveredButton.style.display =
        "none";


      // بعد الضغط على Hazır
      // يظهر زر Teslim Edildi
      readyButton.onclick =
        async function() {

          readyButton.disabled = true;

          readyButton.textContent =
            "⏳ Hazırlanıyor...";


          try {

            await updateDoc(
              doc(
                db,
                "orders",
                orderDocId
              ),
              {
                status: "ready"
              }
            );


            status.textContent =
              "✅ Hazır";


            readyButton.style.display =
              "none";


            deliveredButton.style.display =
              "block";


          } catch (error) {

            console.error(error);

            readyButton.disabled = false;

            readyButton.textContent =
              "✅ Hazır";

          }

        };


      // عند تسليم الطلب
      deliveredButton.onclick =
        async function() {

          deliveredButton.disabled =
            true;

          deliveredButton.textContent =
            "⏳ Siliniyor...";


          try {

            await deleteDoc(
              doc(
                db,
                "orders",
                orderDocId
              )
            );


          } catch (error) {

            console.error(error);

            deliveredButton.disabled =
              false;

            deliveredButton.textContent =
              "📦 Teslim Edildi";

            alert(
              "Sipariş silinemedi."
            );

          }

        };


      orderDiv.appendChild(title);

      orderDiv.appendChild(time);

      orderDiv.appendChild(list);

      orderDiv.appendChild(status);

      orderDiv.appendChild(readyButton);

      orderDiv.appendChild(deliveredButton);

      ordersDiv.appendChild(orderDiv);

    });

  },
  (error) => {

    console.error(error);

    ordersDiv.innerHTML = `
      <div class="empty">
        ❌ Firebase bağlantı hatası
      </div>
    `;

  }
);

</script>

</body>
</html>
