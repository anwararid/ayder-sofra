<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayder Sofra - Mutfak</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #222;
  color: white;
  text-align: center;
  padding: 22px 10px;
}

header h1 {
  margin: 0;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.order {
  background: white;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  border-left: 6px solid #e53935;
}

.order h2 {
  margin-top: 0;
}

.order ul {
  padding-left: 25px;
}

.status {
  font-weight: bold;
  margin: 15px 0;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

.ready {
  background: #16803c;
}

.delivered {
  background: #555;
}

.delete {
  background: #c62828;
}

.empty {
  background: white;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
}

.time {
  color: #777;
  font-size: 13px;
  margin-top: 5px;
}
</style>
</head>

<body>

<header>
  <h1>👨‍🍳 AYDER SOFRA</h1>
  <p>Mutfak Siparişleri</p>
</header>

<main id="orders">

  <div class="empty">
    Siparişler yükleniyor...
  </div>

</main>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyDhvLb2QMMe7dy-vQ_3bwKtZK5XXy8lbWM",
  authDomain: "ayder-sofra.firebaseapp.com",
  projectId: "ayder-sofra",
  storageBucket: "ayder-sofra.firebasestorage.app",
  messagingSenderId: "459245770853",
  appId: "1:459245770853:web:8d32163fef443a2b7c8e8c"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const ordersDiv =
  document.getElementById("orders");


// متابعة الطلبات
onSnapshot(
  collection(db, "orders"),
  (snapshot) => {

    ordersDiv.innerHTML = "";

    const orders = [];

    snapshot.forEach((orderDoc) => {

      const data = orderDoc.data();

      // نظهر فقط الطلبات الجديدة والجاهزة
      if (
        data.status === "new" ||
        data.status === "ready"
      ) {

        orders.push({
          id: orderDoc.id,
          data: data
        });

      }

    });


    // الأحدث أولًا
    orders.reverse();


    if (orders.length === 0) {

      ordersDiv.innerHTML = `
        <div class="empty">
          ✅ لا توجد طلبات
        </div>
      `;

      return;
    }


    orders.forEach((orderItem) => {

      const orderId =
        orderItem.id;

      const data =
        orderItem.data;


      const orderDiv =
        document.createElement("div");

      orderDiv.className =
        "order";


      // رقم الطاولة
      const title =
        document.createElement("h2");

      title.textContent =
        "🪑 Masa " + data.table;


      // الوقت
      const time =
        document.createElement("div");

      time.className = "time";

      if (data.createdAt) {

        const date =
          data.createdAt.toDate();

        time.textContent =
          "Sipariş zamanı: " +
          date.toLocaleTimeString(
            "tr-TR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );

      }


      // المنتجات
      const list =
        document.createElement("ul");


      (data.items || []).forEach(
        (item) => {

          const li =
            document.createElement("li");

          li.textContent = item;

          list.appendChild(li);

        }
      );


      // الحالة
      const status =
        document.createElement("div");

      status.className =
        "status";


      if (data.status === "ready") {

        status.textContent =
          "✅ Hazır";

      } else {

        status.textContent =
          "🔴 Yeni Sipariş";

      }


      // زر Hazır
      const readyButton =
        document.createElement("button");

      readyButton.className =
        "ready";

      readyButton.textContent =
        "✅ Hazır";


      // زر التسليم
      const deliveredButton =
        document.createElement("button");

      deliveredButton.className =
        "delivered";

      deliveredButton.textContent =
        "📦 Teslim Edildi";


      // زر الحذف
      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete";

      deleteButton.textContent =
        "🗑️ Sil";


      // إذا كان الطلب جاهزًا
      if (data.status === "ready") {

        readyButton.style.display =
          "none";

        deliveredButton.style.display =
          "block";

      } else {

        deliveredButton.style.display =
          "none";

      }


      // تجهيز الطلب
      readyButton.onclick =
        async function() {

          readyButton.disabled = true;

          readyButton.textContent =
            "⏳ Hazırlanıyor...";

          try {

            await updateDoc(
              doc(
                db,
                "orders",
                orderId
              ),
              {
                status: "ready"
              }
            );

          } catch (error) {

            console.error(error);

            readyButton.disabled = false;

            readyButton.textContent =
              "✅ Hazır";

            alert(
              "Hata oluştu."
            );

          }

        };


      // تسليم الطلب
      deliveredButton.onclick =
        async function() {

          const ok =
            confirm(
              "Masa " +
              data.table +
              " siparişi teslim edildi mi?"
            );

          if (!ok) return;


          deliveredButton.disabled =
            true;

          deliveredButton.textContent =
            "⏳ İşleniyor...";


          try {

            await deleteDoc(
              doc(
                db,
                "orders",
                orderId
              )
            );

          } catch (error) {

            console.error(error);

            deliveredButton.disabled =
              false;

            deliveredButton.textContent =
              "📦 Teslim Edildi";

            alert(
              "Sipariş silinemedi."
            );

          }

        };


      // حذف الطلب مباشرة
      deleteButton.onclick =
        async function() {

          const ok =
            confirm(
              "Bu siparişi silmek istediğinize emin misiniz?"
            );

          if (!ok) return;


          deleteButton.disabled =
            true;

          deleteButton.textContent =
            "⏳ Siliniyor...";


          try {

            await deleteDoc(
              doc(
                db,
                "orders",
                orderId
              )
            );

          } catch (error) {

            console.error(error);

            deleteButton.disabled =
              false;

            deleteButton.textContent =
              "🗑️ Sil";

            alert(
              "Sipariş silinemedi."
            );

          }

        };


      orderDiv.appendChild(title);

      orderDiv.appendChild(time);

      orderDiv.appendChild(list);

      orderDiv.appendChild(status);

      orderDiv.appendChild(readyButton);

      orderDiv.appendChild(deliveredButton);

      orderDiv.appendChild(deleteButton);

      ordersDiv.appendChild(orderDiv);

    });

  },
  (error) => {

    console.error(error);

    ordersDiv.innerHTML = `
      <div class="empty">
        ❌ Firebase bağlantı hatası
      </div>
    `;

  }
);

</script>

</body>
</html>
