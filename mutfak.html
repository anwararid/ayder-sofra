<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mutfak</title><link rel="stylesheet" href="styles.css"></head><body><script type="module">import{guard,shell,listenOrders,card,setStatus,toast}from"./app.js";guard(["mutfak"],u=>{let c=shell(u,"Mutfak İş Emirleri","Canlı sipariş kuyruğu");listenOrders(os=>{c.innerHTML=`<div class="grid">${os.filter(o=>["pending","preparing"].includes(o.status)).map(card).join("")||"<div class=card>Bekleyen sipariş yok.</div>"}</div>`;c.querySelectorAll(".action").forEach(b=>b.onclick=async()=>{await setStatus(b.dataset.id,b.dataset.s);toast("Sipariş güncellendi")})})});</script></body></html>
