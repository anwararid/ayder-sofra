<!doctype html>
<html lang="tr">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Ayder Sofra | Mutfak</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>

<script type="module">

import {
  shell,
  listenOrders,
  setStatus,
  money,
  esc,
  toast
} from "./app.js";


const content =
  shell(
    "Mutfak",
    "Mutfak siparişlerini takip edin."
  );


content.innerHTML = `
  <div
    id="orders"
    class="grid"
  ></div>
`;


const ordersEl =
  content.querySelector("#orders");


function render(orders) {

  const kitchenOrders =
    orders
      .filter(order =>
        ["pending", "preparing", "ready"].includes(
          order.status
        )
      )
      .map(order => {

        const kitchenItems =
          (order.items || []).filter(
            item => item.department === "mutfak"
          );

        return {
          ...order,
          kitchenItems
        };

      })
      .filter(order =>
        order.kitchenItems.length > 0
      );


  if (!kitchenOrders.length) {

    ordersEl.innerHTML = `
      <div class="card">

        <h3>Sipariş yok</h3>

        <p class="muted">
          Bekleyen mutfak siparişi bulunmuyor.
        </p>

      </div>
    `;

    return;

  }


  ordersEl.innerHTML =
    kitchenOrders.map(order => `

      <article class="card order-card">

        <div class="row">

          <div>

            <h2>
              Masa ${esc(order.table)}
            </h2>

            <span class="muted">
              ${esc(order.waiterName || "Garson")}
            </span>

          </div>


          <span class="badge">
            ${esc(order.status)}
          </span>

        </div>


        <hr>


        <div class="items">

          ${order.kitchenItems
            .map(item => `

              <div class="row">

                <span>
                  <b>${item.qty} ×</b>
                  ${esc(item.name)}
                </span>

                <b>
                  ${money(
                    Number(item.price || 0) *
                    Number(item.qty || 0)
                  )}
                </b>

              </div>

            `)
            .join("")}

        </div>


        <hr>


        <div class="actions">

          ${
            order.status === "pending"
              ? `
                <button
                  class="btn primary"
                  data-id="${order.id}"
                  data-status="preparing"
                >
                  Hazırlamaya Al
                </button>
              `
              : ""
          }


          ${
            order.status === "preparing"
              ? `
                <button
                  class="btn primary"
                  data-id="${order.id}"
                  data-status="ready"
                >
                  Sipariş Hazır
                </button>
              `
              : ""
          }


          ${
            order.status === "ready"
              ? `
                <button
                  class="btn primary"
                  data-id="${order.id}"
                  data-status="served"
                >
                  Servis Edildi
                </button>
              `
              : ""
          }

        </div>

      </article>

    `).join("");

}


listenOrders(render);


ordersEl.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        "[data-status]"
      );

    if (!button) return;


    button.disabled = true;


    try {

      await setStatus(
        button.dataset.id,
        button.dataset.status
      );


      toast(
        "Sipariş durumu güncellendi."
      );

    } catch (error) {

      console.error(error);

      button.disabled = false;

      toast(
        "Durum güncellenemedi.",
        "error"
      );

    }

  }
);

</script>

</body>
</html>
