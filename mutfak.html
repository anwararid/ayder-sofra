<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayder Sofra - Fırın Paneli</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #1e1e1e;
  color: #fff;
  padding: 15px;
}

header {
  background: #ef6c00;
  color: white;
  text-align: center;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

header h1 {
  margin: 0;
  font-size: 24px;
}

.orders-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 15px;
}

.order-card {
  background: #2d2d2d;
  border-left: 6px solid #ffa726;
  border-radius: 10px;
  padding: 15px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.order-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #444;
  padding-bottom: 8px;
  margin-bottom: 10px;
}

.table-badge {
  background: #ef6c00;
  color: white;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 18px;
  font-weight: bold;
}

.order-time {
  font-size: 12px;
  color: #aaa;
}

.item-list {
  list-style: none;
  padding: 0;
  margin: 0 0 15px 0;
}

.item-list li {
  padding: 6px 0;
  border-bottom: 1px dashed #444;
  font-size: 16px;
  display: flex;
  justify-content: space-between;
}

.btn-ready {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #2e7d32;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s;
}

.btn-ready:hover {
  background: #1b5e20;
}

.empty-msg {
  text-align: center;
  color: #888;
  font-size: 18px;
  grid-column: 1 / -1;
  padding: 50px 0;
}
</style>
</head>

<body>

<header>
  <h1>🥖 FIRIN PANELİ</h1>
  <p style="margin: 5px 0 0 0; font-size: 14px;">Bekleyen Fırın Siparişleri</p>
</header>

<div class="orders-grid" id="ordersGrid">
  <div class="empty-msg">Sipariş bekleniyor... ⏳</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  query,
  where,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDhvLb2QMMe7dy-vQ_3bwKtZK5XXy8lbWM",
  authDomain: "ayder-sofra.firebaseapp.com",
  projectId: "ayder-sofra",
  storageBucket: "ayder-sofra.firebasestorage.app",
  messagingSenderId: "459245770853",
  appId: "1:459245770853:web:8d32163fef443a2b7c8e8c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ordersGrid = document.getElementById("ordersGrid");
let lastOrderCount = 0;

// صوت تنبيه عند وصول طلب جديد
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep() {
  try {
    const osc = audioCtx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  } catch(e){}
}

// الاستماع لطلبات الفرن فقط status == "new" و station == "oven"
const q = query(
  collection(db, "orders"),
  where("station", "==", "oven"),
  where("status", "==", "new")
);

onSnapshot(q, (snapshot) => {
  ordersGrid.innerHTML = "";

  if (snapshot.empty) {
    ordersGrid.innerHTML = `<div class="empty-msg">Şu anda bekleyen fırın siparişi yok 😴</div>`;
    lastOrderCount = 0;
    return;
  }

  if (snapshot.docs.length > lastOrderCount) {
    playBeep();
  }
  lastOrderCount = snapshot.docs.length;

  snapshot.docs.forEach(docSnap => {
    const data = docSnap.data();
    const orderId = docSnap.id;

    // تجميع العناصر المكررة
    const itemCounts = {};
    if (data.items && Array.isArray(data.items)) {
      data.items.forEach(it => {
        const name = typeof it === "string" ? it : it.name;
        itemCounts[name] = (itemCounts[name] || 0) + 1;
      });
    }

    let itemsHTML = "";
    for (const [name, qty] of Object.entries(itemCounts)) {
      itemsHTML += `<li><span>${name}</span> <strong>x${qty}</strong></li>`;
    }

    const timeStr = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';

    const card = document.createElement("div");
    card.className = "order-card";
    card.innerHTML = `
      <div>
        <div class="order-header">
          <span class="table-badge">Masa ${data.table}</span>
          <span class="order-time">${timeStr}</span>
        </div>
        <ul class="item-list">
          ${itemsHTML}
        </ul>
      </div>
      <button class="btn-ready" onclick="markAsReady('${orderId}')">Hazır ✅</button>
    `;

    ordersGrid.appendChild(card);
  });
});

window.markAsReady = async function(id) {
  try {
    await updateDoc(doc(db, "orders", id), { status: "ready" });
  } catch(err) {
    console.error(err);
    alert("Hata oluştu!");
  }
};
</script>

</body>
</html>
