<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Ayder Sofra - Mutfak</title>


<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #222;
  color: white;
  text-align: center;
  padding: 22px 10px;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.order {
  background: white;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.order h2 {
  margin-top: 0;
}

.order ul {
  padding-left: 25px;
}

.status {
  font-weight: bold;
  margin: 15px 0;
}

.ready {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #16803c;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.delete {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 12px;
  background: #c62828;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.empty {
  background: white;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
}

</style>

</head>


<body>


<header>

<h1>👨‍🍳 AYDER SOFRA</h1>

<p>Mutfak Siparişleri</p>

</header>


<main id="orders">

<div class="empty">
Siparişler yükleniyor...
</div>

</main>



<script type="module">


/* FIREBASE */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

  apiKey:
    "AIzaSyDhvLb2QMMe7dy-vQ_3bwKtZK5XXy8lbWM",

  authDomain:
    "ayder-sofra.firebaseapp.com",

  projectId:
    "ayder-sofra",

  storageBucket:
    "ayder-sofra.firebasestorage.app",

  messagingSenderId:
    "459245770853",

  appId:
    "1:459245770853:web:8d32163fef443a2b7c8e8c"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


const ordersDiv =
  document.getElementById(
    "orders"
  );



/* =========================
   الطلبات
========================= */

onSnapshot(

  collection(db, "orders"),

  (snapshot) => {


    ordersDiv.innerHTML = "";


    const orders = [];


    snapshot.forEach(
      (orderDoc) => {

        const data =
          orderDoc.data();


        /*
          نعرض فقط الطلبات
          الجديدة أو الجاهزة
        */

        if (
          data.status === "new"
          ||
          data.status === "ready"
        ) {

          orders.push({

            id:
              orderDoc.id,

            data:
              data

          });

        }

      }
    );


    /*
      الأحدث أولًا
    */

    orders.sort(
      (a, b) => {

        const aTime =
          a.data.createdAt?.seconds || 0;

        const bTime =
          b.data.createdAt?.seconds || 0;

        return bTime - aTime;

      }
    );


    if (orders.length === 0) {

      ordersDiv.innerHTML = `

        <div class="empty">

          Henüz sipariş yok.

        </div>

      `;

      return;

    }



    orders.forEach(
      (orderItem) => {

        createOrderCard(
          orderItem.id,
          orderItem.data
        );

      }
    );

  },

  (error) => {

    console.error(
      "FIREBASE ERROR:",
      error
    );

    ordersDiv.innerHTML = `

      <div class="empty">

        Siparişler yüklenemedi.

      </div>

    `;

  }

);



/* =========================
   كرت الطلب
========================= */

function createOrderCard(
  orderId,
  data
) {


  const orderDiv =
    document.createElement(
      "div"
    );


  orderDiv.className =
    "order";



  /* العنوان */

  const title =
    document.createElement(
      "h2"
    );


  title.textContent =
    "🪑 Masa " +
    data.table;


  orderDiv.appendChild(
    title
  );



  /* الأصناف */

  const list =
    document.createElement(
      "ul"
    );


  const items =
    Array.isArray(data.items)
      ? data.items
      : [];


  items.forEach(
    (item) => {


      const li =
        document.createElement(
          "li"
        );


      /*
        هذا هو التصحيح المهم:
        إذا كان item Object
        نأخذ item.name
        وليس item كاملًا.
      */

      if (
        typeof item ===
        "object"
        &&
        item !== null
      ) {

        li.textContent =
          String(
            item.name || "Ürün"
          );

      }

      else {

        li.textContent =
          String(item);

      }


      list.appendChild(
        li
      );

    }
  );


  orderDiv.appendChild(
    list
  );



  /* الحالة */

  const status =
    document.createElement(
      "div"
    );


  status.className =
    "status";


  if (
    data.status ===
    "ready"
  ) {

    status.textContent =
      "✅ Hazır";

  }

  else {

    status.textContent =
      "🔴 Yeni Sipariş";

  }


  orderDiv.appendChild(
    status
  );



  /* زر جاهز */

  if (
    data.status !==
    "ready"
  ) {


    const readyButton =
      document.createElement(
        "button"
      );


    readyButton.className =
      "ready";


    readyButton.textContent =
      "✅ Hazır";


    readyButton.addEventListener(
      "click",
      async () => {

        try {

          await updateDoc(

            doc(
              db,
              "orders",
              orderId
            ),

            {
              status:
                "ready"
            }

          );

        }

        catch (error) {

          console.error(
            error
          );

          alert(
            "Sipariş durumu değiştirilemedi."
          );

        }

      }
    );


    orderDiv.appendChild(
      readyButton
    );

  }



  /* زر حذف */

  const deleteButton =
    document.createElement(
      "button"
    );


  deleteButton.className =
    "delete";


  deleteButton.textContent =
    "🗑️ Sil";


  deleteButton.addEventListener(
    "click",
    async () => {


      const ok =
        confirm(
          "Bu sipariş silinsin mi?"
        );


      if (!ok) {
        return;
      }


      try {


        await deleteDoc(

          doc(
            db,
            "orders",
            orderId
          )

        );


      }

      catch (error) {

        console.error(
          error
        );

        alert(
          "Sipariş silinemedi."
        );

      }

    }
  );


  orderDiv.appendChild(
    deleteButton
  );


  ordersDiv.appendChild(
    orderDiv
  );

}

</script>

</body>

</html>
