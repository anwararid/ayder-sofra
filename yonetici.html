<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ayder Sofra - Yönetim</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="brand">Ayder Sofra</div><div class="sub">Yönetim Paneli</div></header><main class="wrap"><div class="between"><h2>Yönetim</h2><button class="btn secondary" id="out">Çıkış</button></div><div class="nav"><a href="#masalar">Masalar</a><a href="#urunler">Ürünler</a><a href="#personel">Personel</a></div><section id="masalar" class="card"><div class="between"><h3>Masalar</h3><button class="btn primary" id="addTable">Masa Ekle</button></div><div id="tables" class="grid tables"></div></section><section id="urunler" class="card" style="margin-top:14px"><div class="between"><h3>Ürünler</h3><button class="btn primary" id="addProduct">Ürün Ekle</button></div><div id="products" class="list"></div></section><section id="personel" class="card" style="margin-top:14px"><h3>Personel Hesabı Ekle</h3><form id="staff"><div class="field"><label>Ad Soyad</label><input id="sname" required></div><div class="field"><label>E-posta</label><input id="semail" type="email" required></div><div class="field"><label>Şifre</label><input id="spass" type="password" minlength="6" required></div><div class="field"><label>Görev</label><select id="srole"><option value="garson">Garson</option><option value="mutfak">Mutfak</option><option value="firin">Fırın</option><option value="izgara">Izgara</option></select></div><button class="btn success">Personel Oluştur</button></form><div id="staffmsg"></div></section></main><div id="modal" class="modal hidden"><div class="modal-box"><div class="between"><h3 id="modalTitle"></h3><button class="btn secondary" id="close">Kapat</button></div><form id="productForm"><div class="field"><label>Ürün Adı</label><input id="pname" required></div><div class="field"><label>Fiyat (₺)</label><input id="pprice" type="number" min="0" required></div><div class="field"><label>Kategori</label><input id="pcat" required placeholder="Pide, Yemek, Izgara..."></div><div class="field"><label>Hazırlama Yeri</label><select id="pstation"><option value="mutfak">Mutfak</option><option value="firin">Fırın</option><option value="izgara">Izgara</option><option value="hazir">Hazır</option></select></div><button class="btn success">Kaydet</button></form></div></div><script type="module">
import{requireRole,live,db,logout,$,esc,money,createStaff}from"./app.js";import{collection,doc,setDoc,updateDoc,deleteDoc,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
requireRole(["admin"],()=>{ $("#out").onclick=logout;let editing=null;live("tables",ts=>{$("#tables").innerHTML=ts.sort((a,b)=>a.number-b.number).map(t=>`<div class="item"><div class="between"><b>Masa ${t.number}</b><span class="pill">${t.status==="empty"?"Boş":"Dolu"}</span></div><div class="row" style="margin-top:8px"><button class="btn ${t.active===false?"success":"warning"}" data-toggle="${t.id}" data-active="${t.active!==false}">${t.active===false?"Aktif Et":"Devre Dışı"}</button><button class="btn danger" data-del="${t.id}">Sil</button></div></div>`).join("");$$("[data-toggle]").forEach(b=>b.onclick=()=>updateDoc(doc(db,"tables",b.dataset.toggle),{active:b.dataset.active!=="true"}));$$("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Bu masa silinsin mi?"))await deleteDoc(doc(db,"tables",b.dataset.del))})});live("products",ps=>{$("#products").innerHTML=ps.map(p=>`<div class="item"><div class="between"><div><b>${esc(p.name)}</b><div class="small muted">${esc(p.category)} · ${p.station} · ${money(p.price)}</div></div><button class="btn danger" data-pdel="${p.id}">Sil</button></div></div>`).join("");$$("[data-pdel]").forEach(b=>b.onclick=async()=>{if(confirm("Ürün silinsin mi?"))await deleteDoc(doc(db,"products",b.dataset.pdel))})});
$("#addTable").onclick=async()=>{const n=Number(prompt("Yeni masa numarası:"));if(n)await setDoc(doc(db,"tables",`masa-${n}`),{number:n,name:`Masa ${n}`,status:"empty",active:true,createdAt:serverTimestamp()})};
$("#addProduct").onclick=()=>{editing=null;$("#modalTitle").textContent="Yeni Ürün";$("#pname").value="";$("#pprice").value="";$("#pcat").value="";$("#modal").classList.remove("hidden")};
$("#close").onclick=()=>$("#modal").classList.add("hidden");
$("#productForm").onsubmit=async e=>{e.preventDefault();await addDoc(collection(db,"products"),{name:$("#pname").value.trim(),price:Number($("#pprice").value),category:$("#pcat").value.trim(),station:$("#pstation").value,active:true,createdAt:serverTimestamp()});$("#modal").classList.add("hidden")};
$("#staff").onsubmit=async e=>{e.preventDefault();try{await createStaff($("#semail").value.trim(),$("#spass").value,$("#srole").value,$("#sname").value.trim());$("#staffmsg").innerHTML='<div class="notice ok">Personel hesabı oluşturuldu.</div>';e.target.reset()}catch(err){$("#staffmsg").innerHTML='<div class="notice error">Hesap oluşturulamadı: '+esc(err.message)+'</div>'}}});
</script></body></html>
