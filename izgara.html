<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Izgara</title><link rel="stylesheet" href="styles.css"></head><body><script type="module">import{guard,shell,listenOrders,card,setStatus,toast}from"./app.js";guard(["izgara"],u=>{let c=shell(u,"Izgara İş Emirleri");listenOrders(os=>{let a=os.filter(o=>["pending","preparing"].includes(o.status)&&(o.items||[]).some(i=>i.department==="izgara"));c.innerHTML=`<div class="grid">${a.map(card).join("")||"<div class=card>Bekleyen sipariş yok.</div>"}</div>`;c.querySelectorAll(".action").forEach(b=>b.onclick=async()=>{await setStatus(b.dataset.id,b.dataset.s);toast("Sipariş güncellendi")})})});</script></body></html>
