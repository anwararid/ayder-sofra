<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ayder Sofra - Izgara Paneli</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="brand">Ayder Sofra</div><div class="sub">Izgara Paneli</div></header><main class="wrap"><div class="between"><h2>Aktif Siparişler</h2><button class="btn secondary" id="out">Çıkış</button></div><div id="orders" class="list"></div></main><script type="module">
import{requireRole,db,logout,esc,money,$}from"./app.js";import{collection,query,where,onSnapshot,doc,updateDoc}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
requireRole(["izgara"],()=>{ $("#out").onclick=logout;const q=query(collection(db,"orders"),where("status","in",["open","preparing"]));onSnapshot(q,s=>{const orders=s.docs.map(d=>({id:d.id,...d.data()}));const station="izgara";const rows=[];orders.forEach(o=>{const items=(o.items||[]).filter(i=>i.station===station && i.status!=="ready");if(items.length)rows.push({o,items})});$("#orders").innerHTML=rows.length?rows.map(({o,items})=>`<div class="card preparing"><div class="between"><div><h3 style="margin:0">Masa ${o.tableNumber}</h3><span class="pill">Sipariş</span></div><small>${o.createdAt?.toDate?o.createdAt.toDate().toLocaleTimeString("tr-TR"):""}</small></div><div style="margin:12px 0">${items.map(i=>`<div class="item"><div class="between"><b>${esc(i.name)}</b><b>× ${i.quantity}</b></div></div>`).join("")}</div><button class="btn success" data-ready="${o.id}">Sipariş Hazır</button></div>`).join(""):`<div class="card"><p class="muted">Bekleyen sipariş yok.</p></div>`;$$("[data-ready]").forEach(b=>b.onclick=async()=>{const id=b.dataset.ready;const d=orders.find(x=>x.id===id);const stationItems=d.items.map(i=>i.station===station?{...i,status:"ready"}:i);const allReady=stationItems.every(i=>i.status==="ready"||i.station==="hazir");await updateDoc(doc(db,"orders",id),{items:stationItems,status:allReady?"ready":"preparing"});});});});
</script></body></html>
