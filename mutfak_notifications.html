<body>
<a href="./index.html" class="home-button">
  ← Ana Sayfa

<script type="module">

import {
  shell,
  listenOrders,
  setStatus,
  esc,
  toast
} from "./app.js";


/* ==================================================
   SAYFA
================================================== */

const content =
  shell(
    "Mutfak",
    "Mutfak siparişlerini takip edin."
  );
const existingHomeButton =
  document.querySelector(".home-button");

if (!existingHomeButton) {
  const homeButton = document.createElement("a");

  homeButton.href = "./index.html";
  homeButton.className = "home-button";
  homeButton.textContent = "← Ana Sayfa";

  document.body.appendChild(homeButton);
}

/* ==================================================
   MUTFAK ARAYÜZÜ
================================================== */

content.innerHTML = `

  <main class="kitchen-page">


    <!-- ==========================================
         DEKORATİF SU DAMLALARI
    =========================================== -->

    <div class="water-splash splash-one">
      💦
    </div>

    <div class="water-splash splash-two">
      💧
    </div>

    <div class="water-splash splash-three">
      💦
    </div>

    <div class="water-splash splash-four">
      💧
    </div>



    <!-- ==========================================
         HERO
    =========================================== -->

    <section class="kitchen-hero">


      <div class="kitchen-hero-overlay"></div>


      <div class="kitchen-hero-content">


        <div class="kitchen-brand">

        </div>


        <div class="kitchen-title-row">


          <div>

            <div class="kitchen-label">

            </div>


            <h1>

            <p>

            </p>

          </div>


          <div class="kitchen-system-status">

            <span class="kitchen-status-dot"></span>

            Sistem Aktif

          </div>


        </div>

      </div>

    </section>



    <!-- ==========================================
         İSTATİSTİKLER
    =========================================== -->

    <section class="kitchen-stats">


      <div class="kitchen-stat-card">


        <div class="kitchen-stat-icon">
          🍽️
        </div>


        <div class="kitchen-stat-content">

          <span>
            AKTİF SİPARİŞ
          </span>

          </strong>

          <small>
            Toplam aktif sipariş
          </small>

        </div>


      </div>



      <div class="kitchen-stat-card">


        <div class="kitchen-stat-icon preparing">
          👨‍🍳
        </div>


        <div class="kitchen-stat-content">

          <span>
            HAZIRLANIYOR
          </span>

          <strong id="preparingCount">
            0
          </strong>

          <small>
            Hazırlanmakta olan
          </small>

        </div>


      </div>



      <div class="kitchen-stat-card">


        <div class="kitchen-stat-icon ready">
          ✓
        </div>


        <div class="kitchen-stat-content">

          <span>
            HAZIR
          </span>

          <strong id="readyCount">
            0
          </strong>

          <small>
            Servise hazır
          </small>

        </div>


      </div>


    </section>



    <!-- ==========================================
         MUTFAK SİPARİŞLERİ
    =========================================== -->

    <section class="kitchen-orders-section">


      <div class="kitchen-section-header">


        <div class="kitchen-section-title">


          <div class="kitchen-mini-icon">
            🍽️
          </div>


          <div>

            <h2>
              MUTFAK SİPARİŞLERİ
            </h2>

            <p>
              Mutfağa gönderilen aktif siparişler
            </p>

          </div>


        </div>


        <div class="kitchen-order-info">
          💧 Canlı Siparişler
        </div>


      </div>



      <!-- ========================================
           SİPARİŞLER
      ========================================= -->

      <div
        id="orders"
        class="kitchen-orders-grid"
      ></div>


    </section>



    <!-- ==========================================
         MUTFAK ALT DEKORASYON
    =========================================== -->

    <section class="kitchen-food-decoration">

      <div class="food-plate">
        🐟
      </div>

      <div class="food-plate">
        🍲
      </div>

      <div class="food-plate">
        🥗
      </div>

      <div class="food-plate">
        🍽️
      </div>

      <div class="food-plate">
        🐟
      </div>

    </section>



    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer class="kitchen-footer">

      <div class="kitchen-footer-food">
        🐟

        🥗
        🍲

      </div>

      <div class="kitchen-footer-text">
        Tazelik, ustalıkla hazırlanır.
      </div>

    </footer>


  </main>

`;



/* ==================================================
   ELEMENTLER
================================================== */

const ordersEl =
  content.querySelector(
    "#orders"
  );


const activeCount =
  content.querySelector(
    "#activeCount"
  );


const preparingCount =
  content.querySelector(
    "#preparingCount"
  );


const readyCount =
  content.querySelector(
    "#readyCount"
  );



/* ==================================================
   STATUS
================================================== */

function getStatusInfo(
  status
) {


  if (
    status === "preparing"
  ) {

    return {

      text:
        "HAZIRLANIYOR",

      icon:
        "👨‍🍳",

      className:
        "preparing"

    };

  }


  if (
    status === "ready"
  ) {

    return {

      text:
        "HAZIR",

      icon:
        "✓",

      className:
        "ready"

    };

  }


  return {

    text:
      "YENİ SİPARİŞ",

    icon:
      "●",

    className:
      "pending"

  };

}



/* ==================================================
   RENDER
================================================== */

function render(
  orders
) {


  /* ================================================
     AKTİF SİPARİŞLER
  ================================================ */

  const activeOrders =

    orders.filter(
      order =>

        [
          "pending",
          "preparing",
          "ready"
        ].includes(
          order.status
        )
    );



  /* ================================================
     SADECE MUTFAK ÜRÜNLERİ
  ================================================ */

  const kitchenOrders =

    activeOrders.filter(
      order => {

        const items =
          order.items || [];


        return items.some(
          item =>
            item.department ===
            "mutfak"
        );

      }
    );



  /* ================================================
     İSTATİSTİKLER
  ================================================ */

  activeCount.textContent =
    kitchenOrders.length;


  preparingCount.textContent =

    kitchenOrders.filter(
      order =>
        order.status ===
        "preparing"
    ).length;


  readyCount.textContent =

    kitchenOrders.filter(
      order =>
        order.status ===
        "ready"
    ).length;



  /* ================================================
     BOŞ
  ================================================ */

  if (
    !kitchenOrders.length
  ) {

    ordersEl.innerHTML = `

      <div class="kitchen-empty">

        <div class="kitchen-empty-icon">
          🍽️
        </div>

        <h3>
          Şu anda sipariş yok
        </h3>

        <p>
          Mutfak için yeni sipariş geldiğinde
          burada görünecek.
        </p>

        <div class="kitchen-empty-food">
          🐟 💧 🍲
        </div>

      </div>

    `;

    return;

  }



  /* ================================================
     SİPARİŞLER
  ================================================ */

  ordersEl.innerHTML =

    kitchenOrders.map(
      order => {


        /* ==========================================
           MUTFAK ÜRÜNLERİ
        =========================================== */

        const items =

          (
            order.items || []
          ).filter(
            item =>
              item.department ===
              "mutfak"
          );


        if (
          !items.length
        ) {

          return "";

        }



        /* ==========================================
           STATUS
        =========================================== */

        const status =
          getStatusInfo(
            order.status
          );



        /* ==========================================
           ITEMS
        =========================================== */

        const itemsHtml =

          items.map(
            item => `

              <div class="kitchen-product">


                <div class="kitchen-product-qty">

                  ${Number(
                    item.qty || 0
                  )}

                </div>


                <div class="kitchen-product-info">

                  <strong>

                    ${esc(
                      item.name
                    )}

                  </strong>


                  ${
                    item.category
                      ? `
                        <small>
                          ${esc(
                            item.category
                          )}
                        </small>
                      `
                      : ""
                  }

                </div>


                <div class="kitchen-product-icon">

                  ${
                    String(
                      item.name || ""
                    )
                      .toLowerCase()
                      .includes("balık")
                      ||
                    String(
                      item.name || ""
                    )
                      .toLowerCase()
                      .includes("hamsi")
                      ||
                    String(
                      item.name || ""
                    )
                      .toLowerCase()
                      .includes("levrek")
                      ||
                    String(
                      item.name || ""
                    )
                      .toLowerCase()
                      .includes("çupra")
                      ? "🐟"
                      : "🍽️"
                  }

                </div>


              </div>

            `
          ).join("");



        /* ==========================================
           ACTION
        =========================================== */

        let actionHtml =
          "";


        if (
          order.status ===
          "pending"
        ) {

          actionHtml = `

            <button

              type="button"

              class="
                kitchen-action
                kitchen-action-start
              "

              data-id="${esc(
                order.id
              )}"

              data-status="preparing"

            >

              👨‍🍳
              HAZIRLAMAYA AL

            </button>

          `;

        }


        else if (
          order.status ===
          "preparing"
        ) {

          actionHtml = `

            <button

              type="button"

              class="
                kitchen-action
                kitchen-action-ready
              "

              data-id="${esc(
                order.id
              )}"

              data-status="ready"

            >

              ✓
              HAZIR

            </button>

          `;

        }


        else if (
          order.status ===
          "ready"
        ) {

          actionHtml = `

            <button

              type="button"

              class="
                kitchen-action
                kitchen-action-served
              "

              data-id="${esc(
                order.id
              )}"

              data-status="served"

            >

              🍽️
              SERVİS EDİLDİ

            </button>

          `;

        }



        /* ==========================================
           CARD
        =========================================== */

        return `

          <article
            class="
              kitchen-order-card
              ${status.className}
            "
          >


            <!-- CARD HEADER -->

            <div class="kitchen-card-header">


              <div>

                <span class="kitchen-table-label">
                  MASA
                </span>

                <h3 class="kitchen-table-number">

                  ${esc(
                    order.table
                  )}

                </h3>

              </div>


              <div
                class="
                  kitchen-order-status
                  ${status.className}
                "
              >

                ${status.icon}

                ${status.text}

              </div>


            </div>



            <!-- ITEMS -->

            <div class="kitchen-products">

              ${itemsHtml}

            </div>



            <!-- DIVIDER -->

            <div class="kitchen-divider"></div>



            <!-- ACTION -->

            <div class="kitchen-card-action">

              ${actionHtml}

            </div>


          </article>

        `;

      }
    ).join("");

}



/* ==================================================
   KITCHEN NOTIFICATION + SOUND
================================================== */

let kitchenAudioContext = null;
let previousKitchenOrders = new Set();
let kitchenNotificationStyleAdded = false;

function playKitchenNotificationSound() {
  try {
    if (!kitchenAudioContext) {
      kitchenAudioContext =
        new (window.AudioContext || window.webkitAudioContext)();
    }

    if (kitchenAudioContext.state === "suspended") {
      kitchenAudioContext.resume();
    }

    const now = kitchenAudioContext.currentTime;

    const oscillator = kitchenAudioContext.createOscillator();
    const gain = kitchenAudioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(880, now);
    oscillator.frequency.setValueAtTime(660, now + 0.18);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.35, now + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

    oscillator.connect(gain);
    gain.connect(kitchenAudioContext.destination);

    oscillator.start(now);
    oscillator.stop(now + 0.55);
  } catch (error) {
    console.error("Kitchen notification sound error:", error);
  }
}

function addKitchenNotificationStyles() {
  if (kitchenNotificationStyleAdded) return;

  const style = document.createElement("style");
  style.textContent = `
    .kitchen-notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      width: min(92vw, 430px);
      background: #ffffff;
      color: #17212b;
      border: 3px solid #d85e55;
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: 0 15px 45px rgba(0,0,0,.28);
      font-family: sans-serif;
      animation: kitchenNotificationIn .25s ease;
    }

    @keyframes kitchenNotificationIn {
      from {
        opacity: 0;
        transform: translate(-50%, -20px) scale(.96);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    .kitchen-notification-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .kitchen-notification-table {
      font-size: 19px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .kitchen-notification-items {
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 14px;
    }

    .kitchen-notification-close {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 11px;
      background: #164b5b;
      color: #ffffff;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }
  `;

  document.head.appendChild(style);
  kitchenNotificationStyleAdded = true;
}

function showKitchenNotification(order) {
  addKitchenNotificationStyles();

  const tableNumber =
    order.table ??
    order.tableNumber ??
    "Bilinmiyor";

  const kitchenItems = (order.items || []).filter(
    item => item.department === "mutfak"
  );

  if (!kitchenItems.length) return;

  const notification = document.createElement("div");
  notification.className = "kitchen-notification";

  const itemsHtml = kitchenItems.map(item => `
    <div>
      <strong>${Number(item.qty ?? item.quantity ?? 1)}</strong>
      × ${esc(item.name || "Ürün")}
    </div>
  `).join("");

  notification.innerHTML = `
    <div class="kitchen-notification-title">
      🔔 YENİ SİPARİŞ!
    </div>

    <div class="kitchen-notification-table">
      🍽️ Masa ${esc(tableNumber)}
    </div>

    <div class="kitchen-notification-items">
      ${itemsHtml}
    </div>

    <button
      type="button"
      class="kitchen-notification-close"
    >
      TAMAM
    </button>
  `;

  document.body.appendChild(notification);

  playKitchenNotificationSound();

  const closeButton = notification.querySelector(
    ".kitchen-notification-close"
  );

  closeButton.addEventListener("click", () => {
    notification.remove();
  });

  window.setTimeout(() => {
    if (notification.isConnected) {
      notification.remove();
    }
  }, 15000);
}


/* ==================================================
   FIREBASE LISTENER
================================================== */

listenOrders((orders) => {
  render(orders);

  const kitchenOrders = orders.filter(order => {
    const activeStatus = [
      "pending",
      "preparing",
      "ready"
    ].includes(order.status);

    const hasKitchenItems = (order.items || []).some(
      item => item.department === "mutfak"
    );

    return activeStatus && hasKitchenItems;
  });

  kitchenOrders.forEach(order => {
    if (
      order.status === "pending" &&
      !previousKitchenOrders.has(order.id)
    ) {
      showKitchenNotification(order);
    }
  });

  previousKitchenOrders = new Set(
    kitchenOrders.map(order => order.id)
  );
});



/* ==================================================
   BUTTON ACTIONS
================================================== */

ordersEl.addEventListener(

  "click",

  async event => {


    const button =

      event.target.closest(
        "[data-status]"
      );


    if (
      !button
    ) {

      return;

    }


    const id =
      button.dataset.id;


    const status =
      button.dataset.status;


    /* ==============================================
       BUTTON DISABLE
    ============================================== */

    button.disabled =
      true;


    try {


      await setStatus(
        id,
        status
      );


      toast(
        "Sipariş güncellendi."
      );


    }

    catch (
      error
    ) {


      console.error(
        "Mutfak sipariş hatası:",
        error
      );


      toast(
        "Sipariş güncellenemedi.",
        "error"
      );


      button.disabled =
        false;

    }

  }

);

</script>
