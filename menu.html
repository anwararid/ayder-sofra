<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قائمة الطعام - Ayder Sofra</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <!-- مكتبة Sortable للسحب والإفلات -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 31, 48, 0.85);
      --card-bg-hover: rgba(30, 41, 59, 0.9);
      --accent-color: #f97316;
      --accent-hover: #ea580c;
      --accent-gradient: linear-gradient(135deg, #f97316 0%, #d97706 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(249, 115, 22, 0.3);
      --glass-bg: rgba(11, 15, 25, 0.65);
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }

    body { 
    body { 
      background: linear-gradient(-45deg, #0b0f19, #1a0f0a, #1c1917, #0f172a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text-main); 
      padding-bottom: 100px; /* تضمن عدم تغطية الشريط على المنتجات */
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 20% 30%, rgba(249, 115, 22, 0.1) 0%, transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(217, 119, 6, 0.1) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .animated-bg-icons {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-icon {
      position: absolute;
      color: rgba(249, 115, 22, 0.12);
      font-size: 2.2rem;
      animation: floatFood 18s linear infinite;
      user-select: none;
    }

    .bg-icon:nth-child(1) { top: 10%; left: 8%; animation-duration: 16s; font-size: 2.8rem; }
    .bg-icon:nth-child(2) { top: 25%; left: 82%; animation-duration: 22s; font-size: 2.2rem; animation-delay: -3s; }
    .bg-icon:nth-child(3) { top: 45%; left: 15%; animation-duration: 19s; font-size: 2.5rem; animation-delay: -7s; }
    .bg-icon:nth-child(4) { top: 65%; left: 75%; animation-duration: 25s; font-size: 3rem; animation-delay: -2s; }
    .bg-icon:nth-child(5) { top: 85%; left: 25%; animation-duration: 20s; font-size: 2.4rem; animation-delay: -5s; }
    .bg-icon:nth-child(6) { top: 15%; left: 60%; animation-duration: 21s; font-size: 2.6rem; animation-delay: -10s; }
    .bg-icon:nth-child(7) { top: 78%; left: 88%; animation-duration: 17s; font-size: 2.3rem; animation-delay: -8s; }

    @keyframes floatFood {
      0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.1; }
      50% { transform: translateY(-30px) rotate(180deg) scale(1.15); opacity: 0.22; }
      100% { transform: translateY(0) rotate(360deg) scale(1); opacity: 0.1; }
    }

    .admin-section {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      margin: 16px;
      border: 1px solid var(--border-accent);
      direction: ltr;
      text-align: left;
      box-shadow: var(--shadow-lg);
      display: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .admin-title { 
      color: var(--accent-color); 
      font-size: 1.15rem; 
      margin-bottom: 14px; 
      font-weight: 800; 
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-muted); font-weight: 500; text-align: right; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.7);
      color: #fff;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.25s ease;
      direction: rtl;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { 
      border-color: var(--accent-color); 
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
    }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .btn-add {
      background: var(--accent-gradient);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      width: 100%;
      font-size: 0.95rem;
      margin-top: 5px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
    }
    .btn-add:active { transform: scale(0.98); }
    .btn-add:hover { opacity: 0.95; }

    .link-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 18px;
      text-align: right;
      direction: rtl;
    }
    .link-title { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 700; }
    .link-container { display: flex; gap: 8px; align-items: center; }
    .link-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      background: rgba(22, 31, 48, 0.8);
      color: #38bdf8;
      border-radius: 8px;
      font-size: 0.85rem;
      direction: ltr;
      text-align: left;
    }
    .btn-copy {
      background: #334155;
      color: #f8fafc;
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn-copy:hover { background: #475569; }

    header {
      text-align: center;
      padding: 16px 20px;
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 90;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }
    .back-btn {
      position: absolute;
      right: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.05rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .back-btn:active { transform: scale(0.92); }

    .container { position: relative; z-index: 1; padding: 18px 16px; max-width: 600px; margin: 0 auto; }

    .categories-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .category-card {
      position: relative;
      height: 155px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      cursor: pointer;
      border: 1px solid var(--border-color);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 14px;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }
    .category-card:active { transform: scale(0.97); }
    .category-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(11, 15, 25, 0.1) 20%, rgba(11, 15, 25, 0.92) 100%);
      transition: opacity 0.3s ease;
    }
    .category-title {
      position: relative;
      z-index: 1;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 800;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      letter-spacing: -0.2px;
    }

    .products-list { display: flex; flex-direction: column; gap: 18px; }
    .product-card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }
    .product-img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
      background-color: rgba(15, 23, 42, 0.5);
    }
    .product-info {
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(22, 31, 48, 0.4) 0%, rgba(22, 31, 48, 0.9) 100%);
    }
    .product-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .product-name { font-size: 1.2rem; font-weight: 800; color: #ffffff; }
    .product-desc { font-size: 0.85rem; color: var(--text-muted); font-weight: 400; }
    .product-price {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
      background: var(--accent-gradient);
      padding: 6px 14px;
      border-radius: 30px;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.35);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .sortable-ghost { opacity: 0.3; border: 2px dashed var(--accent-color) !important; transform: scale(0.98); }
    .drag-handle {
      position: absolute;
      top: 12px; right: 12px; z-index: 2;
      background: rgba(15, 23, 42, 0.85); color: var(--accent-color);
      border: 1px solid rgba(255,255,255,0.15);
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px);
      box-shadow: var(--shadow-sm);
    }
    .admin-actions {
      position: absolute; top: 12px; left: 12px; z-index: 2; display: flex; gap: 8px;
    }
    .btn-action-item {
      background: rgba(15, 23, 42, 0.85); color: white;
      border: 1px solid rgba(255,255,255,0.15);
      width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px);
      transition: transform 0.2s;
    }
    .btn-action-item:active { transform: scale(0.9); }
    .btn-action-item.delete { background: rgba(239, 68, 68, 0.9); }
    .btn-action-item.edit { background: rgba(249, 115, 22, 0.9); }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(8px);
      z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-box {
      background: var(--card-bg); border: 1px solid var(--border-accent);
      border-radius: 20px; padding: 24px; width: 100%; max-width: 420px; direction: rtl;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      background-color: var(--glass-bg); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color); 
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 0;
      z-index: 1000;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.4);
    }
    .nav-item { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      color: var(--text-muted); 
      text-decoration: none; 
      font-size: 0.75rem; 
      gap: 5px;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-item i { font-size: 1.15rem; }
    .nav-item.active { color: var(--accent-color); font-weight: 800; }
  </style>
</head>
<body>

  <div class="animated-bg-icons">
    <i class="fas fa-drumstick-bite bg-icon"></i>
    <i class="fas fa-fire bg-icon"></i>      
    <i class="fas fa-utensils bg-icon"></i>  
    <i class="fas fa-pizza-slice bg-icon"></i>
    <i class="fas fa-burger bg-icon"></i>    
    <i class="fas fa-bread-slice bg-icon"></i>
    <i class="fas fa-fire-burner bg-icon"></i>
  </div>

  <div id="admin-panel" class="admin-section">
    <div class="admin-title"><i class="fas fa-sliders"></i> Yönetim Paneli (لوحة التحكم)</div>
    
    <div class="link-card">
      <div class="link-title">رابط صفحة الزبائن:</div>
      <div class="link-container">
        <input type="text" id="customer-url-input" class="link-input" readonly>
        <button type="button" class="btn-copy" onclick="copyCustomerLink()"><i class="fas fa-copy"></i> نسخ</button>
      </div>
    </div>

    <!-- Form 1: Add Category -->
    <form id="add-category-form" style="margin-bottom: 18px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px;">
      <div class="admin-title" style="font-size: 0.95rem; color: #fff;"><i class="fas fa-folder-plus"></i> 1. Yeni Kategori Ekle (إضافة قسم)</div>
      <div class="form-row">
        <div class="form-group">
          <label>اسم القسم *</label>
          <input type="text" id="cat-name" required placeholder="مثال: المشويات">
        </div>
        <div class="form-group">
          <label>صورة القسم *</label>
          <input type="file" id="cat-img-file" accept="image/*" required>
        </div>
      </div>
      <button type="submit" class="btn-add" id="btn-cat-submit">إضافة القسم</button>
    </form>

    <!-- Form 2: Add Product -->
    <form id="add-product-form">
      <div class="admin-title" style="font-size: 0.95rem; color: #fff;"><i class="fas fa-utensils"></i> 2. Yeni Ürün Ekle (إضافة منتج)</div>
      <div class="form-row">
        <div class="form-group">
          <label>القسم *</label>
          <select id="prod-cat-select" required></select>
        </div>
        <div class="form-group">
          <label>اسم المنتج *</label>
          <input type="text" id="prod-name" required placeholder="مثال: كباب أدنة">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>السعر (TL) *</label>
          <input type="number" id="prod-price" required placeholder="250">
        </div>
        <div class="form-group">
          <label>صورة المنتج *</label>
          <input type="file" id="prod-img-file" accept="image/*" required>
        </div>
      </div>
      <div class="form-group">
        <label>الوصف / المكونات (اختياري)</label>
        <input type="text" id="prod-desc" placeholder="مثال: يقدم مع سلطة وأرز ومقبلات">
      </div>
      <button type="submit" class="btn-add" id="btn-prod-submit">إضافة المنتج</button>
    </form>
  </div>

  <header>
    <button class="back-btn" id="back-btn" onclick="handleBackButtonClick()"><i class="fas fa-arrow-right"></i></button>
    <span id="header-title">أنواع المأكولات</span>
  </header>

  <div class="container">
    <div class="categories-grid" id="categories-grid"></div>
    <div class="products-list" id="products-list" style="display: none;"></div>
  </div>

  <div class="modal-overlay" id="edit-modal">
    <div class="modal-box">
      <div class="modal-header" style="color: var(--accent-color); font-weight: 800; font-size: 1.1rem; margin-bottom: 16px;"><i class="fas fa-pen-to-square"></i> تعديل المنتج</div>
      <form id="edit-product-form">
        <input type="hidden" id="edit-prod-id">
        <input type="hidden" id="edit-prod-cat-id">
        <div class="form-group"><label>اسم المنتج</label><input type="text" id="edit-prod-name" required></div>
        <div class="form-group"><label>السعر (TL)</label><input type="number" id="edit-prod-price" required></div>
        <div class="form-group"><label>الوصف (اختياري)</label><input type="text" id="edit-prod-desc"></div>
        <div class="form-group"><label>تغيير الصورة (اختياري)</label><input type="file" id="edit-prod-img-file" accept="image/*"></div>
        <div style="display: flex; gap: 10px; margin-top: 18px;">
          <button type="submit" class="btn-add" id="btn-edit-submit">حفظ التعديلات</button>
          <button type="button" class="btn-add" style="background: #334155; box-shadow: none;" onclick="closeEditModal()">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="#" class="nav-item"><i class="fab fa-instagram"></i><span>التواصل</span></a>
    <a href="#" class="nav-item"><i class="fas fa-moon"></i><span>الوضع الداكن</span></a>
    <a href="#" class="nav-item active" onclick="showCategories(true); return false;"><i class="fas fa-home"></i><span>الرئيسية</span></a>
    <a href="#" class="nav-item"><i class="fas fa-phone"></i><span>اتصل بنا</span></a>
    <a href="#" class="nav-item"><i class="fas fa-globe"></i><span>اللغات</span></a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, doc, setDoc, onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // تم تحديث الإعدادات الصحيحة لمشروعك ayder-sofra-menu
    const firebaseConfig = {
      apiKey: "AIzaSyDqXRdRZWIg62PSVhbCykdbhCFpJRoKJzU",
      authDomain: "ayder-sofra-menu.firebaseapp.com",
      projectId: "ayder-sofra-menu",
      storageBucket: "ayder-sofra-menu.firebasestorage.app",
      messagingSenderId: "449445077857",
      appId: "1:449445077857:web:27a50e0205958b8875db20",
      measurementId: "G-M6NXV8SN8S"
    };

    // مفتاح API الخاص بـ ImgBB
    const IMGBB_API_KEY = "c31f56f4900f3be167acad1082a14896";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const menuDocRef = doc(db, "restaurant", "menu");

    const ADMIN_SECRET_KEY = 'admin';
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('mode') === ADMIN_SECRET_KEY;
    const isCustomer = !isAdmin;

    let categories = [];
    let products = [];
    let currentCatId = null;

    onSnapshot(menuDocRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        categories = data.categories || [];
        products = data.products || [];
      } else {
        categories = [];
        products = [];
      }
      
      if (!isCustomer) updateAdminSelect();
      
      if (currentCatId) {
        const cat = categories.find(c => c.id == currentCatId);
        if (cat) openCategory(cat, false);
        else showCategories(false);
      } else {
        renderCategories();
      }
    });

    async function syncToFirestore() {
      try {
        await setDoc(menuDocRef, { categories, products });
      } catch (err) {
        console.error("خطأ في المزامنة:", err);
        alert("حدث خطأ أثناء حفظ البيانات في Cloud Firestore!");
      }
    }

    async function uploadImageToImgBB(file) {
      const formData = new FormData();
      formData.append("image", file);
      
      const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: "POST",
        body: formData
      });

      const data = await response.json();
      if (data.success) {
        return data.data.url;
      } else {
        throw new Error(data.error ? data.error.message : "فشل رفع الصورة على ImgBB");
      }
    }

    function initApp() {
      if (isCustomer) {
        document.getElementById('admin-panel').style.display = 'none';
      } else {
        document.getElementById('admin-panel').style.display = 'block';
        document.getElementById('customer-url-input').value = window.location.href.split('?')[0];
        initDragAndDrop();
      }
      checkUrlState();
    }

    function initDragAndDrop() {
      const catContainer = document.getElementById('categories-grid');
      Sortable.create(catContainer, {
        animation: 200,
        delay: 150,
        delayOnTouchOnly: true,
        ghostClass: 'sortable-ghost',
        onEnd: function () {
          const newOrderIds = Array.from(catContainer.children).map(el => parseInt(el.getAttribute('data-id')));
          categories.sort((a, b) => newOrderIds.indexOf(a.id) - newOrderIds.indexOf(b.id));
          syncToFirestore();
        }
      });

      const prodContainer = document.getElementById('products-list');
      Sortable.create(prodContainer, {
        animation: 200,
        delay: 150,
        delayOnTouchOnly: true,
        ghostClass: 'sortable-ghost',
        onEnd: function () {
          if (!currentCatId) return;
          const newOrderIds = Array.from(prodContainer.children).map(el => parseInt(el.getAttribute('data-id')));
          const currentCatProducts = products.filter(p => p.catId === currentCatId);
          currentCatProducts.sort((a, b) => newOrderIds.indexOf(a.id) - newOrderIds.indexOf(b.id));

          const otherProducts = products.filter(p => p.catId !== currentCatId);
          products = [...otherProducts, ...currentCatProducts];
          syncToFirestore();
        }
      });
    }

    function checkUrlState() {
      const catId = new URLSearchParams(window.location.search).get('cat');
      if (catId) {
        const cat = categories.find(c => c.id == catId);
        if (cat) { openCategory(cat, false); return; }
      }
      showCategories(false);
    }

    window.addEventListener('popstate', checkUrlState);

    window.copyCustomerLink = function() {
      const input = document.getElementById('customer-url-input');
      input.select();
      navigator.clipboard.writeText(input.value).then(() => alert('تم نسخ رابط الزبائن بنجاح!'));
    };

    function updateAdminSelect() {
      const select = document.getElementById('prod-cat-select');
      select.innerHTML = '';
      if (categories.length === 0) {
        select.innerHTML = '<option value="" disabled selected>يرجى إضافة قسم أولاً</option>';
      } else {
        categories.forEach(c => select.innerHTML += `<option value="${c.id}">${c.name}</option>`);
      }
    }

    function renderCategories() {
      const grid = document.getElementById('categories-grid');
      grid.innerHTML = '';
      if (categories.length === 0) {
        grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#888; padding:30px 0;">لا توجد أقسام مضافة بعد.</p>';
        return;
      }
      categories.forEach(cat => {
        const card = document.createElement('div');
        card.className = 'category-card';
        card.setAttribute('data-id', cat.id);
        card.style.backgroundImage = `url('${cat.img}')`;
        card.onclick = () => openCategory(cat, true);
        card.innerHTML = `
          ${!isCustomer ? `
            <div class="drag-handle"><i class="fas fa-grip-vertical"></i></div>
            <div class="admin-actions">
              <button class="btn-action-item delete" onclick="deleteCategory(event, ${cat.id})"><i class="fas fa-times"></i></button>
            </div>
          ` : ''}
          <div class="category-title">${cat.name}</div>
        `;
        grid.appendChild(card);
      });
    }

    function openCategory(cat, pushState = true) {
      currentCatId = cat.id;
      if (pushState) {
        const params = new URLSearchParams(window.location.search);
        params.set('cat', cat.id);
        history.pushState({ catId: cat.id }, '', '?' + params.toString());
      }

      document.getElementById('categories-grid').style.display = 'none';
      document.getElementById('products-list').style.display = 'flex';
      document.getElementById('back-btn').style.display = 'flex';
      document.getElementById('header-title').innerText = cat.name;

      const list = document.getElementById('products-list');
      list.innerHTML = '';
      const filteredProducts = products.filter(p => p.catId === cat.id);

      if (filteredProducts.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#888; padding: 40px 0;">لا توجد منتجات في هذا القسم حالياً.</p>';
        return;
      }

      filteredProducts.forEach(prod => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.setAttribute('data-id', prod.id);
        card.innerHTML = `
          ${!isCustomer ? `
            <div class="drag-handle"><i class="fas fa-grip-vertical"></i></div>
            <div class="admin-actions">
              <button class="btn-action-item edit" onclick="openEditModal(event, ${prod.id})"><i class="fas fa-pen"></i></button>
              <button class="btn-action-item delete" onclick="deleteProduct(event, ${prod.id}, ${cat.id})"><i class="fas fa-times"></i></button>
            </div>
          ` : ''}
          <img src="${prod.img}" class="product-img" alt="${prod.name}">
          <div class="product-info">
            <div class="product-details">
              <div class="product-name">${prod.name}</div>
              ${prod.desc ? `<div class="product-desc">${prod.desc}</div>` : ''}
            </div>
            <div class="product-price">${prod.price},00 ₺</div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    window.handleBackButtonClick = function() { history.back(); };

    window.showCategories = function(pushState = true) {
      currentCatId = null;
      if (pushState) {
        const params = new URLSearchParams(window.location.search);
        params.delete('cat');
        history.pushState(null, '', params.toString() ? '?' + params.toString() : window.location.pathname);
      }
      document.getElementById('categories-grid').style.display = 'grid';
      document.getElementById('products-list').style.display = 'none';
      document.getElementById('back-btn').style.display = 'none';
      document.getElementById('header-title').innerText = 'أنواع المأكولات';
      renderCategories();
    };

    window.openEditModal = function(e, prodId) {
      e.stopPropagation();
      const prod = products.find(p => p.id === prodId);
      if (!prod) return;
      document.getElementById('edit-prod-id').value = prod.id;
      document.getElementById('edit-prod-cat-id').value = prod.catId;
      document.getElementById('edit-prod-name').value = prod.name;
      document.getElementById('edit-prod-price').value = prod.price;
      document.getElementById('edit-prod-desc').value = prod.desc || '';
      document.getElementById('edit-prod-img-file').value = '';
      document.getElementById('edit-modal').style.display = 'flex';
    };

    window.closeEditModal = function() {
      document.getElementById('edit-modal').style.display = 'none';
    };

    document.getElementById('edit-product-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-edit-submit');
      const prodId = parseInt(document.getElementById('edit-prod-id').value);
      const prod = products.find(p => p.id === prodId);
      if (!prod) return;

      btn.innerText = 'جاري رفع الصورة والتعديل...';
      btn.disabled = true;

      try {
        prod.name = document.getElementById('edit-prod-name').value;
        prod.price = document.getElementById('edit-prod-price').value;
        prod.desc = document.getElementById('edit-prod-desc').value;

        const fileInput = document.getElementById('edit-prod-img-file');
        if (fileInput.files && fileInput.files.length > 0) {
          prod.img = await uploadImageToImgBB(fileInput.files[0]);
        }

        await syncToFirestore();
        closeEditModal();
      } catch (err) {
        alert('حدث خطأ أثناء التعديل: ' + err.message);
      } finally {
        btn.innerText = 'حفظ التعديلات';
        btn.disabled = false;
      }
    });

    document.getElementById('add-category-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-cat-submit');
      try {
        const fileInput = document.getElementById('cat-img-file');
        if (!fileInput.files || fileInput.files.length === 0) return;

        btn.innerText = 'جاري رفع الصورة إلى ImgBB...';
        btn.disabled = true;

        const imageUrl = await uploadImageToImgBB(fileInput.files[0]);
        categories.push({ id: Date.now(), name: document.getElementById('cat-name').value, img: imageUrl });
        await syncToFirestore();
        this.reset();
      } catch (err) {
        alert('حدث خطأ أثناء رفع الصورة: ' + err.message);
      } finally {
        btn.innerText = 'إضافة القسم';
        btn.disabled = false;
      }
    });

    document.getElementById('add-product-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-prod-submit');
      try {
        const catSelect = document.getElementById('prod-cat-select');
        const fileInput = document.getElementById('prod-img-file');
        if (!catSelect.value || !fileInput.files[0]) return;

        btn.innerText = 'جاري رفع الصورة إلى ImgBB...';
        btn.disabled = true;

        const imageUrl = await uploadImageToImgBB(fileInput.files[0]);
        products.push({
          id: Date.now(),
          catId: parseInt(catSelect.value),
          name: document.getElementById('prod-name').value,
          price: document.getElementById('prod-price').value,
          desc: document.getElementById('prod-desc').value || '',
          img: imageUrl
        });

        await syncToFirestore();
        this.reset();
      } catch (err) {
        alert('حدث خطأ أثناء رفع الصورة: ' + err.message);
      } finally {
        btn.innerText = 'إضافة المنتج';
        btn.disabled = false;
      }
    });

    window.deleteCategory = async function(e, id) {
      e.stopPropagation();
      if (confirm('هل أنت تأكد من حذف هذا القسم وكل المنتجات التابعة له؟')) {
        categories = categories.filter(c => c.id !== id);
        products = products.filter(p => p.catId !== id);
        await syncToFirestore();
      }
    };

    window.deleteProduct = async function(e, prodId, catId) {
      e.stopPropagation();
      if (confirm('هل أنت تأكد من حذف هذا المنتج؟')) {
        products = products.filter(p => p.id !== prodId);
        await syncToFirestore();
      }
    };

    initApp();
  </script>
</body>
</html>
