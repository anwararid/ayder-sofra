<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayder Sofra | Garson</title>
<link rel="stylesheet" href="styles.css">
<style>
.garson-page{margin:0;min-height:100vh;background:#071522;color:#f5f8fb;font-family:Inter,Arial,sans-serif}.garson-app{min-height:100vh;padding:20px;box-sizing:border-box}.garson-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;margin-bottom:20px;padding:16px 20px;background:#0c2032;border:1px solid #1c3a50;border-radius:18px}.garson-brand{display:flex;align-items:center;gap:12px}.garson-logo{width:48px;height:48px;display:grid;place-items:center;border:1px solid #c57b32;border-radius:13px;color:#f0a45c;font-size:22px;font-weight:800}.garson-brand strong{display:block;font-size:18px}.garson-brand small{display:block;margin-top:3px;color:#9db1c1}.garson-system{padding:9px 15px;border-radius:999px;background:#132d40;font-weight:700;white-space:nowrap}.garson-system span{display:inline-block;width:9px;height:9px;margin-right:7px;border-radius:50%;background:#36e69a;box-shadow:0 0 12px #36e69a}.garson-user{justify-self:end;font-weight:700}.garson-layout{display:grid;grid-template-columns:minmax(320px,42%) minmax(0,58%);gap:18px;align-items:start}.garson-panel{background:#0b1d2c;border:1px solid #1b394d;border-radius:18px;box-shadow:0 15px 40px rgba(0,0,0,.22);overflow:hidden}.panel-head{padding:20px;border-bottom:1px solid #1a3548}.panel-head h2{margin:0;font-size:22px}.panel-head p{margin:7px 0 0;color:#91a8b8}.tables-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:16px}.table-card{min-height:128px;padding:14px;border-radius:15px;background:#102738;border:1px solid #235069;color:#fff;text-align:left;cursor:pointer;transition:.18s ease}.table-card:hover{transform:translateY(-2px);border-color:#4b86a7}.table-card.free{border-color:rgba(42,215,137,.45)}.table-card.occupied{background:#281a21;border-color:rgba(255,72,82,.6)}.table-card.selected{outline:2px solid #3989ff;outline-offset:2px}.table-top{display:flex;align-items:center;justify-content:space-between}.table-number{font-size:30px;font-weight:800}.table-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:rgba(43,226,146,.12);font-size:22px}.occupied .table-icon{background:rgba(255,75,84,.12)}.table-status{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:5px 9px;border-radius:999px;background:rgba(42,215,137,.14);color:#3be59a;font-size:12px;font-weight:800}.occupied .table-status{background:rgba(255,75,84,.14);color:#ff626a}.table-status i{width:7px;height:7px;border-radius:50%;background:currentColor}.table-info{display:block;margin-top:10px;color:#a8bac7;font-size:12px}.selected-table{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:20px;background:linear-gradient(135deg,#0d2d4d,#09213a)}.selected-table-info{display:flex;align-items:center;gap:14px}.selected-table-icon{width:60px;height:60px;display:grid;place-items:center;border-radius:50%;background:#183e61;font-size:28px}.selected-table small{display:block;color:#8fa8bb;margin-bottom:4px}.selected-table h2{margin:0;font-size:24px}.clear-table-btn{border:1px solid #ff4d59;background:transparent;color:#ff626b;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.clear-table-btn:disabled{opacity:.35;cursor:not-allowed}.products-area{padding:16px}.product-search{width:100%;box-sizing:border-box;margin-bottom:12px;padding:13px 14px;border:1px solid #24445a;border-radius:11px;outline:none;background:#0c2132;color:#fff}.category-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.category-btn{flex:0 0 auto;border:1px solid #28475c;background:#11283a;color:#d4e0e8;border-radius:999px;padding:9px 14px;cursor:pointer;font-weight:700}.category-btn.active{background:#1f6fd1;border-color:#2c83ef;color:#fff}.products-list{display:grid;gap:9px;max-height:570px;overflow-y:auto}.product-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:10px;background:#102535;border:1px solid #1d3b4e;border-radius:12px}.product-image{width:64px;height:54px;object-fit:cover;border-radius:9px;background:#172f40}.product-row strong{display:block;font-size:15px}.product-row small{display:block;margin-top:4px;color:#91a6b5}.product-price{font-weight:800;white-space:nowrap}.add-product{width:40px;height:40px;border:0;border-radius:9px;background:#1e6dcc;color:#fff;font-size:24px;cursor:pointer}.add-product:disabled{opacity:.35}.cart-panel{margin:0 16px 16px;border:1px solid #23465d;border-radius:14px;overflow:hidden}.cart-head{display:flex;align-items:center;justify-content:space-between;padding:15px;background:#10283a}.cart-warning{color:#ff6068;font-size:12px;font-weight:700}.cart-items{padding:4px 12px}.cart-item{display:grid;grid-template-columns:auto 28px auto minmax(0,1fr) auto auto;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid #1b3546}.qty-btn{width:30px;height:30px;border:1px solid #34566d;border-radius:7px;background:#132c3e;color:#fff;cursor:pointer;font-weight:800}.qty-btn.plus{background:#1766bf;border-color:#277bd7}.cart-item-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.remove-item{border:0;background:transparent;color:#ff5d67;font-size:19px;cursor:pointer}.cart-total{display:flex;justify-content:space-between;padding:16px;font-size:17px}.cart-total strong{color:#4c9bff;font-size:21px}.cart-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}.main-btn{min-height:48px;border:0;border-radius:10px;color:#fff;font-weight:800;cursor:pointer}.main-btn.send{background:#159b5b}.main-btn.view{background:#1a3044;border:1px solid #2b4a60}.main-btn:disabled{opacity:.45;cursor:not-allowed}.orders-area{margin-top:18px}.orders-list{display:grid;gap:10px;padding:16px}.order-card{padding:15px;background:#102637;border:1px solid #21445a;border-radius:12px}.order-card-top,.order-card-bottom{display:flex;justify-content:space-between;gap:12px}.order-card-top small{display:block;margin-top:4px;color:#8ea4b3}.order-status{padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}.status-pending{background:#5c4215;color:#ffd46a}.status-preparing{background:#183e66;color:#68aaff}.status-ready{background:#155238;color:#51e69a}.status-served{background:#303c48;color:#b5c3ce}.order-card-items{margin:12px 0;padding:10px 0;border-top:1px solid #1d3c50;border-bottom:1px solid #1d3c50}.order-line{display:flex;justify-content:space-between;padding:5px 0}.order-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.order-action{border:0;border-radius:8px;padding:9px 12px;color:#fff;background:#1f6fd1;cursor:pointer;font-weight:700}.order-action.delete{background:#a92d39}.empty-box{padding:30px;text-align:center;color:#8ea5b4}@media(max-width:900px){.garson-header{grid-template-columns:1fr}.garson-system,.garson-user{justify-self:start}.garson-layout{grid-template-columns:1fr}}@media(max-width:520px){.garson-app{padding:10px}.tables-grid{gap:8px;padding:10px}.table-card{min-height:110px;padding:10px}.table-number{font-size:25px}.product-row{grid-template-columns:52px minmax(0,1fr) auto}.product-image{width:52px;height:48px}.product-price{grid-column:2}.add-product{grid-column:3;grid-row:1/span 2}.cart-actions{grid-template-columns:1fr}}
</style>
</head>
<body class="garson-page">
<script type="module">
import {listenProducts,listenOrders,createOrder,setStatus,deleteOrder,money,esc,toast} from "./app.js";

document.body.innerHTML=`
<div class="garson-app">
<header class="garson-header">
<div class="garson-brand"><div class="garson-logo">AS</div><div><strong>AYDER SOFRA</strong><small>Lezzet, ustalıkla hazırlanır.</small></div></div>
<div class="garson-system"><span></span>Sistem Aktif</div>
<div class="garson-user">👤 Garson</div>
</header>
<div class="garson-layout">
<section class="garson-panel">
<div class="panel-head"><h2>🪑 MASALAR <span id="tableCount">20</span></h2><p>Masayı seçin ve sipariş oluşturun.</p></div>
<div id="tablesGrid" class="tables-grid"></div>
</section>
<section>
<div class="garson-panel">
<div class="selected-table">
<div class="selected-table-info"><div class="selected-table-icon">🪑</div><div><small>SEÇİLİ MASA</small><h2 id="selectedTableTitle">Masa seçin</h2><small id="selectedTableInfo">Sipariş oluşturmak için masa seçin.</small></div></div>
<button id="clearTable" class="clear-table-btn" type="button" disabled>🗑 Masayı Boşalt</button>
</div>
<div class="products-area">
<input id="productSearch" class="product-search" type="search" placeholder="Ürün ara..." autocomplete="off">
<div id="categoryRow" class="category-row"></div>
<div id="productsList" class="products-list"></div>
</div>
<div class="cart-panel">
<div class="cart-head"><strong>🛒 SİPARİŞ SEPETİ <span id="cartCount">0</span></strong><span id="cartWarning" class="cart-warning"></span></div>
<div id="cartItems" class="cart-items"><div class="empty-box">Önce bir masa seçin.</div></div>
<div class="cart-total"><span>TOPLAM</span><strong id="cartTotal">0.00 ₺</strong></div>
<div class="cart-actions"><button id="sendOrder" class="main-btn send" type="button" disabled>➤ Siparişi Gönder</button><button id="viewOrders" class="main-btn view" type="button" disabled>◉ Masadaki Siparişler</button></div>
</div>
</div>
<section id="ordersSection" class="garson-panel orders-area"><div class="panel-head"><h2>🍽️ MASA SİPARİŞLERİ</h2><p>Seçili masanın aktif ve tamamlanan siparişleri.</p></div><div id="ordersList" class="orders-list"></div></section>
</section>
</div>
</div>`;

const $=s=>document.querySelector(s);
const tablesGrid=$("#tablesGrid"),tableCount=$("#tableCount"),selectedTableTitle=$("#selectedTableTitle"),selectedTableInfo=$("#selectedTableInfo"),clearTable=$("#clearTable"),productSearch=$("#productSearch"),categoryRow=$("#categoryRow"),productsList=$("#productsList"),cartItems=$("#cartItems"),cartCount=$("#cartCount"),cartTotal=$("#cartTotal"),cartWarning=$("#cartWarning"),sendOrder=$("#sendOrder"),viewOrders=$("#viewOrders"),ordersList=$("#ordersList");
let products=[],orders=[],selectedTable=null,cart=[],activeCategory="all";
const TABLES=Array.from({length:20},(_,i)=>i+1);
const activeStatuses=["pending","preparing","ready"];
const tableOrders=t=>orders.filter(o=>Number(o.table)===Number(t));
const activeTableOrders=t=>tableOrders(t).filter(o=>activeStatuses.includes(o.status));
const occupied=t=>activeTableOrders(t).length>0;

function statusName(s){return ({pending:"YENİ SİPARİŞ",preparing:"HAZIRLANIYOR",ready:"HAZIR",served:"SERVİS EDİLDİ"}[s]||s||"")}
function statusClass(s){return ({pending:"status-pending",preparing:"status-preparing",ready:"status-ready",served:"status-served"}[s]||"")}
function categories(){return [...new Set(products.filter(p=>p.active!==false&&p.category).map(p=>String(p.category)))]}

function renderTables(){
 tableCount.textContent=TABLES.length;
 tablesGrid.innerHTML=TABLES.map(t=>{const on=occupied(t),sel=Number(selectedTable)===t,os=activeTableOrders(t),total=os.reduce((s,o)=>s+Number(o.total||0),0);return `<button type="button" class="table-card ${on?"occupied":"free"} ${sel?"selected":""}" data-table="${t}"><div class="table-top"><div class="table-number">${t}</div><div class="table-icon">🪑</div></div><span class="table-status"><i></i>${on?"DOLU":"MÜSAİT"}</span><span class="table-info">${on?`${os.length} aktif sipariş • ${money(total)}`:"Sipariş yok"}</span></button>`}).join("");
}

tablesGrid.addEventListener("click",e=>{const b=e.target.closest("[data-table]");if(b)selectTable(Number(b.dataset.table))});

function selectTable(t){selectedTable=t;cart=[];const os=activeTableOrders(t),total=os.reduce((s,o)=>s+Number(o.total||0),0);selectedTableTitle.textContent=`Masa ${t}`;selectedTableInfo.textContent=os.length?`Dolu • ${os.length} aktif sipariş • ${money(total)}`:"Müsait • Yeni sipariş oluşturabilirsiniz.";clearTable.disabled=!os.length;sendOrder.disabled=false;viewOrders.disabled=false;renderTables();renderProducts();renderCart();renderOrders()}

function renderCategories(){categoryRow.innerHTML=`<button type="button" class="category-btn ${activeCategory==="all"?"active":""}" data-category="all">Tümü</button>`+categories().map(c=>`<button type="button" class="category-btn ${activeCategory===c?"active":""}" data-category="${esc(c)}">${esc(c)}</button>`).join("")}
categoryRow.addEventListener("click",e=>{const b=e.target.closest("[data-category]");if(!b)return;activeCategory=b.dataset.category;renderCategories();renderProducts()});

function imageFor(p){const u=p.image||p.imageUrl||p.photo||p.photoUrl||"";return u?`<img class="product-image" src="${esc(u)}" alt="${esc(p.name||"Ürün")}" loading="lazy">`:`<div class="product-image" style="display:grid;place-items:center;font-size:24px">🍽️</div>`}
function renderProducts(){let list=products.filter(p=>p.active!==false);if(activeCategory!=="all")list=list.filter(p=>String(p.category||"")===activeCategory);const q=productSearch.value.trim().toLowerCase();if(q)list=list.filter(p=>String(p.name||"").toLowerCase().includes(q)||String(p.category||"").toLowerCase().includes(q));if(!list.length){productsList.innerHTML=`<div class="empty-box">Ürün bulunamadı.</div>`;return}productsList.innerHTML=list.map(p=>`<div class="product-row">${imageFor(p)}<div><strong>${esc(p.name||"Ürün")}</strong><small>${esc(p.description||p.category||"")}</small></div><div class="product-price">${money(p.price)}</div><button type="button" class="add-product" data-product-id="${esc(p.id)}" ${selectedTable===null?"disabled":""}>+</button></div>`).join("")}
productSearch.addEventListener("input",renderProducts);

productsList.addEventListener("click",e=>{const b=e.target.closest("[data-product-id]");if(!b)return;if(selectedTable===null){toast("Önce masa seçin.","error");return}const p=products.find(x=>x.id===b.dataset.productId);if(!p)return;const x=cart.find(i=>i.id===p.id);if(x)x.qty++;else cart.push({id:p.id,name:p.name||"Ürün",price:Number(p.price||0),department:p.department||p.station||"",qty:1});renderCart()});

function renderCart(){if(selectedTable===null){cartItems.innerHTML=`<div class="empty-box">Önce bir masa seçin.</div>`;cartCount.textContent="0";cartTotal.textContent=money(0);cartWarning.textContent="";return}if(!cart.length)cartItems.innerHTML=`<div class="empty-box">Ürün eklemek için yukarıdaki + düğmesine basın.</div>`;else cartItems.innerHTML=cart.map(i=>`<div class="cart-item"><button class="qty-btn" data-minus="${esc(i.id)}">−</button><span>${i.qty}</span><button class="qty-btn plus" data-plus="${esc(i.id)}">+</button><span class="cart-item-name">${esc(i.name)}</span><strong>${money(Number(i.price||0)*Number(i.qty||0))}</strong><button class="remove-item" data-remove="${esc(i.id)}">×</button></div>`).join("");const total=cart.reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||0),0),count=cart.reduce((s,i)=>s+Number(i.qty||0),0);cartCount.textContent=count;cartTotal.textContent=money(total);cartWarning.textContent=activeTableOrders(selectedTable).length?"Masada aktif sipariş var.":""}

cartItems.addEventListener("click",e=>{const p=e.target.closest("[data-plus]"),m=e.target.closest("[data-minus]"),r=e.target.closest("[data-remove]");if(p){const i=cart.find(x=>x.id===p.dataset.plus);if(i)i.qty++}if(m){const i=cart.find(x=>x.id===m.dataset.minus);if(i){i.qty--;if(i.qty<=0)cart=cart.filter(x=>x.id!==i.id)}}if(r)cart=cart.filter(x=>x.id!==r.dataset.remove);renderCart()});

sendOrder.addEventListener("click",async()=>{if(selectedTable===null)return toast("Önce masa seçin.","error");if(!cart.length)return toast("Sepet boş.","error");const total=cart.reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||0),0);try{sendOrder.disabled=true;sendOrder.textContent="Gönderiliyor...";await createOrder({table:selectedTable,waiterName:"Garson",items:cart.map(i=>({id:i.id,name:i.name,price:Number(i.price||0),department:i.department||"",qty:Number(i.qty||0)})),total});cart=[];renderCart();toast(`Masa ${selectedTable} siparişi gönderildi.`)}catch(e){console.error(e);toast("Sipariş gönderilemedi.","error")}finally{sendOrder.disabled=false;sendOrder.textContent="➤ Siparişi Gönder"}});

function renderOrders(){if(selectedTable===null){ordersList.innerHTML=`<div class="empty-box">Görüntülemek için bir masa seçin.</div>`;return}const os=tableOrders(selectedTable);if(!os.length){ordersList.innerHTML=`<div class="empty-box">Bu masada henüz sipariş yok.</div>`;return}ordersList.innerHTML=os.map(o=>`<article class="order-card"><div class="order-card-top"><div><strong>Sipariş #${esc(String(o.id).slice(-6))}</strong><small>Garson: ${esc(o.waiterName||"Garson")}</small></div><span class="order-status ${statusClass(o.status)}">${statusName(o.status)}</span></div><div class="order-card-items">${(o.items||[]).map(i=>`<div class="order-line"><span>${Number(i.qty||0)} × ${esc(i.name||"Ürün")}</span><strong>${money(Number(i.price||0)*Number(i.qty||0))}</strong></div>`).join("")}</div><div class="order-card-bottom"><strong>Toplam</strong><strong>${money(o.total)}</strong></div><div class="order-actions">${o.status==="pending"?`<button class="order-action" data-order-id="${esc(o.id)}" data-new-status="preparing">👨‍🍳 Hazırlanıyor</button>`:""}${o.status==="preparing"?`<button class="order-action" data-order-id="${esc(o.id)}" data-new-status="ready">✓ Hazır</button>`:""}${o.status==="ready"?`<button class="order-action" data-order-id="${esc(o.id)}" data-new-status="served">🍽️ Servis Edildi</button>`:""}${o.status==="served"?`<button class="order-action delete" data-delete-order="${esc(o.id)}">🗑 Siparişi Sil</button>`:""}</div></article>`).join("")}

ordersList.addEventListener("click",async e=>{const s=e.target.closest("[data-new-status]"),d=e.target.closest("[data-delete-order]");if(s){try{s.disabled=true;await setStatus(s.dataset.orderId,s.dataset.newStatus);toast("Sipariş durumu güncellendi.")}catch(err){console.error(err);s.disabled=false;toast("Sipariş güncellenemedi.","error")}return}if(d){if(!confirm("Bu tamamlanmış siparişi silmek istediğinizden emin misiniz?"))return;try{d.disabled=true;await deleteOrder(d.dataset.deleteOrder);toast("Sipariş silindi.")}catch(err){console.error(err);d.disabled=false;toast("Sipariş silinemedi.","error")}}});

viewOrders.addEventListener("click",()=>$("#ordersSection")?.scrollIntoView({behavior:"smooth",block:"start"}));

clearTable.addEventListener("click",async()=>{if(selectedTable===null)return;const os=activeTableOrders(selectedTable);if(!os.length)return toast("Bu masa zaten müsait.");if(!confirm(`Masa ${selectedTable} üzerindeki aktif siparişler silinsin ve masa boşaltılsın mı?`))return;try{clearTable.disabled=true;for(const o of os)await deleteOrder(o.id);cart=[];toast(`Masa ${selectedTable} boşaltıldı.`)}catch(e){console.error(e);toast("Masa boşaltılamadı.","error")}finally{clearTable.disabled=false}});

listenProducts(items=>{products=Array.isArray(items)?items:[];renderCategories();renderProducts()});
listenOrders(items=>{orders=Array.isArray(items)?items:[];renderTables();if(selectedTable!==null){const os=activeTableOrders(selectedTable);selectedTableInfo.textContent=os.length?`Dolu • ${os.length} aktif sipariş`:`Müsait • Yeni sipariş oluşturabilirsiniz.`;clearTable.disabled=!os.length}renderCart();renderOrders()});

renderTables();renderCategories();renderProducts();renderCart();renderOrders();
</script>
</body>
</html>
