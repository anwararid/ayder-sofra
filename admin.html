<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetim</title><link rel="stylesheet" href="styles.css"></head><body><script type="module">
import{guard,shell,listenMenu,listenUsers,listenOrders,addDoc,collection,db,doc,deleteDoc,toast,esc,money}from"./app.js";
guard(["admin"],u=>{let c=shell(u,"Yönetim Paneli","Menü ve personel yönetimi");c.innerHTML=`<div class="tabs"><button id="orders">Siparişler</button><button id="menu">Menü</button><button id="users">Personel</button></div><div id="view"></div>`;let v=c.querySelector("#view");
orders.onclick=()=>listenOrders(os=>v.innerHTML=`<div class="grid">${os.slice(0,30).map(o=>`<article class=card><div class=row><b>Masa ${esc(o.table)}</b><span class=badge>${esc(o.status)}</span></div>${(o.items||[]).map(i=>`${i.qty} × ${esc(i.name)}`).join("<br>")}<hr><b>${money(o.total)}</b></article>`).join("")}</div>`);
menu.onclick=()=>listenMenu(ms=>{v.innerHTML=`<div class=card><h2>Ürün Ekle</h2><form id=mf class=form><input id=n placeholder="Ürün adı" required><input id=p type=number step=.01 placeholder="Fiyat" required><select id=d><option value=mutfak>Mutfak</option><option value=firin>Fırın</option><option value=izgara>Izgara</option></select><button class="btn primary">Ekle</button></form></div><div class=grid>${ms.map(x=>`<div class=card><div class=row><b>${esc(x.name)}</b><button class="btn danger del" data-id="${x.id}">Sil</button></div><p>${money(x.price)} · ${esc(x.department)}</p></div>`).join("")}</div>`;mf.onsubmit=async e=>{e.preventDefault();await addDoc(collection(db,"menu"),{name:n.value.trim(),price:Number(p.value),department:d.value,active:true});toast("Ürün eklendi");e.target.reset()};v.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{await deleteDoc(doc(db,"menu",b.dataset.id));toast("Ürün silindi")})});
users.onclick=()=>listenUsers(us=>v.innerHTML=`<div class=card><h2>Personel</h2>${us.map(x=>`<div class=row><span><b>${esc(x.name||"-")}</b><small>${esc(x.email||"")} · ${esc(x.role||"")}</small></span></div>`).join("")}</div>`);
orders.click();
});
</script></body></html>
