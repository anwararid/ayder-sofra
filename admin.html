<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ayder Sofra | Yönetim Paneli</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="topbar">

    <div>
      <strong>Ayder Sofra</strong>
      <span>Yönetim Paneli</span>
    </div>

    <button id="logoutBtn" class="btn">
      Çıkış Yap
    </button>

  </header>


  <main class="admin-container">

    <section class="page-heading">

      <div>
        <h1>Restoran Yönetimi</h1>
        <p>Masaları ve restoran operasyonlarını yönetin.</p>
      </div>

      <button id="addTableBtn" class="btn primary">
        + Masa Ekle
      </button>

    </section>


    <section class="stats">

      <div class="stat-card">
        <span>Toplam Masa</span>
        <strong id="totalTables">0</strong>
      </div>

      <div class="stat-card">
        <span>Müsait</span>
        <strong id="availableTables">0</strong>
      </div>

      <div class="stat-card">
        <span>Dolu</span>
        <strong id="busyTables">0</strong>
      </div>

      <div class="stat-card">
        <span>Aktif Sipariş</span>
        <strong id="activeOrders">0</strong>
      </div>

    </section>


    <section class="panel">

      <div class="panel-header">

        <div>
          <h2>Masalar</h2>
          <p>Restorandaki tüm masaların durumu.</p>
        </div>

        <select id="tableFilter">
          <option value="all">Tüm Masalar</option>
          <option value="available">Müsait</option>
          <option value="busy">Dolu</option>
        </select>

      </div>


      <div id="tablesGrid" class="tables-grid"></div>

    </section>

  </main>


  <!-- Masa Ekleme Penceresi -->

  <div id="tableModal" class="modal hidden">

    <div class="modal-box">

      <div class="modal-header">

        <h2>Yeni Masa Ekle</h2>

        <button id="closeModal" class="close-btn">
          ×
        </button>

      </div>


      <form id="tableForm">

        <label>
          Masa Adı

          <input
            id="tableName"
            type="text"
            placeholder="Örn. Masa 17"
            required
          >
        </label>


        <label>
          Kapasite

          <input
            id="tableCapacity"
            type="number"
            min="1"
            max="50"
            value="4"
            required
          >
        </label>


        <div class="modal-actions">

          <button
            type="button"
            id="cancelModal"
            class="btn"
          >
            İptal
          </button>

          <button
            type="submit"
            class="btn primary"
          >
            Masa Ekle
          </button>

        </div>

      </form>

    </div>

  </div>


  <script type="module">

    import {
      auth,
      db,
      signOut,
      collection,
      doc,
      setDoc,
      deleteDoc,
      onSnapshot
    } from "./firebase.js";

    const tablesGrid =
      document.querySelector("#tablesGrid");

    const totalTables =
      document.querySelector("#totalTables");

    const availableTables =
      document.querySelector("#availableTables");

    const busyTables =
      document.querySelector("#busyTables");

    const activeOrders =
      document.querySelector("#activeOrders");

    const tableFilter =
      document.querySelector("#tableFilter");

    const modal =
      document.querySelector("#tableModal");

    const addTableBtn =
      document.querySelector("#addTableBtn");

    const closeModal =
      document.querySelector("#closeModal");

    const cancelModal =
      document.querySelector("#cancelModal");

    const tableForm =
      document.querySelector("#tableForm");

    const tableName =
      document.querySelector("#tableName");

    const tableCapacity =
      document.querySelector("#tableCapacity");

    const logoutBtn =
      document.querySelector("#logoutBtn");


    let tables = [];


    /*
      İlk açılışta 16 masa oluşturulur.
      Daha önce oluşturulmuş masalar tekrar oluşturulmaz.
    */

    async function createDefaultTables() {

      for (let i = 1; i <= 16; i++) {

        const tableRef =
          doc(db, "tables", `masa-${i}`);

        await setDoc(
          tableRef,
          {
            name: `Masa ${i}`,
            capacity: 4,
            status: "available",
            orderCount: 0,
            createdAt: new Date()
          },
          {
            merge: true
          }
        );

      }

    }


    function renderTables() {

      const filter =
        tableFilter.value;

      let filteredTables =
        tables.filter(table => {

          if (filter === "available") {
            return table.status === "available";
          }

          if (filter === "busy") {
            return table.status === "busy";
          }

          return true;

        });


      tablesGrid.innerHTML = "";


      if (filteredTables.length === 0) {

        tablesGrid.innerHTML = `
          <div class="empty-state">
            <h3>Masa bulunamadı</h3>
            <p>Seçilen filtreye uygun masa yok.</p>
          </div>
        `;

        return;
      }


      filteredTables.forEach(table => {

        const isBusy =
          table.status === "busy";


        const card =
          document.createElement("article");

        card.className =
          `table-card ${isBusy ? "busy" : "available"}`;


        card.innerHTML = `

          <div class="table-top">

            <span class="table-number">
              ${table.name}
            </span>

            <span class="status-badge">
              ${isBusy ? "Dolu" : "Müsait"}
            </span>

          </div>


          <div class="table-icon">
            🪑
          </div>


          <div class="table-info">

            <div>
              <span>Kapasite</span>
              <strong>
                ${table.capacity} Kişi
              </strong>
            </div>

            <div>
              <span>Sipariş</span>
              <strong>
                ${table.orderCount || 0}
              </strong>
            </div>

          </div>


          <div class="table-actions">

            <button
              class="btn small"
              data-action="toggle"
              data-id="${table.id}"
            >
              ${isBusy ? "Müsait Yap" : "Dolu Yap"}
            </button>


            <button
              class="btn small danger"
              data-action="delete"
              data-id="${table.id}"
            >
              Sil
            </button>

          </div>

        `;


        tablesGrid.appendChild(card);

      });


      updateStats();

    }


    function updateStats() {

      const total =
        tables.length;

      const available =
        tables.filter(
          table => table.status === "available"
        ).length;

      const busy =
        tables.filter(
          table => table.status === "busy"
        ).length;

      const orders =
        tables.reduce(
          (sum, table) =>
            sum + (table.orderCount || 0),
          0
        );


      totalTables.textContent =
        total;

      availableTables.textContent =
        available;

      busyTables.textContent =
        busy;

      activeOrders.textContent =
        orders;

    }


    /*
      Firestore'dan masaları dinle
    */

    onSnapshot(
      collection(db, "tables"),
      snapshot => {

        tables =
          snapshot.docs.map(item => ({
            id: item.id,
            ...item.data()
          }));

        tables.sort((a, b) => {

          const aNumber =
            parseInt(
              String(a.name).replace(/\D/g, "")
            ) || 0;

          const bNumber =
            parseInt(
              String(b.name).replace(/\D/g, "")
            ) || 0;

          return aNumber - bNumber;

        });


        renderTables();

      },
      error => {

        console.error(
          "Tables error:",
          error
        );

        tablesGrid.innerHTML = `
          <div class="empty-state">
            <h3>Bağlantı hatası</h3>
            <p>Masalar yüklenemedi.</p>
          </div>
        `;

      }
    );


    /*
      16 başlangıç masası
    */

    createDefaultTables()
      .catch(error => {

        console.error(
          "Default tables error:",
          error
        );

      });


    /*
      Masa ekle
    */

    addTableBtn.addEventListener(
      "click",
      () => {

        modal.classList.remove("hidden");

        tableName.focus();

      }
    );


    function closeTableModal() {

      modal.classList.add("hidden");

      tableForm.reset();

      tableCapacity.value = 4;

    }


    closeModal.addEventListener(
      "click",
      closeTableModal
    );


    cancelModal.addEventListener(
      "click",
      closeTableModal
    );


    tableForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const name =
          tableName.value.trim();

        const capacity =
          Number(tableCapacity.value);


        if (!name) return;


        const id =
          `masa-${Date.now()}`;


        try {

          await setDoc(
            doc(db, "tables", id),
            {
              name,
              capacity,
              status: "available",
              orderCount: 0,
              createdAt: new Date()
            }
          );


          closeTableModal();

        } catch (error) {

          console.error(error);

          alert(
            "Masa eklenirken bir hata oluştu."
          );

        }

      }
    );


    /*
      Masa işlemleri
    */

    tablesGrid.addEventListener(
      "click",
      async event => {

        const button =
          event.target.closest("button");

        if (!button) return;


        const action =
          button.dataset.action;

        const id =
          button.dataset.id;


        if (!id) return;


        if (action === "toggle") {

          const table =
            tables.find(
              item => item.id === id
            );

          if (!table) return;


          try {

            await setDoc(
              doc(db, "tables", id),
              {
                status:
                  table.status === "busy"
                    ? "available"
                    : "busy"
              },
              {
                merge: true
              }
            );

          } catch (error) {

            console.error(error);

            alert(
              "Masa durumu değiştirilemedi."
            );

          }

        }


        if (action === "delete") {

          const table =
            tables.find(
              item => item.id === id
            );

          if (!table) return;


          const confirmed =
            confirm(
              `${table.name} silinsin mi?`
            );


          if (!confirmed) return;


          try {

            await deleteDoc(
              doc(db, "tables", id)
            );

          } catch (error) {

            console.error(error);

            alert(
              "Masa silinemedi."
            );

          }

        }

      }
    );


    /*
      Filtre
    */

    tableFilter.addEventListener(
      "change",
      renderTables
    );


    /*
      Çıkış
    */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);

          window.location.href =
            "login.html";

        } catch (error) {

          console.error(error);

        }

      }
    );

  </script>

</body>
</html>
