<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayder Sofra - Yönetim Paneli</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #222;
  color: white;
  text-align: center;
  padding: 22px 10px;
}

header h1 {
  margin: 0;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card h2 {
  margin-top: 0;
  border-bottom: 2px solid #eee;
  padding-bottom: 10px;
}

.form-group {
  margin-bottom: 15px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 5px;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
}

button.btn-add {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #16803c;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.menu-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.menu-item-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.menu-item-name {
  font-weight: bold;
  font-size: 16px;
}

.menu-item-details {
  font-size: 13px;
  color: #666;
}

.btn-delete {
  background: #c62828;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  font-weight: bold;
}

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.stat-box {
  background: #f8f9fa;
  border-radius: 10px;
  padding: 15px;
  text-align: center;
  border: 1px solid #e0e0e0;
}

.stat-number {
  font-size: 22px;
  font-weight: bold;
  color: #16803c;
  margin-top: 5px;
}

.empty {
  text-align: center;
  color: #777;
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <h1>⚙️ AYDER SOFRA</h1>
  <p>Yönetim & Menü Paneli</p>
</header>

<main>

  <!-- بطاقة إضافة صنف جديد -->
  <div class="card">
    <h2>➕ Yeni Ürün Ekle</h2>
    <form id="addFoodForm">
      <div class="form-group">
        <label for="foodName">Ürün Adı:</label>
        <input type="text" id="foodName" placeholder="Örn: Adana Kebap" required>
      </div>

      <div class="form-group">
        <label for="foodPrice">Fiyat (TL):</label>
        <input type="number" id="foodPrice" placeholder="Örn: 250" required min="0" step="any">
      </div>

      <div class="form-group">
        <label for="foodStation">Hazırlanacak İstasyon (Bölüm):</label>
        <select id="foodStation" required>
          <option value="grill">🔥 Şef Izgara</option>
          <option value="oven">🥖 Fırın</option>
          <option value="kitchen" selected>👨‍🍳 Mutfak</option>
        </select>
      </div>

      <button type="submit" class="btn-add" id="submitBtn">Ürünü Kaydet 💾</button>
    </form>
  </div>

  <!-- بطاقة إدارة القائمة -->
  <div class="card">
    <h2>📋 Menü Ürünleri</h2>
    <div id="menuList">
      <div class="empty">Menü yükleniyor...</div>
    </div>
  </div>

  <!-- بطاقة تقرير المبيعات -->
  <div class="card">
    <h2>📊 Günlük Rapor & Satışlar</h2>
    <div class="stats-grid">
      <div class="stat-box">
        <div>Tamamlanan Sipariş</div>
        <div class="stat-number" id="totalOrdersCount">0</div>
      </div>
      <div class="stat-box">
        <div>Toplam Ciro</div>
        <div class="stat-number" id="totalRevenue">0 TL</div>
      </div>
    </div>
  </div>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  doc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDhvLb2QMMe7dy-vQ_3bwKtZK5XXy8lbWM",
  authDomain: "ayder-sofra.firebaseapp.com",
  projectId: "ayder-sofra",
  storageBucket: "ayder-sofra.firebasestorage.app",
  messagingSenderId: "459245770853",
  appId: "1:459245770853:web:8d32163fef443a2b7c8e8c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const addFoodForm = document.getElementById("addFoodForm");
const foodNameInput = document.getElementById("foodName");
const foodPriceInput = document.getElementById("foodPrice");
const foodStationInput = document.getElementById("foodStation");
const submitBtn = document.getElementById("submitBtn");
const menuList = document.getElementById("menuList");

const totalOrdersCountEl = document.getElementById("totalOrdersCount");
const totalRevenueEl = document.getElementById("totalRevenue");

/* إضافة صنف جديد لقائمة الطعام */
addFoodForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = foodNameInput.value.trim();
  const price = parseFloat(foodPriceInput.value);
  const station = foodStationInput.value;

  if (!name || isNaN(price)) {
    alert("Lütfen geçerli bilgiler girin.");
    return;
  }

  try {
    submitBtn.disabled = true;
    await addDoc(collection(db, "menu"), {
      name: name,
      price: price,
      station: station
    });

    foodNameInput.value = "";
    foodPriceInput.value = "";
    foodStationInput.value = "kitchen";
    alert("Ürün başarıyla eklendi! ✅");
  } catch (error) {
    console.error(error);
    alert("Ürün eklenirken hata oluştu: " + error.message);
  } finally {
    submitBtn.disabled = false;
  }
});

/* عرض قائمة الطعام المباشرة */
onSnapshot(collection(db, "menu"), (snapshot) => {
  menuList.innerHTML = "";

  if (snapshot.empty) {
    menuList.innerHTML = `<div class="empty">Henüz menüde ürün yok.</div>`;
    return;
  }

  snapshot.forEach((productDoc) => {
    const data = productDoc.data();
    const id = productDoc.id;

    const itemDiv = document.createElement("div");
    itemDiv.className = "menu-item";

    const infoDiv = document.createElement("div");
    infoDiv.className = "menu-item-info";

    const nameEl = document.createElement("div");
    nameEl.className = "menu-item-name";
    nameEl.textContent = data.name || "İsimsiz Ürün";

    let stationName = "👨‍🍳 Mutfak";
    if (data.station === "grill") stationName = "🔥 Şef Izgara";
    else if (data.station === "oven") stationName = "🥖 Fırın";

    const detailsEl = document.createElement("div");
    detailsEl.className = "menu-item-details";
    detailsEl.textContent = `${data.price || 0} TL | Bölüm: ${stationName}`;

    infoDiv.appendChild(nameEl);
    infoDiv.appendChild(detailsEl);

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "btn-delete";
    deleteBtn.textContent = "Sil 🗑️";
    deleteBtn.addEventListener("click", () => deleteMenuItem(id, data.name));

    itemDiv.appendChild(infoDiv);
    itemDiv.appendChild(deleteBtn);
    menuList.appendChild(itemDiv);
  });
});

/* حذف صنف من المنيو */
async function deleteMenuItem(id, name) {
  if (!confirm(`"${name}" ürününü silmek istediğinize emin misiniz?`)) return;

  try {
    await deleteDoc(doc(db, "menu", id));
  } catch (error) {
    console.error(error);
    alert("Ürün silinemedi: " + error.message);
  }
}

/* حساب المبيعات والطلبات المكتملة */
onSnapshot(collection(db, "orders"), (snapshot) => {
  let totalRevenue = 0;
  let completedOrdersCount = 0;

  snapshot.forEach((orderDoc) => {
    const data = orderDoc.data();
    if (data.status === "completed") {
      completedOrdersCount++;
      if (Array.isArray(data.items)) {
        data.items.forEach(item => {
          totalRevenue += Number(item.price || 0);
        });
      }
    }
  });

  totalOrdersCountEl.textContent = completedOrdersCount;
  totalRevenueEl.textContent = totalRevenue.toLocaleString("tr-TR") + " TL";
});
</script>

</body>
</html>
