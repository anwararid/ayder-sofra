<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayder Sofra - Yönetim</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #222;
  color: white;
  text-align: center;
  padding: 22px 10px;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.box {
  background: white;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 13px;
  margin: 7px 0 12px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
}

.add {
  width: 100%;
  background: #16803c;
  color: white;
}

.item {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
}

.item-name {
  font-size: 18px;
  font-weight: bold;
}

.item-price {
  margin: 7px 0 12px;
  color: #16803c;
  font-weight: bold;
}

.edit {
  background: #e6a700;
  color: white;
  margin-right: 5px;
}

.delete {
  background: #b3261e;
  color: white;
}

.empty {
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <h1>⚙️ AYDER SOFRA</h1>
  <p>Menü Yönetimi</p>
</header>

<main>

<div class="box">

  <h2>➕ Yeni Ürün</h2>

  <input
    id="name"
    type="text"
    placeholder="Ürün adı"
  >

  <input
    id="price"
    type="number"
    placeholder="Fiyat (TL)"
  >

  <button class="add" onclick="addProduct()">
    Ürünü Ekle
  </button>

</div>


<div class="box">

  <h2>📋 Menü</h2>

  <div id="menuList">
    Yükleniyor...
  </div>

</div>

</main>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  doc,
  deleteDoc,
  updateDoc
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyDhvLb2QMMe7dy-vQ_3bwKtZK5XXy8lbWM",
  authDomain: "ayder-sofra.firebaseapp.com",
  projectId: "ayder-sofra",
  storageBucket: "ayder-sofra.firebasestorage.app",
  messagingSenderId: "459245770853",
  appId: "1:459245770853:web:8d32163fef443a2b7c8e8c"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const menuList =
  document.getElementById("menuList");


/* إضافة منتج */

window.addProduct = async function() {

  const name =
    document.getElementById("name").value.trim();

  const price =
    Number(
      document.getElementById("price").value
    );


  if (!name) {

    alert("Ürün adını yazın.");
    return;
  }


  if (!price || price < 0) {

    alert("Geçerli bir fiyat yazın.");
    return;
  }


  try {

    await addDoc(
      collection(db, "menu"),
      {
        name: name,
        price: price
      }
    );


    document.getElementById("name").value = "";
    document.getElementById("price").value = "";

    alert("Ürün eklendi! ✅");

  } catch (error) {

    console.error(error);

    alert("Ürün eklenemedi.");
  }

};


/* عرض المنتجات */

onSnapshot(
  collection(db, "menu"),
  (snapshot) => {

    menuList.innerHTML = "";


    if (snapshot.empty) {

      menuList.innerHTML =
        '<div class="empty">Menü boş.</div>';

      return;
    }


    snapshot.forEach((productDoc) => {

      const data =
        productDoc.data();


      const item =
        document.createElement("div");

      item.className = "item";


      item.innerHTML = `
        <div class="item-name">
          ${escapeHtml(data.name || "")}
        </div>

        <div class="item-price">
          ${data.price || 0} TL
        </div>

        <button class="edit">
          ✏️ Düzenle
        </button>

        <button class="delete">
          🗑️ Sil
        </button>
      `;


      const editButton =
        item.querySelector(".edit");


      editButton.onclick =
        async function() {

          const newName =
            prompt(
              "Yeni ürün adı:",
              data.name || ""
            );


          if (newName === null) {
            return;
          }


          const newPrice =
            prompt(
              "Yeni fiyat (TL):",
              data.price || 0
            );


          if (newPrice === null) {
            return;
          }


          const priceNumber =
            Number(newPrice);


          if (
            !newName.trim() ||
            isNaN(priceNumber) ||
            priceNumber < 0
          ) {

            alert("Bilgileri kontrol edin.");
            return;
          }


          try {

            await updateDoc(
              doc(
                db,
                "menu",
                productDoc.id
              ),
              {
                name: newName.trim(),
                price: priceNumber
              }
            );

          } catch (error) {

            console.error(error);

            alert("Ürün güncellenemedi.");
          }

        };


      const deleteButton =
        item.querySelector(".delete");


      deleteButton.onclick =
        async function() {

          const ok =
            confirm(
              `"${data.name}" silinsin mi?`
            );


          if (!ok) {
            return;
          }


          try {

            await deleteDoc(
              doc(
                db,
                "menu",
                productDoc.id
              )
            );

          } catch (error) {

            console.error(error);

            alert("Ürün silinemedi.");
          }

        };


      menuList.appendChild(item);

    });

  }
);


/* حماية عرض النص */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

</script>

</body>
</html>
```
