<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ayder Sofra - Giriş</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><div class="card login"><h1>Ayder Sofra</h1><p class="muted">Personel Giriş</p><div id="msg"></div><form id="form"><div class="field"><label>E-posta</label><input id="email" type="email" required></div><div class="field"><label>Şifre</label><input id="pass" type="password" required></div><button class="btn primary" style="width:100%">Giriş Yap</button></form></div></main><script type="module">import{login,listenAuth,$}from"./app.js";listenAuth((u,p)=>{if(u&&p){const r=p.role;location.href=r==="admin"?"yonetici.html":r==="garson"?"index.html":r==="mutfak"?"mutfak.html":r==="firin"?"firin.html":"izgara.html"}});$("#form").onsubmit=async e=>{e.preventDefault();try{await login($("#email").value,$("#pass").value)}catch(err){$("#msg").innerHTML='<div class="notice error">Giriş başarısız. E-posta veya şifreyi kontrol edin.</div>'}};</script></body></html>
