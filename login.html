<!doctype html>
<html lang="tr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Ayder Sofra | Giriş</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body class="auth">

  <main class="login-card">

    <div class="logo">
      AS
    </div>

    <h1>Ayder Sofra</h1>

    <p>Restoran yönetim sistemi</p>

    <div id="msg"></div>

    <form id="form">

      <label>
        E-posta

        <input
          id="email"
          type="email"
          autocomplete="email"
          required
        >
      </label>

      <label>
        Şifre

        <input
          id="pass"
          type="password"
          autocomplete="current-password"
          required
        >
      </label>

      <button
        type="submit"
        class="btn primary"
      >
        Giriş Yap
      </button>

    </form>

  </main>

  <script type="module" src="./login.js?v=4"></script>

</body>

</html>
