<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sipariş</title><link rel="stylesheet" href="styles.css"></head><body><script type="module">
import{guard,shell,listenMenu,createOrder,money,esc,toast}from"./app.js";
guard(["garson"],u=>{const c=shell(u,"Yeni Sipariş","Masa seçin ve ürünleri sepete ekleyin.");c.innerHTML=`<div class="toolbar"><select id="table"><option value="">Masa seçin</option>${Array.from({length:20},(_,i)=>`<option>${i+1}</option>`).join("")}</select><input id="search" placeholder="Ürün ara"></div><div class="split"><section id="menu" class="grid"></section><aside class="card"><h2>Sepet</h2><div id="cart"></div><hr><div class="row"><b>Toplam</b><b id="total">0 ₺</b></div><button id="send" class="btn primary wide">Siparişi Gönder</button></aside></div>`;
let menu=[],cart=[];const render=()=>{let q=search.value.toLowerCase();menuEl.innerHTML=menu.filter(x=>x.active!==false&&x.name.toLowerCase().includes(q)).map(x=>`<button class="card product" data-id="${x.id}"><span><b>${esc(x.name)}</b><small>${esc(x.category||"")}</small></span><b>${money(x.price)}</b></button>`).join("");cartEl.innerHTML=cart.map(x=>`<div class="row">${x.qty} × ${esc(x.name)}<b>${money(x.price*x.qty)}</b></div>`).join("")||"<p class=muted>Sepet boş</p>";total.textContent=money(cart.reduce((s,x)=>s+x.price*x.qty,0))};const menuEl=c.querySelector("#menu"),cartEl=c.querySelector("#cart");listenMenu(x=>{menu=x;render()});search.oninput=render;c.onclick=e=>{let b=e.target.closest(".product");if(!b)return;let x=menu.find(m=>m.id===b.dataset.id),old=cart.find(i=>i.id===x.id);old?old.qty++:cart.push({...x,qty:1});render()};send.onclick=async()=>{if(!table.value||!cart.length)return toast("Masa ve ürün seçin","error");await createOrder({table:Number(table.value),waiterId:u.auth.uid,waiterName:u.name||u.auth.email,items:cart.map(({id,name,price,department,qty})=>({id,name,price,department,qty})),total:cart.reduce((s,x)=>s+x.price*x.qty,0)});cart=[];render();toast("Sipariş gönderildi")};render()});
</script></body></html>
