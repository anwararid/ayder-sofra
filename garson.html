<!doctype html>
<html lang="tr">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Ayder Sofra | Garson</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>

<script type="module">

import {
  db,
  collection,
  onSnapshot
} from "./firebase.js";

import {
  shell,
  createOrder,
  money,
  esc,
  toast
} from "./app.js";


/* =========================
   SAYFA
========================= */

const content =
  shell(
    "Garson",
    "Masa seçin ve ürünleri sepete ekleyin."
  );


content.innerHTML = `

<div class="toolbar">

  <select id="table">

    <option value="">
      Masa seçin
    </option>

    ${Array.from(
      { length: 20 },
      (_, i) => `
        <option value="${i + 1}">
          Masa ${i + 1}
        </option>
      `
    ).join("")}

  </select>


  <input
    id="search"
    type="search"
    placeholder="Ürün ara..."
  >

</div>


<div class="split">

  <section
    id="menu"
    class="grid"
  ></section>


  <aside class="card">

    <h2>Sepet</h2>

    <div id="cart"></div>

    <hr>

    <div class="row">

      <b>Toplam</b>

      <b id="total">
        0.00 ₺
      </b>

    </div>

    <br>

    <button
      id="send"
      class="btn primary wide"
      type="button"
    >
      Siparişi Gönder
    </button>

  </aside>

</div>

`;


/* =========================
   ELEMENTLER
========================= */

const table =
  content.querySelector("#table");

const search =
  content.querySelector("#search");

const menuEl =
  content.querySelector("#menu");

const cartEl =
  content.querySelector("#cart");

const total =
  content.querySelector("#total");

const send =
  content.querySelector("#send");


/* =========================
   STATE
========================= */

let menu = [];

let cart = [];


/* =========================
   RENDER
========================= */

function render() {

  const q =
    search.value
      .trim()
      .toLowerCase();


  const filtered =
    menu.filter(item => {

      /*
       * Sadece aktif ürünleri göster.
       * active false ise gösterme.
       */

      const active =
        item.active !== false;


      const name =
        String(
          item.name || ""
        ).toLowerCase();


      const category =
        String(
          item.category || ""
        ).toLowerCase();


      const matches =
        !q ||
        name.includes(q) ||
        category.includes(q);


      return (
        active &&
        matches
      );

    });


  /* =========================
     ÜRÜNLER
  ========================= */

  if (!filtered.length) {

    menuEl.innerHTML = `

      <div class="card">

        <strong>
          Ürün bulunamadı.
        </strong>

        <p class="muted">
          Yönetim panelinden aktif ürün ekleyin.
        </p>

      </div>

    `;

  } else {

    menuEl.innerHTML =
      filtered.map(item => `

        <button
          type="button"
          class="card product"
          data-id="${esc(item.id)}"
        >

          <span>

            <b>
              ${esc(item.name)}
            </b>

            <small>
              ${esc(item.category || "")}
            </small>

            <small>
              ${departmentName(
                item.department
              )}
            </small>

          </span>


          <b>
            ${money(
              Number(item.price || 0)
            )}
          </b>

        </button>

      `).join("");

  }


  /* =========================
     SEPET
  ========================= */

  if (!cart.length) {

    cartEl.innerHTML = `

      <p class="muted">
        Sepet boş
      </p>

    `;

  } else {

    cartEl.innerHTML =
      cart.map(item => `

        <div
          class="row"
          style="margin-bottom:10px"
        >

          <span>

            ${item.qty} ×
            ${esc(item.name)}

          </span>


          <b>

            ${money(
              Number(item.price || 0) *
              Number(item.qty || 0)
            )}

          </b>

        </div>

      `).join("");

  }


  /* =========================
     TOPLAM
  ========================= */

  const sum =
    cart.reduce(
      (sum, item) => {

        return (
          sum +
          Number(item.price || 0) *
          Number(item.qty || 0)
        );

      },
      0
    );


  total.textContent =
    money(sum);

}


/* =========================
   BÖLÜM ADI
========================= */

function departmentName(
  department
) {

  const names = {

    mutfak: "Mutfak",

    firin: "Fırın",

    izgara: "Izgara"

  };


  return (
    names[department] ||
    ""
  );

}


/* ==================================================
   FIREBASE PRODUCTS
================================================== */


/*
 * ÖNEMLİ:
 *
 * Admin panelinde ürünler:
 *
 * collection(db, "products")
 *
 * içine kaydediliyorsa,
 * Garson da aynı collection'ı okumalı.
 */

onSnapshot(

  collection(
    db,
    "products"
  ),

  snapshot => {

    menu =
      snapshot.docs.map(
        item => ({

          id: item.id,

          ...item.data()

        })
      );


    console.log(
      "Garson ürünleri:",
      menu
    );


    render();

  },

  error => {

    console.error(
      "Products error:",
      error
    );


    menuEl.innerHTML = `

      <div class="card">

        <strong>
          Ürünler yüklenemedi.
        </strong>

        <p class="muted">
          Firebase bağlantısını veya Firestore izinlerini kontrol edin.
        </p>

      </div>

    `;


    toast(
      "Ürünler yüklenemedi.",
      "error"
    );

  }

);


/* =========================
   SEARCH
========================= */

search.addEventListener(
  "input",
  render
);


/* =========================
   ÜRÜNÜ SEPETE EKLE
========================= */

menuEl.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "[data-id]"
      );


    if (!button) {
      return;
    }


    const id =
      button.dataset.id;


    const item =
      menu.find(
        product =>
          product.id === id
      );


    if (!item) {
      return;
    }


    /*
     * Pasif ürün sepete girmesin.
     */

    if (
      item.active === false
    ) {

      toast(
        "Bu ürün aktif değil.",
        "error"
      );

      return;

    }


    const old =
      cart.find(
        product =>
          product.id === item.id
      );


    if (old) {

      old.qty += 1;

    } else {

      cart.push({

        id:
          item.id,

        name:
          item.name || "",

        price:
          Number(item.price || 0),

        category:
          item.category || "",

        department:
          item.department || "",

        qty:
          1

      });

    }


    render();

  }
);


/* =========================
   SİPARİŞ GÖNDER
========================= */

send.addEventListener(
  "click",
  async () => {

    /* MASA */

    if (!table.value) {

      toast(
        "Lütfen masa seçin.",
        "error"
      );

      return;

    }


    /* SEPET */

    if (!cart.length) {

      toast(
        "Sepet boş.",
        "error"
      );

      return;

    }


    const totalValue =
      cart.reduce(
        (sum, item) => {

          return (
            sum +
            Number(item.price || 0) *
            Number(item.qty || 0)
          );

        },
        0
      );


    try {

      send.disabled = true;

      send.textContent =
        "Gönderiliyor...";


      await createOrder({

        table:
          Number(table.value),

        waiterName:
          "Garson",

        items:
          cart.map(item => ({

            id:
              item.id,

            name:
              item.name,

            price:
              Number(item.price || 0),

            department:
              item.department || "",

            qty:
              Number(item.qty || 0)

          })),

        total:
          totalValue

      });


      cart = [];


      render();


      toast(
        "Sipariş gönderildi."
      );


    } catch (error) {

      console.error(
        "Order error:",
        error
      );


      toast(
        "Sipariş gönderilemedi.",
        "error"
      );

    } finally {

      send.disabled = false;

      send.textContent =
        "Siparişi Gönder";

    }

  }
);


/* =========================
   İLK RENDER
========================= */

render();

</script>

</body>

</html>
