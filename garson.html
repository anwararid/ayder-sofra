<!doctype html>
<html lang="tr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ayder Sofra | Garson Paneli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0b0f17;
      --panel-bg: rgba(22, 30, 46, 0.7);
      --card-bg: #182235;
      --card-hover: #212e47;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      margin: 0;
      padding: 20px 12px;
      min-height: 100vh;
    }

    .admin-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* HEADER HERO */
    .hero {
      position: relative;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .hero-brand {
      font-size: 0.85rem;
      letter-spacing: 3px;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .hero h1 {
      margin: 0 0 8px 0;
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* PANELS */
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .panel-header {
      margin-bottom: 16px;
    }

    .panel-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 1.5px;
    }

    .panel-header h2 {
      margin: 4px 0 0 0;
      font-size: 1.25rem;
      font-weight: 700;
    }

    /* TABLES GRID */
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }

    .table-btn-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .table-btn-card:hover {
      transform: translateY(-3px);
      background: var(--card-hover);
    }

    .table-btn-card span:first-child {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .table-btn-card.available { border-bottom: 3px solid var(--success); }
    .table-btn-card.busy { border-bottom: 3px solid var(--danger); background: rgba(239, 68, 68, 0.05); }

    .table-btn-card.selected {
      border-color: var(--primary) !important;
      background: rgba(99, 102, 241, 0.15) !important;
      box-shadow: 0 0 20px var(--primary-glow);
      transform: translateY(-3px);
    }

    .table-status-badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .status-available { background: var(--success-bg); color: var(--success); }
    .status-busy { background: var(--danger-bg); color: var(--danger); }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .status-available .pulse-dot { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .status-busy .pulse-dot { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

    /* MENU GRID */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .menu-item-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .menu-item-card h4 {
      margin: 0 0 4px 0;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .menu-item-card .price {
      font-size: 0.9rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .btn-add {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* ORDER CART */
    .cart-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-qty {
      background: #334155;
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 700;
      font-size: 1rem;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      width: 100%;
      margin-top: 10px;
    }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: none;
      z-index: 1000;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .toast-error { background: #7f1d1d !important; color: #fca5a5 !important; }
  </style>
</head>

<body>

<main class="admin-container">

  <!-- HERO HEADER -->
  <section class="hero">
    <div class="hero-brand">AYDER SOFRA 🍽️</div>
    <h1>Garson Sipariş Paneli</h1>
    <p>Masa seçin, sipariş oluşturun, güncelleyin veya masayı boşaltın.</p>
  </section>

  <!-- MASA SEÇİMİ -->
  <section class="panel">
    <div class="panel-header">
      <span class="panel-label">1. ADIM</span>
      <h2>Masa Seçin</h2>
    </div>
    <div id="waiterTablesGrid" class="tables-grid">Yükleniyor...</div>
  </section>

  <!-- MENÜ VE SİPARİŞ SEÇİMİ -->
  <section class="panel">
    <div class="panel-header">
      <span class="panel-label">2. ADIM</span>
      <h2>Menüden Ürün Seçin</h2>
    </div>
    <div id="waiterProductsList" class="menu-grid">Yükleniyor...</div>
  </section>

  <!-- SİPARİŞ ÖZETİ SEPETİ -->
  <section class="panel">
    <div class="panel-header">
      <span class="panel-label">3. ADIM</span>
      <h2 id="selectedTableTitle">Sipariş Özeti (Masa Seçilmedi)</h2>
    </div>

    <div>
      <div id="cartItemsContainer">
        <p style="color: var(--text-muted); text-align: center; padding: 20px 0;">Henüz masa veya ürün seçilmedi.</p>
      </div>
      <hr style="border: none; border-top: 1px solid var(--border); margin: 15px 0;">
      <div style="display:flex; justify-content:space-between; align-items:center; font-size:1.2rem; font-weight:700; margin-bottom:15px;">
        <span>Toplam:</span>
        <span id="cartTotal" style="color: #38bdf8;">0.00 ₺</span>
      </div>
      
      <button id="submitOrderBtn" class="btn-primary" type="button" disabled>Siparişi Kaydet / Güncelle</button>
      <button id="clearTableBtn" class="btn-danger" type="button" style="display:none;">🗑️ Masayı Boşalt ve Hesabı Kapat</button>
    </div>
  </section>

</main>

<div id="toast"></div>

<!-- FIREBASE CONNECTOR SCRIPT -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // استدعاء ملف الإعدادات المباشر أو تعريف كائن متوافق لضمان تحميل الصفحة دائماً
  let db;
  try {
    const { firebaseConfig } = await import("./firebase.js");
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
  } catch (e) {
    console.error("Firebase yüklenirken hata oluştu:", e);
    document.querySelector("#waiterTablesGrid").innerHTML = "<p style='color:var(--danger);'>Firebase bağlantı hatası! firebase.js dosyanızı kontrol edin.</p>";
  }

  const waiterTablesGrid = document.querySelector("#waiterTablesGrid");
  const waiterProductsList = document.querySelector("#waiterProductsList");
  const selectedTableTitle = document.querySelector("#selectedTableTitle");
  const cartItemsContainer = document.querySelector("#cartItemsContainer");
  const cartTotal = document.querySelector("#cartTotal");
  const submitOrderBtn = document.querySelector("#submitOrderBtn");
  const clearTableBtn = document.querySelector("#clearTableBtn");
  const toast = document.querySelector("#toast");

  let tables = [];
  let products = [];
  let activeOrders = [];
  let selectedTable = null;
  let cart = [];
  let currentOrderId = null;

  function showToast(text, error = false) {
    if(!toast) return;
    toast.className = error ? "toast-error" : "";
    toast.textContent = text;
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 3500);
  }

  if (db) {
    // 1. LISTEN TABLES
    onSnapshot(collection(db, "tables"), snapshot => {
      tables = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      tables.sort((a,b) => (parseInt(a.name?.replace(/\D/g,'')) || 0) - (parseInt(b.name?.replace(/\D/g,'')) || 0));
      renderTables();
    });

    // 2. LISTEN ORDERS
    onSnapshot(collection(db, "orders"), snapshot => {
      activeOrders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      if (selectedTable) loadTableOrder(selectedTable);
    });

    // 3. LISTEN PRODUCTS
    onSnapshot(collection(db, "products"), snapshot => {
      products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(p => p.active !== false);
      renderProducts();
    });
  }

  function renderTables() {
    waiterTablesGrid.innerHTML = "";
    if(tables.length === 0) {
      waiterTablesGrid.innerHTML = "<p style='color:var(--text-muted);'>Masa bulunamadı.</p>";
      return;
    }
    tables.forEach(t => {
      const isBusy = t.status === "busy";
      const btn = document.createElement("div");
      btn.className = `table-btn-card ${isBusy ? 'busy' : 'available'} ${selectedTable?.id === t.id ? 'selected' : ''}`;
      
      btn.innerHTML = `
        <span>${t.name}</span>
        <span class="table-status-badge ${isBusy ? 'status-busy' : 'status-available'}">
          <span class="pulse-dot"></span>
          ${isBusy ? 'Dolu' : 'Boş'}
        </span>
      `;
      
      btn.onclick = () => {
        selectedTable = t;
        selectedTableTitle.textContent = `Sipariş Özeti (${t.name})`;
        renderTables();
        loadTableOrder(t);
      };
      
      waiterTablesGrid.appendChild(btn);
    });
  }

  function loadTableOrder(table) {
    const existingOrder = activeOrders.find(o => o.tableId === table.id && o.status !== "completed");
    
    if (existingOrder) {
      currentOrderId = existingOrder.id;
      cart = [...(existingOrder.items || [])];
      clearTableBtn.style.display = "block";
    } else {
      currentOrderId = null;
      cart = [];
      clearTableBtn.style.display = "none";
    }
    updateCartUI();
  }

  function renderProducts() {
    waiterProductsList.innerHTML = "";
    if(products.length === 0) {
      waiterProductsList.innerHTML = "<p style='color:var(--text-muted);'>Ürün bulunamadı.</p>";
      return;
    }
    products.forEach(p => {
      const card = document.createElement("div");
      card.className = "menu-item-card";
      card.innerHTML = `
        <div>
          <h4>${p.name}</h4>
          <div class="price">${Number(p.price || 0).toFixed(2)} ₺</div>
        </div>
        <button class="btn-add">Ekle +</button>
      `;
      card.querySelector("button").onclick = () => addToCart(p);
      waiterProductsList.appendChild(card);
    });
  }

  function addToCart(product) {
    if (!selectedTable) {
      showToast("Lütfen önce bir masa seçin!", true);
      return;
    }
    const exist = cart.find(item => item.id === product.id);
    if (exist) {
      exist.count++;
    } else {
      cart.push({ ...product, count: 1 });
    }
    updateCartUI();
  }

  function updateCartUI() {
    if (cart.length === 0) {
      cartItemsContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 20px 0;">Henüz ürün eklenmedi.</p>`;
      submitOrderBtn.disabled = true;
      cartTotal.textContent = "0.00 ₺";
      return;
    }

    submitOrderBtn.disabled = !selectedTable;
    cartItemsContainer.innerHTML = "";
    let total = 0;

    cart.forEach(item => {
      total += (item.price || 0) * item.count;
      const row = document.createElement("div");
      row.className = "cart-item-row";
      row.innerHTML = `
        <div>
          <strong>${item.name}</strong>
          <div style="font-size:0.8rem; color:var(--text-muted);">${((item.price || 0) * item.count).toFixed(2)} ₺</div>
        </div>
        <div class="cart-item-controls">
          <button class="btn-qty minus">-</button>
          <span>${item.count}</span>
          <button class="btn-qty plus">+</button>
        </div>
      `;

      row.querySelector(".minus").onclick = () => {
        item.count--;
        if (item.count <= 0) cart = cart.filter(i => i.id !== item.id);
        updateCartUI();
      };
      row.querySelector(".plus").onclick = () => {
        item.count++;
        updateCartUI();
      };

      cartItemsContainer.appendChild(row);
    });

    cartTotal.textContent = `${total.toFixed(2)} ₺`;
  }

  // SUBMIT ORDER
  submitOrderBtn.onclick = async () => {
    if (!selectedTable || cart.length === 0) return;

    try {
      const orderId = currentOrderId || `order-${Date.now()}`;
      const now = Date.now();
      
      await setDoc(doc(db, "orders", orderId), {
        id: orderId,
        tableId: selectedTable.id,
        tableName: selectedTable.name,
        items: cart,
        status: "pending",
        createdAt: now,
        updatedAt: now
      }, { merge: true });

      await updateDoc(doc(db, "tables", selectedTable.id), {
        status: "busy"
      });

      showToast("Sipariş başarıyla iletildi!");
    } catch (err) {
      console.error(err);
      showToast("Sipariş kaydedilemedi: " + err.message, true);
    }
  };

  // CLEAR TABLE
  clearTableBtn.onclick = async () => {
    if (!selectedTable) return;
    if (!confirm(`${selectedTable.name} boşaltılsın mı?`)) return;

    try {
      if (currentOrderId) {
        await deleteDoc(doc(db, "orders", currentOrderId));
      }

      await updateDoc(doc(db, "tables", selectedTable.id), {
        status: "available"
      });

      showToast("Masa başarıyla boşaltıldı.");
      cart = [];
      currentOrderId = null;
      clearTableBtn.style.display = "none";
      updateCartUI();
    } catch (err) {
      console.error(err);
      showToast("Masa boşaltılamadı: " + err.message, true);
    }
  };
</script>

</body>
</html>
