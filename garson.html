<!doctype html>
<html lang="tr">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Ayder Sofra | Hizmet</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>


<body class="garson-page">


<script type="module">

import {
  listenOrders,
  listenMenu,
  createOrder,
  setStatus,
  money,
  esc,
  toast
} from "./app.js";


/* ==================================================
   SAYFA
================================================== */

document.body.innerHTML = `

  <div class="service-page">


    <!-- =========================
         HERO
    ========================== -->

    <header class="service-hero">

      <div class="service-brand">

        <div class="service-brand-icon">
          🍴
        </div>

        <div>

          <div class="service-brand-name">
            AYDER SOFRA
          </div>

          <div class="service-brand-subtitle">
            Lezzet, ustalıkla hazırlanır.
          </div>

        </div>

      </div>


      <div class="service-hero-center">

        <div class="service-status">
          <span class="status-dot"></span>
          Sistem Aktif
        </div>

        <h1>
          HİZMET
        </h1>

        <p>
          Garson siparişlerini takip edin
          ve hizmet durumlarını yönetin.
        </p>

      </div>


      <div class="service-hero-decoration">
        🍽️
      </div>

    </header>



    <!-- =========================
         İSTATİSTİKLER
    ========================== -->

    <section class="service-stats">

      <div class="service-stat-card">

        <div class="stat-icon">
          🧾
        </div>

        <div>

          <span>
            AKTİF SİPARİŞ
          </span>

          <strong id="activeCount">
            0
          </strong>

          <small>
            Toplam aktif sipariş
          </small>

        </div>

      </div>


      <div class="service-stat-card">

        <div class="stat-icon">
          👨‍🍳
        </div>

        <div>

          <span>
            HAZIRLANIYOR
          </span>

          <strong id="preparingCount">
            0
          </strong>

          <small>
            Hazırlanmakta olan
          </small>

        </div>

      </div>


      <div class="service-stat-card">

        <div class="stat-icon">
          ✓
        </div>

        <div>

          <span>
            HAZIR
          </span>

          <strong id="readyCount">
            0
          </strong>

          <small>
            Servise hazır
          </small>

        </div>

      </div>

    </section>



    <!-- =========================
         YENİ SİPARİŞ
    ========================== -->

    <section class="new-order-panel">

      <div class="new-order-header">

        <div>

          <div class="section-title">
            🧾 YENİ SİPARİŞ
          </div>

          <div class="section-subtitle">
            Masa seçin ve ürünleri siparişe ekleyin.
          </div>

        </div>

      </div>


      <div class="order-create-grid">


        <div class="order-create-form">


          <label>
            Masa
          </label>

          <select id="tableSelect">

            <option value="">
              Masa seçin
            </option>

            ${Array.from(
              { length: 20 },
              (_, i) => `
                <option value="${i + 1}">
                  Masa ${i + 1}
                </option>
              `
            ).join("")}

          </select>


          <label>
            Ürün ara
          </label>

          <input
            id="productSearch"
            type="search"
            placeholder="Ürün ara..."
          >


          <div
            id="productList"
            class="service-product-list"
          ></div>

        </div>



        <aside class="service-cart">

          <div class="service-cart-title">
            🛒 Sepet
          </div>

          <div id="cartList">
            <p class="muted">
              Sepet boş
            </p>
          </div>

          <div class="service-cart-total">

            <span>
              Toplam
            </span>

            <strong id="cartTotal">
              0.00 ₺
            </strong>

          </div>


          <button
            id="sendOrder"
            class="btn primary wide"
            type="button"
          >
            Siparişi Gönder
          </button>

        </aside>


      </div>

    </section>



    <!-- =========================
         SİPARİŞLER
    ========================== -->

    <section class="service-orders-panel">


      <div class="service-orders-header">

        <div>

          <div class="section-title">
            🍽️ SERVİS SİPARİŞLERİ
          </div>

          <div class="section-subtitle">
            Garson tarafından oluşturulan aktif siparişler
          </div>

        </div>


        <select id="orderFilter">

          <option value="all">
            Tüm Siparişler
          </option>

          <option value="pending">
            Yeni Sipariş
          </option>

          <option value="preparing">
            Hazırlanıyor
          </option>

          <option value="ready">
            Hazır
          </option>

          <option value="served">
            Servis Edildi
          </option>

        </select>

      </div>


      <div
        id="orders"
        class="service-orders-grid"
      ></div>


    </section>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="service-footer">

      <strong>
        AYDER SOFRA
      </strong>

      <span>
        Tazelik, ustalıkla hazırlanır.
      </span>

    </footer>


  </div>

`;



/* ==================================================
   ELEMENTLER
================================================== */

const tableSelect =
  document.querySelector("#tableSelect");


const productSearch =
  document.querySelector("#productSearch");


const productList =
  document.querySelector("#productList");


const cartList =
  document.querySelector("#cartList");


const cartTotal =
  document.querySelector("#cartTotal");


const sendOrder =
  document.querySelector("#sendOrder");


const ordersEl =
  document.querySelector("#orders");


const orderFilter =
  document.querySelector("#orderFilter");


const activeCount =
  document.querySelector("#activeCount");


const preparingCount =
  document.querySelector("#preparingCount");


const readyCount =
  document.querySelector("#readyCount");



/* ==================================================
   STATE
================================================== */

let menu = [];

let cart = [];

let orders = [];



/* ==================================================
   STATUS
================================================== */

function statusName(status) {

  const names = {

    pending:
      "YENİ SİPARİŞ",

    preparing:
      "HAZIRLANIYOR",

    ready:
      "HAZIR",

    served:
      "SERVİS EDİLDİ"

  };

  return names[status] || status;

}


function statusClass(status) {

  const classes = {

    pending:
      "status-new",

    preparing:
      "status-preparing",

    ready:
      "status-ready",

    served:
      "status-served"

  };

  return classes[status] || "";

}



/* ==================================================
   MENU
================================================== */

function renderMenu() {

  const search =
    productSearch.value
      .trim()
      .toLowerCase();


  const filtered =
    menu.filter(product => {

      if (product.active === false) {
        return false;
      }


      const name =
        String(product.name || "")
          .toLowerCase();


      const category =
        String(product.category || "")
          .toLowerCase();


      return (
        !search ||
        name.includes(search) ||
        category.includes(search)
      );

    });


  if (!filtered.length) {

    productList.innerHTML = `

      <div class="service-empty">

        <strong>
          Ürün bulunamadı
        </strong>

        <p>
          Aktif ürün bulunmuyor.
        </p>

      </div>

    `;

    return;

  }


  productList.innerHTML =
    filtered.map(product => `

      <button
        type="button"
        class="service-product"
        data-product-id="${esc(product.id)}"
      >

        <div>

          <strong>
            ${esc(product.name)}
          </strong>

          <small>
            ${esc(product.category || "")}
          </small>

        </div>


        <b>
          ${money(product.price)}
        </b>

      </button>

    `).join("");

}



/* ==================================================
   CART
================================================== */

function renderCart() {

  if (!cart.length) {

    cartList.innerHTML = `

      <p class="muted">
        Sepet boş
      </p>

    `;

    cartTotal.textContent =
      money(0);

    return;

  }


  cartList.innerHTML =
    cart.map(item => `

      <div class="cart-item">

        <div>

          <strong>
            ${item.qty} ×
            ${esc(item.name)}
          </strong>

          <small>
            ${money(item.price)}
          </small>

        </div>


        <div class="cart-item-actions">

          <button
            type="button"
            data-minus="${esc(item.id)}"
          >
            −
          </button>

          <span>
            ${item.qty}
          </span>

          <button
            type="button"
            data-plus="${esc(item.id)}"
          >
            +
          </button>

        </div>

      </div>

    `).join("");


  const total =
    cart.reduce(
      (sum, item) =>
        sum +
        Number(item.price || 0) *
        Number(item.qty || 0),
      0
    );


  cartTotal.textContent =
    money(total);

}



/* ==================================================
   ADD PRODUCT
================================================== */

productList.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "[data-product-id]"
      );


    if (!button) {
      return;
    }


    const product =
      menu.find(
        item =>
          item.id ===
          button.dataset.productId
      );


    if (!product) {
      return;
    }


    const existing =
      cart.find(
        item =>
          item.id === product.id
      );


    if (existing) {

      existing.qty += 1;

    } else {

      cart.push({

        id:
          product.id,

        name:
          product.name,

        price:
          Number(product.price || 0),

        department:
          product.department || "",

        qty:
          1

      });

    }


    renderCart();

  }
);



/* ==================================================
   CART BUTTONS
================================================== */

cartList.addEventListener(
  "click",
  event => {

    const plus =
      event.target.closest(
        "[data-plus]"
      );


    const minus =
      event.target.closest(
        "[data-minus]"
      );


    if (plus) {

      const item =
        cart.find(
          x =>
            x.id ===
            plus.dataset.plus
        );


      if (item) {
        item.qty++;
      }

    }


    if (minus) {

      const item =
        cart.find(
          x =>
            x.id ===
            minus.dataset.minus
        );


      if (!item) {
        return;
      }


      item.qty--;


      if (item.qty <= 0) {

        cart =
          cart.filter(
            x =>
              x.id !== item.id
          );

      }

    }


    renderCart();

  }
);



/* ==================================================
   SEARCH
================================================== */

productSearch.addEventListener(
  "input",
  renderMenu
);



/* ==================================================
   SEND ORDER
================================================== */

sendOrder.addEventListener(
  "click",
  async () => {

    if (!tableSelect.value) {

      toast(
        "Lütfen masa seçin.",
        "error"
      );

      return;

    }


    if (!cart.length) {

      toast(
        "Sepet boş.",
        "error"
      );

      return;

    }


    const total =
      cart.reduce(
        (sum, item) =>
          sum +
          Number(item.price || 0) *
          Number(item.qty || 0),
        0
      );


    try {

      sendOrder.disabled = true;

      sendOrder.textContent =
        "Gönderiliyor...";


      await createOrder({

        table:
          Number(tableSelect.value),

        waiterName:
          "Garson",

        items:
          cart.map(item => ({

            id:
              item.id,

            name:
              item.name,

            price:
              Number(item.price || 0),

            department:
              item.department || "",

            qty:
              Number(item.qty || 0)

          })),

        total

      });


      cart = [];


      renderCart();


      tableSelect.value =
        "";


      toast(
        "Sipariş başarıyla gönderildi."
      );


    } catch (error) {

      console.error(
        "Order error:",
        error
      );


      toast(
        "Sipariş gönderilemedi.",
        "error"
      );

    } finally {

      sendOrder.disabled = false;

      sendOrder.textContent =
        "Siparişi Gönder";

    }

  }
);



/* ==================================================
   ORDERS
================================================== */

function renderOrders() {

  const filter =
    orderFilter.value;


  const filtered =
    orders.filter(order => {

      if (filter === "all") {
        return true;
      }

      return order.status === filter;

    });


  const active =
    orders.filter(order =>
      [
        "pending",
        "preparing",
        "ready"
      ].includes(
        order.status
      )
    );


  activeCount.textContent =
    active.length;


  preparingCount.textContent =
    orders.filter(
      order =>
        order.status ===
        "preparing"
    ).length;


  readyCount.textContent =
    orders.filter(
      order =>
        order.status ===
        "ready"
    ).length;



  if (!filtered.length) {

    ordersEl.innerHTML = `

      <div class="service-empty large">

        <div class="empty-icon">
          🍽️
        </div>

        <h3>
          Sipariş yok
        </h3>

        <p>
          Bu kategoride görüntülenecek sipariş bulunmuyor.
        </p>

      </div>

    `;

    return;

  }



  ordersEl.innerHTML =
    filtered.map(order => {


      const items =
        order.items || [];


      const orderTotal =
        Number(
          order.total || 0
        );


      return `

        <article
          class="
            service-order-card
            ${statusClass(order.status)}
          "
        >


          <div class="service-order-top">


            <div>

              <div class="table-title">

                MASA
                ${esc(order.table)}

              </div>

              <small>
                Garson: ${esc(
                  order.waiterName ||
                  "Garson"
                )}
              </small>

            </div>


            <span
              class="
                order-status
                ${statusClass(order.status)}
              "
            >

              ${statusName(
                order.status
              )}

            </span>


          </div>



          <div class="order-items">


            ${
              items.length

                ? items.map(item => `

                    <div class="order-item">

                      <span>

                        <b>
                          ${Number(
                            item.qty || 0
                          )} ×
                        </b>

                        ${esc(
                          item.name ||
                          "Ürün"
                        )}

                      </span>

                      <strong>
                        ${money(
                          Number(
                            item.price || 0
                          ) *
                          Number(
                            item.qty || 0
                          )
                        )}
                      </strong>

                    </div>

                  `).join("")

                : `

                    <div class="muted">
                      Ürün bulunamadı.
                    </div>

                  `
            }


          </div>



          <div class="service-order-bottom">


            <div>

              <small>
                Toplam
              </small>

              <strong>
                ${money(orderTotal)}
              </strong>

            </div>


            <div class="actions">


              ${
                order.status ===
                "pending"

                  ? `

                    <button
                      type="button"
                      class="btn primary"
                      data-order-id="${esc(order.id)}"
                      data-status="preparing"
                    >

                      👨‍🍳 Hazırlamaya Al

                    </button>

                  `

                  : ""
              }


              ${
                order.status ===
                "preparing"

                  ? `

                    <button
                      type="button"
                      class="btn primary"
                      data-order-id="${esc(order.id)}"
                      data-status="ready"
                    >

                      ✓ Hazır

                    </button>

                  `

                  : ""
              }


              ${
                order.status ===
                "ready"

                  ? `

                    <button
                      type="button"
                      class="btn primary"
                      data-order-id="${esc(order.id)}"
                      data-status="served"
                    >

                      🍽️ Servis Edildi

                    </button>

                  `

                  : ""
              }


              ${
                order.status ===
                "served"

                  ? `

                    <span class="served-label">
                      ✓ Servis tamamlandı
                    </span>

                  `

                  : ""
              }


            </div>


          </div>


        </article>

      `;

    }).join("");

}



/* ==================================================
   ORDER STATUS
================================================== */

ordersEl.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        "[data-status]"
      );


    if (!button) {
      return;
    }


    try {

      button.disabled = true;


      await setStatus(

        button.dataset.orderId,

        button.dataset.status

      );


      toast(
        "Sipariş güncellendi."
      );


    } catch (error) {

      console.error(
        "Status error:",
        error
      );


      toast(
        "Sipariş durumu değiştirilemedi.",
        "error"
      );


      button.disabled = false;

    }

  }
);



/* ==================================================
   FILTER
================================================== */

orderFilter.addEventListener(
  "change",
  renderOrders
);



/* ==================================================
   FIREBASE LISTENERS
================================================== */

listenMenu(
  items => {

    menu = items || [];

    renderMenu();

  }
);


listenOrders(
  incomingOrders => {

    orders =
      incomingOrders || [];

    renderOrders();

  }
);



/* =====================

</script>

</body>

</html>
