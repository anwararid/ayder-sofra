<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayder Sofra - Garson</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #222;
  color: white;
  text-align: center;
  padding: 22px 10px;
}

header h1 {
  margin: 0;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h2 {
  margin-top: 5px;
}

.tables {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.table {
  border: none;
  border-radius: 15px;
  padding: 25px 5px;
  background: #d9f7df;
  color: #222;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.table.dolu {
  background: #ffd1d1;
}

.table span {
  display: block;
  font-size: 13px;
  margin-top: 7px;
  font-weight: normal;
}

.ready-text {
  display: block;
  color: #16803c;
  font-weight: bold;
  margin-top: 5px;
}

.menu {
  display: none;
  margin-top: 25px;
  background: white;
  padding: 20px;
  border-radius: 15px;
}

.station-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  overflow-x: auto;
  padding-bottom: 5px;
}

.tab-btn {
  background: #eee;
  border: none;
  padding: 8px 14px;
  border-radius: 20px;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
  font-size: 14px;
}

.tab-btn.active {
  background: #222;
  color: white;
}

.food {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid #ddd;
}

.food-info {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.food-name {
  font-weight: bold;
}

.food-price {
  color: #16803c;
  font-size: 14px;
}

.food-station-tag {
  font-size: 12px;
  color: #666;
}

.food button {
  background: #222;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 9px 17px;
  font-size: 20px;
  cursor: pointer;
}

.order {
  margin-top: 20px;
  padding-top: 15px;
  border-top: 2px solid #ddd;
}

.order-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid #eee;
}

.remove {
  background: #b3261e;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 5px 10px;
  cursor: pointer;
}

.send {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  background: #16803c;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.send:disabled,
.clear-table:disabled {
  opacity: 0.6;
}

.ready-message {
  display: none;
  margin-top: 15px;
  padding: 15px;
  border-radius: 12px;
  background: #d9f7df;
  color: #146c2e;
  font-size: 17px;
  font-weight: bold;
  text-align: center;
}

.clear-table {
  display: none;
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  background: #d35400;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.loading {
  text-align: center;
  padding: 20px;
  color: #777;
}

@media(max-width:500px) {
  .tables {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>🍽️ AYDER SOFRA</h1>
  <p>Garson Sipariş Sistemi</p>
</header>

<main>

<h2>🪑 Masalar</h2>

<div class="tables" id="tables"></div>

<div class="menu" id="menu">
  <h2 id="tableTitle">Masa</h2>

  <div class="station-tabs">
    <button class="tab-btn active" onclick="filterMenu('all')">Tümü</button>
    <button class="tab-btn" onclick="filterMenu('grill')">🔥 Şef Izgara</button>
    <button class="tab-btn" onclick="filterMenu('oven')">🥖 Fırın</button>
    <button class="tab-btn" onclick="filterMenu('kitchen')">👨‍🍳 Mutfak</button>
  </div>

  <div id="foods">
    <div class="loading">Menü yükleniyor...</div>
  </div>

  <div class="order">
    <h3>🧾 Sipariş Listesi</h3>
    <div id="orderList">Henüz ürün eklenmedi.</div>

    <button class="send" id="sendButton">Siparişi Gönder 👨‍🍳</button>
    <div class="ready-message" id="readyMessage"></div>
    <button class="clear-table" id="clearTableButton">🧹 Masayı Boşalt</button>
  </div>
</div>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  onSnapshot,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDhvLb2QMMe7dy-vQ_3bwKtZK5XXy8lbWM",
  authDomain: "ayder-sofra.firebaseapp.com",
  projectId: "ayder-sofra",
  storageBucket: "ayder-sofra.firebasestorage.app",
  messagingSenderId: "459245770853",
  appId: "1:459245770853:web:8d32163fef443a2b7c8e8c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let selectedTable = null;
let order = [];
let menuItems = [];
let ordersData = [];
let currentFilter = "all";

const tables = document.getElementById("tables");
const foods = document.getElementById("foods");
const menu = document.getElementById("menu");
const orderList = document.getElementById("orderList");
const readyMessage = document.getElementById("readyMessage");
const sendButton = document.getElementById("sendButton");
const clearTableButton = document.getElementById("clearTableButton");

for (let i = 1; i <= 15; i++) {
  const button = document.createElement("button");
  button.className = "table";
  button.id = "table-" + i;
  button.innerHTML = `Masa ${i} <span>Boş</span>`;
  button.addEventListener("click", () => openTable(i));
  tables.appendChild(button);
}

onSnapshot(collection(db, "menu"), (snapshot) => {
  menuItems = [];
  snapshot.forEach((productDoc) => {
    const data = productDoc.data();
    menuItems.push({
      id: productDoc.id,
      name: String(data.name || "Ürün"),
      price: Number(data.price || 0),
      station: String(data.station || "kitchen")
    });
  });
  renderMenu();
}, (error) => {
  console.error(error);
  foods.innerHTML = `<div class="loading">Menü yüklenemedi.</div>`;
});

window.filterMenu = function(station) {
  currentFilter = station;
  document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
  event.target.classList.add("active");
  renderMenu();
};

function renderMenu() {
  foods.innerHTML = "";
  const filtered = currentFilter === "all" ? menuItems : menuItems.filter(i => i.station === currentFilter);

  if (filtered.length === 0) {
    foods.innerHTML = `<div class="loading">Bu bölümde ürün bulunamadı.</div>`;
    return;
  }

  filtered.forEach((item) => {
    const food = document.createElement("div");
    food.className = "food";

    const info = document.createElement("div");
    info.className = "food-info";

    const name = document.createElement("div");
    name.className = "food-name";
    name.textContent = item.name;

    const price = document.createElement("div");
    price.className = "food-price";
    price.textContent = item.price + " TL";

    let stationLabel = item.station === "grill" ? "🔥 Şef Izgara" : (item.station === "oven" ? "🥖 Fırın" : "👨‍🍳 Mutfak");
    const tag = document.createElement("div");
    tag.className = "food-station-tag";
    tag.textContent = stationLabel;

    info.appendChild(name);
    info.appendChild(price);
    info.appendChild(tag);

    const button = document.createElement("button");
    button.textContent = "+";
    button.addEventListener("click", () => addItem(item));

    food.appendChild(info);
    food.appendChild(button);
    foods.appendChild(food);
  });
}

function openTable(number) {
  selectedTable = number;
  order = [];
  document.getElementById("tableTitle").textContent = "Masa " + number;
  menu.style.display = "block";
  updateOrder();
  updateReadyMessage();
  updateClearButton();
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

function addItem(item) {
  order.push({
    name: item.name,
    price: item.price,
    station: item.station
  });
  updateOrder();
}

function updateOrder() {
  orderList.innerHTML = "";
  if (order.length === 0) {
    orderList.textContent = "Henüz ürün eklenmedi.";
    return;
  }

  order.forEach((item, index) => {
    const row = document.createElement("div");
    row.className = "order-item";

    let stationLabel = item.station === "grill" ? "🔥 Izgara" : (item.station === "oven" ? "🥖 Fırın" : "👨‍🍳 Mutfak");
    const text = document.createElement("span");
    text.textContent = `${index + 1}. ${item.name} (${stationLabel})`;

    const remove = document.createElement("button");
    remove.className = "remove";
    remove.textContent = "×";
    remove.addEventListener("click", () => {
      order.splice(index, 1);
      updateOrder();
    });

    row.appendChild(text);
    row.appendChild(remove);
    orderList.appendChild(row);
  });
}

sendButton.addEventListener("click", sendOrder);

async function sendOrder() {
  if (!selectedTable) { alert("Lütfen masa seçin."); return; }
  if (order.length === 0) { alert("Lütfen sipariş ekleyin."); return; }

  try {
    sendButton.disabled = true;

    const groupedItems = {};
    order.forEach(item => {
      const st = item.station || "kitchen";
      if (!groupedItems[st]) groupedItems[st] = [];
      groupedItems[st].push({
        name: String(item.name),
        price: Number(item.price || 0),
        station: st
      });
    });

    for (const stationKey in groupedItems) {
      await addDoc(collection(db, "orders"), {
        table: Number(selectedTable),
        items: groupedItems[stationKey],
        station: stationKey,
        status: "new",
        createdAt: serverTimestamp()
      });
    }

    alert("Masa " + selectedTable + " siparişi ilgili bölümlere gönderildi! 👨‍🍳");
    order = [];
    updateOrder();
  } catch (error) {
    console.error(error);
    alert("Sipariş gönderilemedi: " + error.message);
  } finally {
    sendButton.disabled = false;
  }
}

onSnapshot(collection(db, "orders"), (snapshot) => {
  ordersData = [];
  snapshot.forEach((orderDoc) => {
    ordersData.push({ id: orderDoc.id, ...orderDoc.data() });
  });
  updateTables();
  updateReadyMessage();
  updateClearButton();
});

function updateTables() {
  for (let tableNumber = 1; tableNumber <= 15; tableNumber++) {
    const button = document.getElementById("table-" + tableNumber);
    if (!button) continue;
    const span = button.querySelector("span");

    const tableOrders = ordersData.filter(item => Number(item.table) === tableNumber && item.status !== "completed" && item.status !== "deleted");

    if (tableOrders.length > 0) {
      button.classList.add("dolu");
      span.innerHTML = "Dolu";
      const hasReady = tableOrders.some(item => item.status === "ready");
      if (hasReady) {
        span.innerHTML = `Dolu <div class="ready-text">✅ Sipariş Hazır</div>`;
      }
    } else {
      button.classList.remove("dolu");
      span.innerHTML = "Boş";
    }
  }
}

function updateReadyMessage() {
  if (!selectedTable) { readyMessage.style.display = "none"; return; }
  const readyOrders = ordersData.filter(item => Number(item.table) === Number(selectedTable) && item.status === "ready");
  readyMessage.style.display = readyOrders.length > 0 ? "block" : "none";
  if (readyOrders.length > 0) readyMessage.textContent = "✅ Sipariş Hazır!";
}

function updateClearButton() {
  if (!selectedTable) { clearTableButton.style.display = "none"; return; }
  const activeOrders = ordersData.filter(item => Number(item.table) === Number(selectedTable) && item.status !== "completed" && item.status !== "deleted");
  clearTableButton.style.display = activeOrders.length > 0 ? "block" : "none";
}

clearTableButton.addEventListener("click", clearTable);

async function clearTable() {
  if (!selectedTable) return;
  const activeOrders = ordersData.filter(item => Number(item.table) === Number(selectedTable) && item.status !== "completed" && item.status !== "deleted");

  if (activeOrders.length === 0) { alert("Bu masa zaten boş. 🟢"); return; }
  if (!confirm("Masa " + selectedTable + " boşaltılsın mı?")) return;

  try {
    clearTableButton.disabled = true;
    for (const item of activeOrders) {
      await updateDoc(doc(db, "orders", item.id), {
        status: "completed",
        completedAt: serverTimestamp()
      });
    }
    order = [];
    updateOrder();
    alert("Masa " + selectedTable + " artık boş. 🟢");
  } catch (error) {
    console.error(error);
    alert("Masa boşaltılamadı: " + error.message);
  } finally {
    clearTableButton.disabled = false;
  }
}
</script>

</body>
</html>
