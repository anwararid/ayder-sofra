<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayder Sofra - Mutfak Paneli</title>
<!-- 1. ربط ملفات المكتبات الأصلية (مثل Firebase) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<!-- 2. كود التنسيق الجديد (CSS) لضمان الألوان والبطاقات -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; color: #17212b; background: #eaf5fb; padding: 15px; }
.container { max-width: 1200px; margin: 0 auto; }
.hero { background: linear-gradient(120deg, #0e3042, #2a6a89); padding: 25px 30px; color: #fff; border-radius: 24px; margin-bottom: 25px; }
.section-heading { margin: 20px 0; }
.section-heading h2 { font-size: 24px; }
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.ticket-card { background: #fff; border: 1px solid #dce7eb; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
/* كود خاص بتلوين البطاقات حسب الحالة */
.ticket-card[data-status="pending"] { border-top: 4px solid #d85e55; }
.ticket-card[data-status="cooking"] { border-top: 4px solid #e8bb70; }
.ticket-card[data-status="ready"] { border-top: 4px solid #56a96c; }
.ticket-header { display: flex; justify-content: space-between; border-bottom: 1px dashed #e1e9ec; padding-bottom: 10px; }
.table-badge { background: #edf5f8; font-size: 16px; font-weight: 800; padding: 4px 10px; border-radius: 10px; }
.item-qty { background: #a46b31; color: #fff; padding: 2px 6px; border-radius: 4px; margin-right: 5px; }
.btn { height: 40px; border: 0; border-radius: 10px; font-weight: 800; cursor: pointer; color: #fff; width: 100%; }
.btn-update { background: linear-gradient(135deg, #164b5b, #28758a); }
</style>
</head>
<body>

<div class="container">
  <div class="hero">
    <h1>AYDER SOFRA • MUTFAK</h1>
    <p>Aktif mutfak siparişlerini buradan yönetebilirsiniz.</p>
  </div>

  <div class="section-heading">
    <h2>Canlı Siparişler</h2>
  </div>

  <!-- 3. منطقة عرض البطاقات الديناميكية -->
  <div id="orders-grid" class="cards-grid">
    <!-- سيتم ملء هذا الجزء تلقائياً بواسطة الجافا سكربت -->
  </div>
</div>

<!-- 4. الكود البرمجي الأصلي لجلب البيانات (من Firebase) -->
<script>
// --- تكوين Firebase الخاص بك (يرجى نسخه من ملفك الأصلي إذا اختلف) ---
const firebaseConfig = {
  // يرجى ملء بيانات Firebase الخاصة بك هنا (APIKey, etc.)
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

// تهيئة Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// --- دالة لجلب وعرض الطلبات بتنسيق البطاقات الجديدة ---
db.collection("orders").onSnapshot((snapshot) => {
  const grid = document.getElementById('orders-grid');
  grid.innerHTML = ''; // تفريغ المنطقة أولاً

  snapshot.forEach((doc) => {
    const order = doc.data();
    
    // إنشاء البطاقة الجديدة (HTML Structure)
    const card = `
      <div class="ticket-card" data-status="${order.status}">
        <div class="ticket-header">
          <span class="table-badge">Masa ${order.tableNumber}</span>
        </div>
        <div class="ticket-items">
          ${order.items.map(item => `
            <div><span class="item-qty">${item.quantity}</span> ${item.name}</div>
          `).join('')}
        </div>
        <button class="btn btn-update" onclick="updateOrderStatus('${doc.id}', '${order.status}')">Durumu Güncelle</button>
      </div>
    `;
    
    // إضافة البطاقة للشبكة
    grid.innerHTML += card;
  });
});

// دالة لتحديث حالة الطلب (نفس المنطق القديم)
async function updateOrderStatus(orderId, currentStatus) {
  let nextStatus;
  if (currentStatus === 'pending') nextStatus = 'cooking';
  else if (currentStatus === 'cooking') nextStatus = 'ready';
  else return; // إذا كانت جاهزة لا نفعل شيء

  await db.collection("orders").doc(orderId).update({ status: nextStatus });
}
</script>
</body>
</html>
