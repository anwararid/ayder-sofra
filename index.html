<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ayder Sofra - Garson</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="brand">Ayder Sofra</div><div class="sub">Garson Sipariş Paneli</div></header><main class="wrap"><div class="between"><h2 class="section-title">Masalar</h2><button class="btn secondary" id="out">Çıkış</button></div><div id="msg"></div><div id="tables" class="grid tables"></div></main><div id="modal" class="modal hidden"><div class="modal-box"><div class="between"><h2 id="mtitle"></h2><button class="btn secondary" id="close">Kapat</button></div><div id="existing"></div><div id="content"></div></div></div><script type="module">
import{requireRole,live,liveQuery,db,logout,$,esc,money,seedTables,seedProducts}from"./app.js";import{collection,query,where,orderBy,addDoc,doc,updateDoc,getDocs}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
requireRole(["garson"],async(user)=>{
 await seedTables();await seedProducts();$("#out").onclick=logout;
 let tables=[],products=[],cart={},selected=null,unsubs=[];
 live("tables",v=>{tables=v.filter(x=>x.active!==false).sort((a,b)=>a.number-b.number);renderTables()});
 live("products",v=>{products=v.filter(x=>x.active!==false);});
 function renderTables(){$("#tables").innerHTML=tables.map(t=>`<button class="table ${t.status==="empty"?"empty":"busy"}" data-id="${t.id}">Masa ${t.number}<br><span class="small">${t.status==="empty"?"Boş":"Dolu"}</span></button>`).join("");$$(".table").forEach(b=>b.onclick=()=>openTable(tables.find(t=>t.id===b.dataset.id)))}
 async function openTable(t){selected=t;cart={};$("#modal").classList.remove("hidden");$("#mtitle").textContent=`Masa ${t.number}`;renderOrder();renderProducts();unsubs.forEach(f=>f());unsubs=[];const q=query(collection(db,"orders"),where("tableId","==",t.id),where("status","in",["open","preparing","ready"]));unsubs.push(liveQuery(q,orders=>{renderOrder(orders)}))}
 function renderProducts(){const cats=["Tümü",...new Set(products.map(p=>p.category))];$("#content").innerHTML=`<div class="tabs">${cats.map(c=>`<button class="tab" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div><div id="plist" class="grid products"></div><div id="cart"></div>`;$$(".tab").forEach(b=>b.onclick=()=>{ $$(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");showProducts(b.dataset.cat)});$(".tab").click()}
 function showProducts(cat){const ps=cat==="Tümü"?products:products.filter(p=>p.category===cat);$("#plist").innerHTML=ps.map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="price">${money(p.price)}</div><div class="qty"><button data-minus="${p.id}">−</button><span>${cart[p.id]||0}</span><button data-plus="${p.id}">+</button></div></div>`).join("");$$("[data-minus]").forEach(b=>b.onclick=()=>change(b.dataset.minus,-1));$$("[data-plus]").forEach(b=>b.onclick=()=>change(b.dataset.plus,1))}
 function change(id,n){cart[id]=Math.max(0,(cart[id]||0)+n);if(!cart[id])delete cart[id];showProducts($(".tab.active")?.dataset.cat||"Tümü");renderCartOnly()}
 function renderCartOnly(){const arr=products.filter(p=>cart[p.id]);const total=arr.reduce((s,p)=>s+p.price*cart[p.id],0);$("#cart").innerHTML=`<div class="card" style="margin-top:14px"><h3>Yeni Sipariş</h3>${arr.length?arr.map(p=>`<div class="between item"><span>${esc(p.name)} × ${cart[p.id]}</span><b>${money(p.price*cart[p.id])}</b></div>`).join(""):`<p class="muted">Ürün seçilmedi.</p>`}<div class="total between"><span>Toplam</span><span>${money(total)}</span></div><button class="btn success" id="send" style="width:100%;margin-top:12px" ${arr.length?"":"disabled"}>Siparişi Gönder</button></div>`;$("#send")?.addEventListener("click",send)}
 async function send(){const items=products.filter(p=>cart[p.id]).map(p=>({productId:p.id,name:p.name,price:p.price,quantity:cart[p.id],station:p.station,status:p.station==="hazir"?"ready":"preparing"}));if(!items.length)return;const total=items.reduce((s,i)=>s+i.price*i.quantity,0);await addDoc(collection(db,"orders"),{tableId:selected.id,tableNumber:selected.number,items,total,status:"open",createdAt:new Date()});await updateDoc(doc(db,"tables",selected.id),{status:"full"});cart={};renderProducts();alert("Sipariş gönderildi.");}
 function renderOrder(orders=[]){const old=$("#existing");if(!old)return;const total=orders.reduce((s,o)=>s+Number(o.total||0),0);old.innerHTML=orders.length?`<h3>Aktif Siparişler</h3>${orders.map(o=>`<div class="item ${o.status==="ready"?"ready":"preparing"}"><div class="between"><b>Sipariş</b><span class="pill">${o.status==="ready"?"Hazır":"Hazırlanıyor"}</span></div>${o.items.map(i=>`<div>${esc(i.name)} × ${i.quantity} — ${money(i.price*i.quantity)} <span class="pill">${i.status==="ready"?"Hazır":"Hazırlanıyor"}</span></div>`).join("")}<div class="total between"><span>Toplam</span><span>${money(o.total)}</span></div></div>`).join("")}<div class="card" style="margin-top:12px"><div class="total between"><span>Hesap Toplamı</span><span>${money(total)}</span></div><button class="btn danger" id="clearTable" style="width:100%;margin-top:12px">Masayı Boşalt</button></div>`:`<div class="card"><p class="muted">Aktif sipariş yok.</p></div>`;$("#clearTable")?.addEventListener("click",()=>clearTable(orders,total))}
async function clearTable(orders,total){if(!selected)return;if(!confirm(`Masa ${selected.number} boşaltılsın mı?\nHesap: ${money(total)}`))return;for(const o of orders){await updateDoc(doc(db,"orders",o.id),{status:"closed",closedAt:new Date()})}await updateDoc(doc(db,"tables",selected.id),{status:"empty"});alert(`Masa ${selected.number} boşaltıldı.\nToplam hesap: ${money(total)}`);$("#modal").classList.add("hidden");selected=null;unsubs.forEach(f=>f());unsubs=[]}
 $("#close").onclick=()=>{$("#modal").classList.add("hidden");unsubs.forEach(f=>f());unsubs=[]};});
</script></body></html>
