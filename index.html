<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayder Sofra</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #222;
  color: white;
  text-align: center;
  padding: 22px 10px;
}

header h1 {
  margin: 0;
}

main {
  padding: 20px;
  max-width: 700px;
  margin: auto;
}

h2 {
  margin-top: 5px;
}

.tables {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.table {
  border: none;
  border-radius: 15px;
  padding: 20px 5px;
  background: #d9f7df;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.table.dolu {
  background: #ffd6d6;
}

.table span {
  display: block;
  font-size: 12px;
  margin-top: 7px;
  font-weight: normal;
}

.ready-small {
  display: block;
  margin-top: 5px;
  color: #16803c;
  font-size: 12px;
}

.menu {
  display: none;
  margin-top: 25px;
  background: white;
  padding: 20px;
  border-radius: 15px;
}

.food {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid #ddd;
}

.food-info {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.price {
  color: #16803c;
  font-weight: bold;
}

.food button {
  background: #222;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 9px 17px;
  font-size: 20px;
  cursor: pointer;
}

.order {
  margin-top: 20px;
  padding-top: 15px;
  border-top: 2px solid #ddd;
}

.order-item {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
}

.total {
  margin-top: 15px;
  padding-top: 15px;
  border-top: 2px solid #ddd;
  font-size: 20px;
  font-weight: bold;
}

.send {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  background: #16803c;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.ready-message {
  display: none;
  margin-top: 15px;
  padding: 15px;
  border-radius: 12px;
  background: #d9f7df;
  color: #146c2e;
  font-size: 17px;
  font-weight: bold;
  text-align: center;
}

.clear-table {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 12px;
  background: #b3261e;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.empty-menu {
  text-align: center;
  padding: 20px;
  color: #777;
}

@media(max-width:500px) {
  .tables {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>🍽️ AYDER SOFRA</h1>
  <p>Restoran Yönetim Sistemi</p>
</header>

<main>

<h2>🪑 Masalar</h2>

<div class="tables" id="tables"></div>

<div class="menu" id="menu">

  <h2 id="tableTitle">Masa</h2>

  <div id="foodList">
    Menü yükleniyor...
  </div>

  <div class="order">

    <h3>🧾 Sipariş</h3>

    <div id="orderList">
      Henüz ürün eklenmedi.
    </div>

    <div class="total">
      Toplam: <span id="totalPrice">0</span> TL
    </div>

    <button class="send" onclick="sendOrder()">
      Siparişi Gönder 👨‍🍳
    </button>

    <div class="ready-message" id="readyMessage">
      ✅ Sipariş hazır!
    </div>

    <button class="clear-table" onclick="clearTable()">
      🧹 Masa Boşalt
    </button>

  </div>

</div>

</main>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  onSnapshot,
  query,
  where,
  doc,
  updateDoc
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyDhvLb2QMMe7dy-vQ_3bwKtZK5XXy8lbWM",
  authDomain: "ayder-sofra.firebaseapp.com",
  projectId: "ayder-sofra",
  storageBucket: "ayder-sofra.firebasestorage.app",
  messagingSenderId: "459245770853",
  appId: "1:459245770853:web:8d32163fef443a2b7c8e8c"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


let selectedTable = null;

let order = [];

let menuItems = [];

let tableOrders = {};

let readyOrders = {};

let readyListener = null;


/* =========================
   الطاولات
========================= */

const tables =
  document.getElementById("tables");


for (let i = 1; i <= 15; i++) {

  const button =
    document.createElement("button");

  button.className = "table";

  button.dataset.table = i;

  button.innerHTML =
    "Masa " + i +
    "<span>Boş</span>";

  button.onclick = function() {
    openTable(i);
  };

  tables.appendChild(button);
}


/* =========================
   قراءة قائمة الطعام
========================= */

onSnapshot(
  collection(db, "menu"),
  (snapshot) => {

    menuItems = [];

    snapshot.forEach((productDoc) => {

      const data =
        productDoc.data();

      menuItems.push({
        id: productDoc.id,
        name: data.name || "Ürün",
        price: Number(data.price) || 0
      });

    });

    renderMenu();

  },
  (error) => {

    console.error(error);

    document.getElementById("foodList").innerHTML =
      '<div class="empty-menu">Menü yüklenemedi.</div>';

  }
);


/* =========================
   عرض القائمة
========================= */

function renderMenu() {

  const foodList =
    document.getElementById("foodList");

  foodList.innerHTML = "";


  if (menuItems.length === 0) {

    foodList.innerHTML =
      '<div class="empty-menu">Menü boş.</div>';

    return;
  }


  menuItems.forEach((item) => {

    const food =
      document.createElement("div");

    food.className = "food";


    const info =
      document.createElement("div");

    info.className = "food-info";


    const name =
      document.createElement("strong");

    name.textContent =
      item.name;


    const price =
      document.createElement("span");

    price.className = "price";

    price.textContent =
      item.price + " TL";


    info.appendChild(name);
    info.appendChild(price);


    const button =
      document.createElement("button");

    button.textContent = "+";


    button.onclick = function() {

      addItem(item);

    };


    food.appendChild(info);
    food.appendChild(button);

    foodList.appendChild(food);

  });

}


/* =========================
   فتح طاولة
========================= */

function openTable(number) {

  selectedTable = number;

  order = [];


  document.getElementById("tableTitle").innerText =
    "Masa " + number;


  document.getElementById("menu").style.display =
    "block";


  document.getElementById("readyMessage").style.display =
    "none";


  updateOrder();

  listenForReadyOrder(number);

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

}


/* =========================
   إضافة منتج
========================= */

function addItem(item) {

  order.push({
    name: item.name,
    price: item.price
  });

  updateOrder();

}


/* =========================
   عرض الطلب والحساب
========================= */

function updateOrder() {

  const list =
    document.getElementById("orderList");

  const totalElement =
    document.getElementById("totalPrice");


  if (order.length === 0) {

    list.innerHTML =
      "Henüz ürün eklenmedi.";

    totalElement.textContent =
      "0";

    return;
  }


  list.innerHTML = "";


  let total = 0;


  order.forEach((item) => {

    total += Number(item.price) || 0;


    const row =
      document.createElement("div");

    row.className =
      "order-item";


    row.innerHTML =
      "<span>" +
      escapeHtml(item.name) +
      "</span>" +
      "<strong>" +
      item.price +
      " TL</strong>";


    list.appendChild(row);

  });


  totalElement.textContent =
    total;

}


/* =========================
   إرسال الطلب
========================= */

window.sendOrder = async function() {

  if (!selectedTable) {

    alert("Lütfen masa seçin.");

    return;
  }


  if (order.length === 0) {

    alert("Lütfen sipariş ekleyin.");

    return;
  }


  try {

    const itemsForFirebase =
      order.map((item) => ({
        name: item.name,
        price: item.price
      }));


    const total =
      order.reduce(
        (sum, item) =>
          sum + Number(item.price || 0),
        0
      );


    await addDoc(
      collection(db, "orders"),
      {
        table: selectedTable,
        items: itemsForFirebase,
        total: total,
        status: "new",
        createdAt: serverTimestamp()
      }
    );


    alert(
      "Masa " +
      selectedTable +
      " siparişi mutfağa gönderildi! 👨‍🍳"
    );


    order = [];

    updateOrder();

  } catch (error) {

    console.error(error);

    alert(
      "Sipariş gönderilemedi. Firebase bağlantısını kontrol edin."
    );

  }

};


/* =========================
   الطلبات الجاهزة
========================= */

function listenForReadyOrder(tableNumber) {

  if (readyListener) {

    readyListener();

    readyListener = null;

  }


  const q =
    query(
      collection(db, "orders"),
      where("table", "==", tableNumber),
      where("status", "==", "ready")
    );


  readyListener =
    onSnapshot(q, (snapshot) => {

      const readyMessage =
        document.getElementById("readyMessage");


      if (!snapshot.empty) {

        readyMessage.style.display =
          "block";

        readyMessage.innerText =
          "✅ Masa " +
          tableNumber +
          " siparişi hazır!";

      } else {

        readyMessage.style.display =
          "none";

      }

    });

}


/* =========================
   تحديث حالة الطاولات
========================= */

onSnapshot(
  collection(db, "orders"),
  (snapshot) => {

    tableOrders = {};
    readyOrders = {};


    snapshot.forEach((orderDoc) => {

      const data =
        orderDoc.data();

      const table =
        Number(data.table);


      if (!table) {
        return;
      }


      if (
        data.status === "new" ||
        data.status === "ready"
      ) {

        tableOrders[table] = true;

      }


      if (data.status === "ready") {

        readyOrders[table] = true;

      }

    });


    updateTableButtons();

  }
);


/* =========================
   ألوان الطاولات
========================= */

function updateTableButtons() {

  const buttons =
    document.querySelectorAll(".table");


  buttons.forEach((button) => {

    const number =
      Number(button.dataset.table);


    const span =
      button.querySelector("span");


    const ready =
      readyOrders[number];


    const occupied =
      tableOrders[number];


    button.classList.toggle(
      "dolu",
      occupied
    );


    if (ready) {

      span.innerHTML =
        "Dolu" +
        '<span class="ready-small">✅ Sipariş Hazır</span>';

    } else if (occupied) {

      span.textContent =
        "Dolu";

    } else {

      span.textContent =
        "Boş";

    }

  });

}


/* =========================
   إفراغ الطاولة
========================= */

window.clearTable = async function() {

  if (!selectedTable) {

    alert("Lütfen masa seçin.");

    return;
  }


  const ok =
    confirm(
      "Masa " +
      selectedTable +
      " temizlendi mi?"
    );


  if (!ok) {
    return;
  }


  try {

    const q =
      query(
        collection(db, "orders"),
        where("table", "==", selectedTable),
        where("status", "==", "ready")
      );


    onSnapshot(
      q,
      async (snapshot) => {

        for (const orderDoc of snapshot.docs) {

          await updateDoc(
            doc(
              db,
              "orders",
              orderDoc.id
            ),
            {
              status: "completed"
            }
          );

        }

      },
      {
        once: true
      }
    );


    alert(
      "Masa " +
      selectedTable +
      " Boş oldu. ✅"
    );


    document.getElementById("readyMessage").style.display =
      "none";

  } catch (error) {

    console.error(error);

    alert(
      "Masa boşaltılamadı."
    );

  }

};


/* =========================
   حماية النص
========================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}

</script>

</body>
</html>
```
