<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Ayder Sofra - Garson</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #222;
  color: white;
  text-align: center;
  padding: 22px 10px;
}

header h1 {
  margin: 0;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h2 {
  margin-top: 5px;
}


/* =========================
   MASALAR
========================= */

.tables {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.table {
  border: none;
  border-radius: 15px;
  padding: 25px 5px;
  background: #d9f7df;
  color: #222;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.table.dolu {
  background: #ffd6d6;
}

.table span {
  display: block;
  font-size: 12px;
  margin-top: 7px;
  font-weight: normal;
}


/* =========================
   MENÜ
========================= */

.menu {
  display: none;
  margin-top: 25px;
  background: white;
  padding: 20px;
  border-radius: 15px;
}

.food {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid #ddd;
}

.food-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.food-name {
  font-weight: bold;
}

.food-price {
  color: #16803c;
  font-size: 14px;
}

.food button {
  background: #222;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 9px 17px;
  font-size: 20px;
  cursor: pointer;
}


/* =========================
   SIPARIŞ
========================= */

.order {
  margin-top: 20px;
  padding-top: 15px;
  border-top: 2px solid #ddd;
}

.order-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid #eee;
}

.remove {
  background: #b3261e;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 5px 9px;
  cursor: pointer;
}

.send {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  background: #16803c;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.ready-message {
  display: none;
  margin-top: 15px;
  padding: 15px;
  border-radius: 12px;
  background: #d9f7df;
  color: #146c2e;
  font-size: 17px;
  font-weight: bold;
  text-align: center;
}

.loading {
  text-align: center;
  padding: 20px;
  color: #777;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:500px) {

  .tables {
    grid-template-columns: repeat(2, 1fr);
  }

}

</style>

</head>


<body>


<header>

  <h1>🍽️ AYDER SOFRA</h1>

  <p>Garson Sipariş Sistemi</p>

</header>


<main>


<h2>🪑 Masalar</h2>


<div
  class="tables"
  id="tables"
></div>



<div
  class="menu"
  id="menu"
>


  <h2 id="tableTitle">
    Masa
  </h2>


  <div
    id="foods"
  >

    <div class="loading">
      Menü yükleniyor...
    </div>

  </div>



  <div class="order">


    <h3>
      🧾 Sipariş
    </h3>


    <div
      id="orderList"
    >
      Henüz ürün eklenmedi.
    </div>


    <button
      class="send"
      onclick="sendOrder()"
    >
      Siparişi Gönder 👨‍🍳
    </button>


    <div
      class="ready-message"
      id="readyMessage"
    >
      ✅ Sipariş hazır!
    </div>


  </div>


</div>


</main>



<script type="module">


/* =========================
   FIREBASE
========================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  onSnapshot,
  query,
  where,
  doc,
  updateDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

  apiKey:
    "AIzaSyDhvLb2QMMe7dy-vQ_3bwKtZK5XXy8lbWM",

  authDomain:
    "ayder-sofra.firebaseapp.com",

  projectId:
    "ayder-sofra",

  storageBucket:
    "ayder-sofra.firebasestorage.app",

  messagingSenderId:
    "459245770853",

  appId:
    "1:459245770853:web:8d32163fef443a2b7c8e8c"

};



const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);



/* =========================
   VARIABLES
========================= */

let selectedTable = null;

let order = [];

let menuItems = [];

let readyListener = null;



const tables =
  document.getElementById("tables");


const foods =
  document.getElementById("foods");



/* =========================
   إنشاء الطاولات
========================= */

for (
  let i = 1;
  i <= 15;
  i++
) {

  const button =
    document.createElement("button");


  button.className =
    "table";


  button.id =
    "table-" + i;


  button.innerHTML =
    "Masa " +
    i +
    "<span>Boş</span>";


  button.onclick =
    function() {

      openTable(i);

    };


  tables.appendChild(button);

}



/* =========================
   قراءة MENU من FIREBASE
========================= */

onSnapshot(
  collection(db, "menu"),
  (snapshot) => {

    menuItems = [];


    snapshot.forEach(
      (productDoc) => {

        const data =
          productDoc.data();


        menuItems.push({

          id:
            productDoc.id,

          name:
            data.name || "Ürün",

          price:
            Number(data.price || 0),

          station:
            data.station || "kitchen"

        });

      }
    );


    renderMenu();

  },
  (error) => {

    console.error(error);

    foods.innerHTML = `
      <div class="loading">
        Menü yüklenemedi.
      </div>
    `;

  }
);



/* =========================
   عرض القائمة
========================= */

function renderMenu() {

  foods.innerHTML = "";


  if (menuItems.length === 0) {

    foods.innerHTML = `
      <div class="loading">
        Menüde ürün yok.
      </div>
    `;

    return;

  }


  menuItems.forEach(
    (item) => {

      const food =
        document.createElement("div");


      food.className =
        "food";


      const info =
        document.createElement("div");


      info.className =
        "food-info";


      const name =
        document.createElement("div");


      name.className =
        "food-name";


      name.textContent =
        item.name;


      const price =
        document.createElement("div");


      price.className =
        "food-price";


      price.textContent =
        item.price +
        " TL";


      info.appendChild(name);

      info.appendChild(price);



      const button =
        document.createElement("button");


      button.textContent =
        "+";


      button.onclick =
        function() {

          addItem(item);

        };


      food.appendChild(info);

      food.appendChild(button);


      foods.appendChild(food);

    }
  );

}



/* =========================
   فتح طاولة
========================= */

function openTable(number) {

  selectedTable =
    number;


  order = [];


  document
    .getElementById("tableTitle")
    .innerText =
      "Masa " + number;


  document
    .getElementById("menu")
    .style.display =
      "block";


  document
    .getElementById("readyMessage")
    .style.display =
      "none";


  updateOrder();


  listenForReadyOrder(number);


  window.scrollTo({

    top:
      document.body.scrollHeight,

    behavior:
      "smooth"

  });

}



/* =========================
   إضافة صنف للطلب
========================= */

function addItem(item) {

  order.push({

    name:
      item.name,

    price:
      item.price,

    station:
      item.station

  });


  updateOrder();

}



/* =========================
   عرض الطلب
========================= */

function updateOrder() {

  const list =
    document.getElementById("orderList");


  if (order.length === 0) {

    list.innerHTML =
      "Henüz ürün eklenmedi.";

    return;

  }


  list.innerHTML = "";


  order.forEach(
    (item, index) => {

      const row =
        document.createElement("div");


      row.className =
        "order-item";


      const text =
        document.createElement("span");


      text.textContent =
        (index + 1) +
        ". " +
        item.name;


      const remove =
        document.createElement("button");


      remove.className =
        "remove";


      remove.textContent =
        "×";


      remove.onclick =
        function() {

          order.splice(index, 1);

          updateOrder();

        };


      row.appendChild(text);

      row.appendChild(remove);

      list.appendChild(row);

    }
  );

}



/* =========================
   إرسال الطلب
========================= */

window.sendOrder =
async function() {


  if (!selectedTable) {

    alert(
      "Lütfen masa seçin."
    );

    return;

  }


  if (order.length === 0) {

    alert(
      "Lütfen sipariş ekleyin."
    );

    return;

  }



  try {


    /*
      هنا نرسل الطلب كاملًا إلى orders.
      كل صنف يحتوي station.
      لذلك الشوي والفرن والمطبخ
      يستطيعون معرفة أصنافهم.
    */


    await addDoc(
      collection(db, "orders"),
      {

        table:
          selectedTable,

        items:
          order.map(
            (item) => ({

              name:
                item.name,

              price:
                item.price,

              station:
                item.station

            })
          ),

        status:
          "new",

        createdAt:
          serverTimestamp()

      }
    );



    alert(
      "Masa " +
      selectedTable +
      " siparişi mutfağa gönderildi! 👨‍🍳"
    );


    order = [];


    updateOrder();


    setTableBusy(
      selectedTable
    );


  } catch (error) {


    console.error(error);


    alert(
      "Sipariş gönderilemedi. Firebase bağlantısını kontrol edin."
    );

  }

};



/* =========================
   حالة الطاولة
========================= */

function setTableBusy(number) {

  const button =
    document.getElementById(
      "table-" + number
    );


  if (!button) return;


  button.classList.add("dolu");


  const span =
    button.querySelector("span");


  if (span) {

    span.textContent =
      "Dolu";

  }

}



/* =========================
   الطلب الجاهز
========================= */

function listenForReadyOrder(
  tableNumber
) {


  const readyMessage =
    document.getElementById(
      "readyMessage"
    );


  const q =
    query(
      collection(db, "orders"),

      where(
        "table",
        "==",
        tableNumber
      ),

      where(
        "status",
        "==",
        "ready"
      )
    );


  onSnapshot(
    q,
    (snapshot) => {


      if (!selectedTable) {
        return;
      }


      if (
        selectedTable !== tableNumber
      ) {
        return;
      }


      if (!snapshot.empty) {


        readyMessage.style.display =
          "block";


        readyMessage.innerText =
          "✅ Masa " +
          tableNumber +
          " Sipariş Hazır!";


      } else {


        readyMessage.style.display =
          "none";

      }

    }
  );

}



/* =========================
   تحديث الطاولات تلقائيًا
========================= */

onSnapshot(
  collection(db, "orders"),
  (snapshot) => {


    const busyTables =
      new Set();


    snapshot.forEach(
      (orderDoc) => {

        const data =
          orderDoc.data();


        if (
          data.table &&
          data.status !== "completed" &&
          data.status !== "deleted"
        ) {

          busyTables.add(
            Number(data.table)
          );

        }

      }
    );



    for (
      let i = 1;
      i <= 15;
      i++
    ) {


      const button =
        document.getElementById(
          "table-" + i
        );


      if (!button) continue;


      const span =
        button.querySelector("span");


      if (
        busyTables.has(i)
      ) {


        button.classList.add(
          "dolu"
        );


        if (span) {

          span.textContent =
            "Dolu";

        }


      } else {


        button.classList.remove(
          "dolu"
        );


        if (span) {

          span.textContent =
            "Boş";

        }

      }

    }

  }
);

</script>

</body>
</html>
