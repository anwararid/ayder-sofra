<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayder Sofra - Garson Paneli</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #fafafa;
  color: #222;
}

header {
  background: #16803c;
  color: white;
  text-align: center;
  padding: 20px 10px;
}

header h1 {
  margin: 0;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

.section-title {
  font-size: 18px;
  font-weight: bold;
  margin: 15px 0 10px 0;
}

.tables-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.table-btn {
  padding: 15px 5px;
  border: 2px solid #ccc;
  border-radius: 12px;
  background: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  text-align: center;
}

.table-btn.selected {
  border-color: #16803c;
  background: #e8f5e9;
}

.table-btn.busy {
  background: #ffebee;
  border-color: #c62828;
  color: #c62828;
}

.table-btn.has-ready {
  background: #e8f5e9;
  border-color: #2e7d32;
  color: #2e7d32;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.03); }
  100% { transform: scale(1); }
}

.filter-bar {
  display: flex;
  gap: 8px;
  margin: 15px 0;
  overflow-x: auto;
  padding-bottom: 5px;
}

.filter-btn {
  padding: 8px 14px;
  border: 1px solid #ddd;
  border-radius: 20px;
  background: white;
  white-space: nowrap;
  cursor: pointer;
}

.filter-btn.active {
  background: #16803c;
  color: white;
  border-color: #16803c;
}

.menu-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.food-card {
  background: white;
  border: 1px solid #eee;
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.food-name {
  font-weight: bold;
  font-size: 15px;
  margin-bottom: 5px;
}

.food-price {
  color: #16803c;
  font-weight: bold;
}

.food-station {
  font-size: 11px;
  color: #777;
  margin-top: 3px;
}

.add-btn {
  margin-top: 10px;
  padding: 8px;
  border: none;
  border-radius: 8px;
  background: #16803c;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.cart-card {
  background: white;
  border-radius: 15px;
  padding: 15px;
  margin-top: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid #eee;
}

.cart-controls button {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid #ccc;
  background: #f0f0f0;
  font-weight: bold;
  cursor: pointer;
}

.btn-send {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #16803c;
  color: white;
  font-size: 17px;
  font-weight: bold;
  margin-top: 15px;
  cursor: pointer;
}

.btn-clear-table {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: #c62828;
  color: white;
  font-size: 15px;
  font-weight: bold;
  margin-top: 10px;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: #888;
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <h1>🍽️ AYDER SOFRA</h1>
  <p>Garson Sipariş Paneli</p>
</header>

<main>

  <div class="section-title">🪑 Masalar</div>
  <div class="tables-grid" id="tablesGrid"></div>

  <div class="section-title">📋 Menü</div>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterMenu('all')">Tümü</button>
    <button class="filter-btn" onclick="filterMenu('grill')">🔥 Şef Izgara</button>
    <button class="filter-btn" onclick="filterMenu('oven')">🥖 Fırın</button>
    <button class="filter-btn" onclick="filterMenu('kitchen')">👨‍🍳 Mutfak</button>
  </div>

  <div class="menu-grid" id="menuGrid">
    <div class="empty">Menü yükleniyor...</div>
  </div>

  <div class="cart-card">
    <div class="section-title" style="margin-top:0;">🛒 Seçilen Masa: <span id="selectedTableTitle">Seçilmedi</span></div>
    <div id="cartList">
      <div class="empty">Lütfen önce bir masa seçin ve ürün ekleyin.</div>
    </div>
    <div id="cartTotal" style="font-weight: bold; font-size: 18px; margin-top: 15px; text-align: right;">Top Toplam: 0 TL</div>
    <button class="btn-send" id="sendBtn" disabled>Siparişi Mutfaklara Gönder 🚀</button>
    <button class="btn-clear-table" id="clearTableBtn" style="display:none;">Masayı Boşalt / Hesap Ödendi 💳</button>
  </div>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  where,
  getDocs,
  doc,
  updateDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDhvLb2QMMe7dy-vQ_3bwKtZK5XXy8lbWM",
  authDomain: "ayder-sofra.firebaseapp.com",
  projectId: "ayder-sofra",
  storageBucket: "ayder-sofra.firebasestorage.app",
  messagingSenderId: "459245770853",
  appId: "1:459245770853:web:8d32163fef443a2b7c8e8c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let selectedTable = null;
let cart = [];
let fullMenu = [];
let activeOrders = [];

const tablesGrid = document.getElementById("tablesGrid");
const menuGrid = document.getElementById("menuGrid");
const cartList = document.getElementById("cartList");
const cartTotal = document.getElementById("cartTotal");
const selectedTableTitle = document.getElementById("selectedTableTitle");
const sendBtn = document.getElementById("sendBtn");
const clearTableBtn = document.getElementById("clearTableBtn");

// إنشاء 12 طاولة
function renderTables() {
  tablesGrid.innerHTML = "";
  for (let i = 1; i <= 12; i++) {
    const btn = document.createElement("button");
    btn.className = "table-btn";
    btn.textContent = "Masa " + i;

    const tableOrders = activeOrders.filter(o => Number(o.table) === i);
    const hasReady = tableOrders.some(o => o.status === "ready");
    const isBusy = tableOrders.length > 0;

    if (hasReady) {
      btn.classList.add("has-ready");
      btn.textContent += " ✅";
    } else if (isBusy) {
      btn.classList.add("busy");
      btn.textContent += " ⏳";
    }

    if (selectedTable === i) {
      btn.classList.add("selected");
    }

    btn.addEventListener("click", () => selectTable(i));
    tablesGrid.appendChild(btn);
  }
}

function selectTable(tableNum) {
  selectedTable = tableNum;
  selectedTableTitle.textContent = "Masa " + tableNum;
  cart = [];
  renderCart();
  renderTables();

  const isBusy = activeOrders.some(o => Number(o.table) === tableNum);
  clearTableBtn.style.display = isBusy ? "block" : "none";
}

// تحميل وجبات المنيو
onSnapshot(collection(db, "menu"), (snapshot) => {
  fullMenu = [];
  snapshot.forEach(doc => {
    fullMenu.push({ id: doc.id, ...doc.data() });
  });
  renderMenu(fullMenu);
});

window.filterMenu = function(filter) {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");

  if (filter === "all") {
    renderMenu(fullMenu);
  } else {
    renderMenu(fullMenu.filter(m => m.station === filter));
  }
};

function renderMenu(items) {
  menuGrid.innerHTML = "";
  if (items.length === 0) {
    menuGrid.innerHTML = `<div class="empty">Bu kategoride ürün bulunamadı.</div>`;
    return;
  }

  items.forEach(item => {
    const card = document.createElement("div");
    card.className = "food-card";

    let stName = "👨‍🍳 Mutfak";
    if (item.station === "grill") stName = "🔥 Şef Izgara";
    if (item.station === "oven") stName = "🥖 Fırın";

    card.innerHTML = `
      <div>
        <div class="food-name">${item.name}</div>
        <div class="food-price">${item.price} TL</div>
        <div class="food-station">${stName}</div>
      </div>
      <button class="add-btn">Ekle +</button>
    `;

    card.querySelector(".add-btn").addEventListener("click", () => addToCart(item));
    menuGrid.appendChild(card);
  });
}

function addToCart(item) {
  if (!selectedTable) {
    alert("Lütfen önce bir masa seçin!");
    return;
  }

  const existing = cart.find(c => c.id === item.id);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ ...item, qty: 1 });
  }
  renderCart();
}

function renderCart() {
  cartList.innerHTML = "";
  let total = 0;

  if (cart.length === 0) {
    cartList.innerHTML = `<div class="empty">Sepet boş.</div>`;
    sendBtn.disabled = true;
    cartTotal.textContent = "Toplam: 0 TL";
    return;
  }

  sendBtn.disabled = false;
  cart.forEach(item => {
    total += item.price * item.qty;
    const itemDiv = document.createElement("div");
    itemDiv.className = "cart-item";
    itemDiv.innerHTML = `
      <div>
        <strong>${item.name}</strong> (${item.price} TL)
      </div>
      <div class="cart-controls">
        <button class="minus">-</button>
        <span style="margin: 0 8px; font-weight:bold;">${item.qty}</span>
        <button class="plus">+</button>
      </div>
    `;

    itemDiv.querySelector(".minus").addEventListener("click", () => changeQty(item.id, -1));
    itemDiv.querySelector(".plus").addEventListener("click", () => changeQty(item.id, 1));
    cartList.appendChild(itemDiv);
  });

  cartTotal.textContent = `Toplam: ${total} TL`;
}

function changeQty(id, change) {
  const item = cart.find(c => c.id === id);
  if (!item) return;
  item.qty += change;
  if (item.qty <= 0) {
    cart = cart.filter(c => c.id !== id);
  }
  renderCart();
}

// متابعة حالة الطاولات والطلبات النشطة
onSnapshot(collection(db, "orders"), (snapshot) => {
  activeOrders = [];
  snapshot.forEach(doc => {
    const data = doc.data();
    if (data.status === "new" || data.status === "ready") {
      activeOrders.push({ id: doc.id, ...data });
    }
  });
  renderTables();
});

// إرسال الطلب وتفكيكه حسب أقسام المطبخ
sendBtn.addEventListener("click", async () => {
  if (!selectedTable || cart.length === 0) return;

  sendBtn.disabled = true;

  try {
    // تجميع الوجبات حسب أقسامها
    const stationsGroup = {};

    cart.forEach(item => {
      const st = item.station || "kitchen";
      if (!stationsGroup[st]) stationsGroup[st] = [];

      for (let i = 0; i < item.qty; i++) {
        stationsGroup[st].push({ name: item.name, price: item.price });
      }
    });

    // إرسال طلب مستقل لكل قسم مستهدف
    const promises = Object.keys(stationsGroup).map(stationName => {
      return addDoc(collection(db, "orders"), {
        table: selectedTable,
        station: stationName,
        items: stationsGroup[stationName],
        status: "new",
        createdAt: serverTimestamp()
      });
    });

    await Promise.all(promises);

    alert(`Masa ${selectedTable} siparişi ilgili bölümlere başarıyla gönderildi! 🚀`);
    cart = [];
    renderCart();
  } catch (err) {
    console.error(err);
    alert("Sipariş gönderilirken hata oluştu.");
  } finally {
    sendBtn.disabled = false;
  }
});

// إخلاء الطاولة وتغيير حالة كافة طلباتها إلى completed
clearTableBtn.addEventListener("click", async () => {
  if (!selectedTable) return;
  if (!confirm(`Masa ${selectedTable} boşaltılsın ve ödeme tamamlansın mı?`)) return;

  try {
    const q = query(
      collection(db, "orders"),
      where("table", "==", selectedTable),
      where("status", "in", ["new", "ready"])
    );
    const snapshot = await getDocs(q);

    const updatePromises = snapshot.docs.map(docSnapshot => {
      return updateDoc(doc(db, "orders", docSnapshot.id), { status: "completed" });
    });

    await Promise.all(updatePromises);
    alert(`Masa ${selectedTable} başarıyla boşaltıldı.`);
    selectTable(selectedTable);
  } catch (err) {
    console.error(err);
    alert("Masa boşaltılırken hata oluşتو.");
  }
});
</script>

</body>
</html>
