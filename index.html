<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayder Sofra</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #222;
  color: white;
  text-align: center;
  padding: 22px 10px;
}

header h1 {
  margin: 0;
}

main {
  padding: 20px;
  max-width: 700px;
  margin: auto;
}

h2 {
  margin-top: 5px;
}

.tables {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.table {
  border: none;
  border-radius: 15px;
  padding: 22px 5px;
  background: #d9f7df;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.table.dolu {
  background: #ffd9d9;
}

.table span {
  display: block;
  font-size: 12px;
  margin-top: 7px;
  font-weight: normal;
}

.ready-status {
  color: #16803c;
  font-size: 13px;
  font-weight: bold;
  margin-top: 6px;
}

.menu {
  display: none;
  margin-top: 25px;
  background: white;
  padding: 20px;
  border-radius: 15px;
}

.food {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid #ddd;
}

.food button {
  background: #222;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 9px 17px;
  font-size: 20px;
}

.order {
  margin-top: 20px;
  padding-top: 15px;
  border-top: 2px solid #ddd;
}

.send,
.empty-table {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.send {
  background: #16803c;
}

.empty-table {
  background: #555;
}

@media(max-width:500px) {
  .tables {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>🍽️ AYDER SOFRA</h1>
  <p>Restoran Yönetim Sistemi</p>
</header>

<main>

<h2>🪑 Masalar</h2>

<div class="tables" id="tables"></div>

<div class="menu" id="menu">

  <h2 id="tableTitle">Masa</h2>

  <div class="food">
    <span>🥘 Adana Kebap</span>
    <button onclick="addItem('Adana Kebap')">+</button>
  </div>

  <div class="food">
    <span>🍗 Tavuk Şiş</span>
    <button onclick="addItem('Tavuk Şiş')">+</button>
  </div>

  <div class="food">
    <span>🍲 Mercimek Çorbası</span>
    <button onclick="addItem('Mercimek Çorbası')">+</button>
  </div>

  <div class="food">
    <span>🥗 Salata</span>
    <button onclick="addItem('Salata')">+</button>
  </div>

  <div class="food">
    <span>🥤 Ayran</span>
    <button onclick="addItem('Ayran')">+</button>
  </div>

  <div class="order">

    <h3>🧾 Sipariş</h3>

    <div id="orderList">
      Henüz ürün eklenmedi.
    </div>

    <button class="send" onclick="sendOrder()">
      Siparişi Gönder 👨‍🍳
    </button>

    <button class="empty-table" onclick="emptyTable()">
      🧹 Masa Boşalt
    </button>

  </div>

</div>

</main>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  onSnapshot,
  query,
  where,
  getDocs,
  setDoc,
  doc
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyDhvLb2QMMe7dy-vQ_3bwKtZK5XXy8lbWM",
  authDomain: "ayder-sofra.firebaseapp.com",
  projectId: "ayder-sofra",
  storageBucket: "ayder-sofra.firebasestorage.app",
  messagingSenderId: "459245770853",
  appId: "1:459245770853:web:8d32163fef443a2b7c8e8c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let selectedTable = null;
let order = [];

const tables = document.getElementById("tables");


/* إنشاء 15 طاولة */

for (let i = 1; i <= 15; i++) {

  const button = document.createElement("button");

  button.className = "table";
  button.id = "table-" + i;

  button.innerHTML = `
    Masa ${i}
    <span class="table-status">🟢 Boş</span>
    <div class="ready-status" style="display:none;">
      🟢 Sipariş Hazır
    </div>
  `;

  button.onclick = function() {
    openTable(i);
  };

  tables.appendChild(button);
}


/* متابعة حالة الطاولات فقط */

onSnapshot(
  collection(db, "tables"),
  (snapshot) => {

    for (let i = 1; i <= 15; i++) {

      const button =
        document.getElementById("table-" + i);

      button.classList.remove("dolu");

      button.querySelector(
        ".table-status"
      ).textContent = "🟢 Boş";

      button.querySelector(
        ".ready-status"
      ).style.display = "none";
    }


    snapshot.forEach((tableDoc) => {

      const data = tableDoc.data();

      const number = Number(tableDoc.id);

      if (number < 1 || number > 15) {
        return;
      }

      const button =
        document.getElementById(
          "table-" + number
        );

      if (data.status === "occupied") {

        button.classList.add("dolu");

        button.querySelector(
          ".table-status"
        ).textContent = "🔴 Dolu";
      }

      if (data.ready === true) {

        button.querySelector(
          ".ready-status"
        ).style.display = "block";

        button.querySelector(
          ".ready-status"
        ).textContent =
          "🟢 Sipariş Hazır";
      }

    });

  }
);


/* فتح الطاولة */

function openTable(number) {

  selectedTable = number;
  order = [];

  document.getElementById(
    "tableTitle"
  ).innerText = "Masa " + number;

  document.getElementById(
    "menu"
  ).style.display = "block";

  updateOrder();

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}


/* إضافة صنف */

window.addItem = function(item) {

  order.push(item);

  updateOrder();
};


/* عرض الطلب */

function updateOrder() {

  const list =
    document.getElementById("orderList");

  if (order.length === 0) {

    list.innerHTML =
      "Henüz ürün eklenmedi.";

    return;
  }

  list.innerHTML =
    order.map(
      (item, index) =>
        (index + 1) + ". " + item
    ).join("<br>");
}


/* إرسال الطلب */

window.sendOrder = async function() {

  if (!selectedTable) {

    alert("Lütfen masa seçin.");
    return;
  }

  if (order.length === 0) {

    alert("Lütfen sipariş ekleyin.");
    return;
  }

  try {

    /* الطاولة تصبح مشغولة */

    await setDoc(
      doc(db, "tables", String(selectedTable)),
      {
        status: "occupied",
        ready: false,
        updatedAt: serverTimestamp()
      },
      { merge: true }
    );


    /* إرسال الطلب للمطبخ */

    await addDoc(
      collection(db, "orders"),
      {
        table: selectedTable,
        items: [...order],
        status: "new",
        createdAt: serverTimestamp()
      }
    );


    alert(
      "Masa " +
      selectedTable +
      " siparişi mutfağa gönderildi! 👨‍🍳"
    );

    order = [];

    updateOrder();

  } catch (error) {

    console.error(error);

    alert(
      "Sipariş gönderilemedi."
    );
  }
};


/* تفريغ الطاولة */

window.emptyTable = async function() {

  if (!selectedTable) {

    alert("Lütfen masa seçin.");
    return;
  }

  const ok = confirm(
    "Masa " +
    selectedTable +
    " boşaltılacak. Emin misiniz?"
  );

  if (!ok) {
    return;
  }

  try {

    /*
      هنا أهم جزء:
      الطاولة نفسها تصبح فارغة
    */

    await setDoc(
      doc(
        db,
        "tables",
        String(selectedTable)
      ),
      {
        status: "empty",
        ready: false,
        updatedAt: serverTimestamp()
      },
      { merge: true }
    );


    /*
      الطلبات القديمة لا نستخدمها
      لتحديد Dolu/Boş.
    */

    alert(
      "Masa " +
      selectedTable +
      " artık boş. 🟢"
    );


    document.getElementById(
      "menu"
    ).style.display = "none";

    selectedTable = null;
    order = [];

  } catch (error) {

    console.error(error);

    alert(
      "Masa boşaltılamadı."
    );
  }
};

</script>

</body>
</html>
