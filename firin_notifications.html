<head>

  <meta charset="utf-8">

    content="width=device-width,initial-scale=1"
  >

  <title>Ayder Sofra | Fırın</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>


<body>


<script type="module">

import {
  shell,
  listenOrders,
  setStatus,
  esc,
  toast
} from "./app.js";


/* ==================================================
   SAYFA
================================================== */

const content =
  shell(
    "Fırın",
    "Fırın siparişlerini takip edin."
  );
 const content = shell(
  "Fırın",
  "..."
);

if (!document.querySelector(".home-button")) {
  const homeButton = document.createElement("a");

  homeButton.href = "./index.html";
  homeButton.className = "home-button";
  homeButton.textContent = "← Ana Sayfa";

  document.body.appendChild(homeButton);
}


/* ==================================================
   FIRIN ARAYÜZÜ
================================================== */

content.innerHTML = `

  <main class="oven-page">


    <!-- ==========================================
         HERO
    =========================================== -->

    <section class="oven-hero">

      <div class="oven-hero-overlay"></div>


      <div class="oven-hero-content">


        <div class="oven-brand">
          AYDER SOFRA 🍽️
        </div>


        <div class="oven-title-row">

          <div>

            <div class="oven-label">
              🔥 FIRIN
            </div>

            <h1>
              Fırın Siparişleri
            </h1>

            <p>
              Fırından çıkan lezzetleri
              zamanında hazırlayın ve yönetin.
            </p>

          </div>


          <div class="oven-system-status">

            <span class="oven-status-dot"></span>

            Sistem Aktif

          </div>

        </div>


      </div>

    </section>



    <!-- ==========================================
         İSTATİSTİKLER
    =========================================== -->

    <section class="oven-stats">


      <div class="oven-stat-card">

        <div class="oven-stat-icon">
          📋
        </div>

        <div class="oven-stat-content">

          <span>
            AKTİF SİPARİŞ
          </span>

          <strong id="activeCount">
            0
          </strong>

          <small>
            Toplam aktif sipariş
          </small>

        </div>

      </div>



      <div class="oven-stat-card">

        <div class="oven-stat-icon preparing">
          🔥
        </div>

        <div class="oven-stat-content">

          <span>
            HAZIRLANIYOR
          </span>

          <strong id="preparingCount">
            0
          </strong>

          <small>
            Hazırlanmakta olan
          </small>

        </div>

      </div>



      <div class="oven-stat-card">

        <div class="oven-stat-icon ready">
          ✓
        </div>

        <div class="oven-stat-content">

          <span>
            HAZIR
          </span>

          <strong id="readyCount">
            0
          </strong>

          <small>
            Servise hazır
          </small>

        </div>

      </div>


    </section>



    <!-- ==========================================
         SİPARİŞ BÖLÜMÜ
    =========================================== -->

    <section class="oven-orders-section">


      <div class="oven-section-header">


        <div class="oven-section-title">


          <div class="oven-mini-icon">
            🔥
          </div>


          <div>

            <h2>
              FIRIN SİPARİŞLERİ
            </h2>

            <p>
              Fırına gönderilen aktif siparişler
            </p>

          </div>


        </div>


        <div class="oven-order-info">
          Canlı Siparişler
        </div>


      </div>



      <!-- ========================================
           SİPARİŞLER
      ========================================= -->

      <div
        id="orders"
        class="oven-orders-grid"
      ></div>


    </section>



    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer class="oven-footer">

      <div class="oven-footer-food">
        🥙
        🍕
        🫓
        🥙
      </div>

      <div class="oven-footer-text">
        Lezzet, ustalıkla pişer.
      </div>

    </footer>


  </main>

`;



/* ==================================================
   ELEMENTLER
================================================== */

const ordersEl =
  content.querySelector(
    "#orders"
  );


const activeCount =
  content.querySelector(
    "#activeCount"
  );


const preparingCount =
  content.querySelector(
    "#preparingCount"
  );


const readyCount =
  content.querySelector(
    "#readyCount"
  );



/* ==================================================
   STATUS
================================================== */

function getStatusInfo(status) {


  if (
    status === "preparing"
  ) {

    return {

      text:
        "HAZIRLANIYOR",

      icon:
        "🔥",

      className:
        "preparing"

    };

  }


  if (
    status === "ready"
  ) {

    return {

      text:
        "HAZIR",

      icon:
        "✓",

      className:
        "ready"

    };

  }


  return {

    text:
      "YENİ SİPARİŞ",

    icon:
      "●",

    className:
      "pending"

  };

}



/* ==================================================
   RENDER
================================================== */

function render(
  orders
) {


  /* ================================================
     AKTİF SİPARİŞLER
  ================================================ */

  const activeOrders =

    orders.filter(
      order =>

        [
          "pending",
          "preparing",
          "ready"
        ].includes(
          order.status
        )
    );



  /* ================================================
     SADECE FIRIN ÜRÜNLERİ OLAN SİPARİŞLER
  ================================================ */

  const ovenOrders =

    activeOrders.filter(
      order => {

        const items =
          order.items || [];


        return items.some(
          item =>
            item.department ===
            "firin"
        );

      }
    );



  /* ================================================
     İSTATİSTİKLER
  ================================================ */

  activeCount.textContent =
    ovenOrders.length;


  preparingCount.textContent =

    ovenOrders.filter(
      order =>
        order.status ===
        "preparing"
    ).length;


  readyCount.textContent =

    ovenOrders.filter(
      order =>
        order.status ===
        "ready"
    ).length;



  /* ================================================
     BOŞ
  ================================================ */

  if (
    !ovenOrders.length
  ) {

    ordersEl.innerHTML = `

      <div class="oven-empty">

        <div class="oven-empty-icon">
          🔥
        </div>

        <h3>
          Şu anda sipariş yok
        </h3>

        <p>
          Fırın için yeni sipariş geldiğinde
          burada görünecek.
        </p>

      </div>

    `;

    return;

  }



  /* ================================================
     SİPARİŞLER
  ================================================ */

  ordersEl.innerHTML =

    ovenOrders.map(
      order => {


        /* ==========================================
           FIRIN ÜRÜNLERİ
        =========================================== */

        const items =

          (
            order.items || []
          ).filter(
            item =>
              item.department ===
              "firin"
          );


        if (
          !items.length
        ) {

          return "";

        }



        /* ==========================================
           STATUS
        =========================================== */

        const status =
          getStatusInfo(
            order.status
          );



        /* ==========================================
           ITEMS
        =========================================== */

        const itemsHtml =

          items.map(
            item => `

              <div class="oven-product">

                <div class="oven-product-qty">

                  ${Number(
                    item.qty || 0
                  )}

                </div>


                <div class="oven-product-info">

                  <strong>
                    ${esc(
                      item.name
                    )}
                  </strong>

                </div>

              </div>

            `
          ).join("");



        /* ==========================================
           ACTION
        =========================================== */

        let actionHtml =
          "";


        if (
          order.status ===
          "pending"
        ) {

          actionHtml = `

            <button

              type="button"

              class="
                oven-action
                oven-action-start
              "

              data-id="${esc(
                order.id
              )}"

              data-status="preparing"

            >

              🔥
              HAZIRLAMAYA AL

            </button>

          `;

        }


        else if (
          order.status ===
          "preparing"
        ) {

          actionHtml = `

            <button

              type="button"

              class="
                oven-action
                oven-action-ready
              "

              data-id="${esc(
                order.id
              )}"

              data-status="ready"

            >

              ✓
              HAZIR

            </button>

          `;

        }


        else if (
          order.status ===
          "ready"
        ) {

          actionHtml = `

            <button

              type="button"

              class="
                oven-action
                oven-action-served
              "

              data-id="${esc(
                order.id
              )}"

              data-status="served"

            >

              🍽️
              SERVİS EDİLDİ

            </button>

          `;

        }



        /* ==========================================
           CARD
        =========================================== */

        return `

          <article
            class="
              oven-order-card
              ${status.className}
            "
          >


            <!-- CARD HEADER -->

            <div class="oven-card-header">


              <div>

                <span class="oven-table-label">
                  MASA
                </span>

                <h3 class="oven-table-number">

                  ${esc(
                    order.table
                  )}

                </h3>

              </div>


              <div
                class="
                  oven-order-status
                  ${status.className}
                "
              >

                ${status.icon}

                ${status.text}

              </div>


            </div>



            <!-- ITEMS -->

            <div class="oven-products">

              ${itemsHtml}

            </div>



            <!-- DIVIDER -->

            <div class="oven-divider"></div>



            <!-- ACTION -->

            <div class="oven-card-action">

              ${actionHtml}

            </div>


          </article>

        `;

      }
    ).join("");


}



/* ==================================================
   NOTIFICATION + SOUND
================================================== */

let ovenAudioContext = null;
let previousOvenOrders = new Set();
let ovenNotificationStyleAdded = false;

function playOvenNotificationSound() {
  try {
    if (!ovenAudioContext) {
      ovenAudioContext =
        new (window.AudioContext || window.webkitAudioContext)();
    }

    if (ovenAudioContext.state === "suspended") {
      ovenAudioContext.resume();
    }

    const now = ovenAudioContext.currentTime;

    const oscillator = ovenAudioContext.createOscillator();
    const gain = ovenAudioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(880, now);
    oscillator.frequency.setValueAtTime(660, now + 0.18);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.8, now + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

    oscillator.connect(gain);
    gain.connect(ovenAudioContext.destination);

    oscillator.start(now);
    oscillator.stop(now + 0.55);
  } catch (error) {
    console.error("Fırın notification sound error:", error);
  }
}

function addOvenNotificationStyles() {
  if (ovenNotificationStyleAdded) return;

  const style = document.createElement("style");

  style.textContent = `
    .oven-notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      width: min(92vw, 430px);
      background: #ffffff;
      color: #17212b;
      border: 3px solid #d85e55;
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: 0 15px 45px rgba(0,0,0,.28);
      font-family: sans-serif;
      animation: ovenNotificationIn .25s ease;
    }

    @keyframes ovenNotificationIn {
      from {
        opacity: 0;
        transform: translate(-50%, -20px) scale(.96);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    .oven-notification-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .oven-notification-table {
      font-size: 19px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .oven-notification-items {
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 14px;
    }

    .oven-notification-close {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 11px;
      background: #164b5b;
      color: #ffffff;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }
  `;

  document.head.appendChild(style);
  ovenNotificationStyleAdded = true;
}

function showOvenNotification(order) {
  addOvenNotificationStyles();

  const tableNumber =
    order.table ??
    order.tableNumber ??
    "Bilinmiyor";

  const ovenItems = (order.items || []).filter(
    item => item.department === "firin"
  );

  if (!ovenItems.length) return;

  const notification = document.createElement("div");
  notification.className = "oven-notification";

  const itemsHtml = ovenItems.map(item => `
    <div>
      <strong>${Number(item.qty ?? item.quantity ?? 1)}</strong>
      × ${esc(item.name || "Ürün")}
    </div>
  `).join("");

  notification.innerHTML = `
    <div class="oven-notification-title">
      🔔 YENİ SİPARİŞ!
    </div>

    <div class="oven-notification-table">
      🔥 Masa ${esc(tableNumber)}
    </div>

    <div class="oven-notification-items">
      ${itemsHtml}
    </div>

    <button
      type="button"
      class="oven-notification-close"
    >
      TAMAM
    </button>
  `;

  document.body.appendChild(notification);

  playOvenNotificationSound();

  notification
    .querySelector(".oven-notification-close")
    .addEventListener("click", () => {
      notification.remove();
    });

  window.setTimeout(() => {
    if (notification.isConnected) {
      notification.remove();
    }
  }, 15000);
}


/* ==================================================
   FIREBASE LISTENER
================================================== */

listenOrders((incomingOrders) => {
  render(incomingOrders || []);

  const ovenOrders = (incomingOrders || []).filter(order => {
    const activeStatus = [
      "pending",
      "preparing",
      "ready"
    ].includes(order.status);

    const hasOvenItems = (order.items || []).some(
      item => item.department === "firin"
    );

    return activeStatus && hasOvenItems;
  });

  ovenOrders.forEach(order => {
    if (
      order.status === "pending" &&
      !previousOvenOrders.has(order.id)
    ) {
      showOvenNotification(order);
    }
  });

  previousOvenOrders = new Set(
    ovenOrders.map(order => order.id)
  );
});



/* ==================================================
   BUTTON ACTIONS
================================================== */

ordersEl.addEventListener(

  "click",

  async event => {


    const button =

      event.target.closest(
        "[data-status]"
      );


    if (
      !button
    ) {

      return;

    }


    const id =
      button.dataset.id;


    const status =
      button.dataset.status;


    /* ==============================================
       BUTTON DISABLE
    ============================================== */

    button.disabled =
      true;


    try {


      await setStatus(
        id,
        status
      );


      toast(
        "Sipariş güncellendi."
      );


    }

    catch (
      error
    ) {


      console.error(
        "Fırın sipariş hatası:",
        error
      );


      toast(
        "Sipariş güncellenemedi.",
        "error"
      );


      button.disabled =
        false;

    }

  }

);

</script>

</body>

</html>
